name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # No test suite exists yet, so the gate is that every module parses and
      # its imports resolve. That already catches the failure this repository
      # actually ships: a syntax slip or a dependency that was never declared.
      - name: Compile all modules
        run: python -m compileall -q .
