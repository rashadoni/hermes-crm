name: Deploy to Hetzner VDS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 178.156.249.177
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/hermes_crm
            cp api.py api.py.bak
            cp static/index.html static/index.html.bak
            cp static/portal.html static/portal.html.bak
            git pull origin main
            # Install in venv if exists, otherwise system pip
            if [ -d "/opt/hermes_crm/venv" ]; then
              /opt/hermes_crm/venv/bin/pip install anthropic twilio --quiet
              /opt/hermes_crm/venv/bin/python -c "from twilio.rest import Client; print('twilio OK in venv')"
            else
              pip3 install anthropic twilio --quiet
              python3 -c "from twilio.rest import Client; print('twilio OK system')"
            fi
            # Also try to find which python the service uses
            cat /etc/systemd/system/hermes-crm.service 2>/dev/null | grep -i exec || echo "no service file found"
            grep -q "ANTHROPIC_API_KEY" .env 2>/dev/null || echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
            # Gmail SMTP settings
            grep -q "SMTP_HOST" .env 2>/dev/null || cat >> .env << 'SMTP_EOF'
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_USER=rashadrahimsoy@gmail.com
            SMTP_PASS=dcbwjuomvjpjsrtv
            SMTP_FROM=rashadrahimsoy@gmail.com
            SMTP_EOF
            # Twilio SMS settings - force update
            sed -i '/^TWILIO_/d' .env
            echo "TWILIO_SID=ACf33431223261aecf78755c892baebd3d" >> .env
            echo "TWILIO_TOKEN=249cdf572ad19a1493f5d1a8355ad382" >> .env
            echo "TWILIO_FROM_NUMBER=+13509005853" >> .env
            # Clean up any leading whitespace in .env
            sed -i 's/^[[:space:]]*//' .env
            # Setup nginx for leaddrivecrm.org (one-time, idempotent)
            if [ ! -f /etc/nginx/sites-available/leaddrivecrm.org ]; then
              echo "Setting up nginx for leaddrivecrm.org..."
              cat > /etc/nginx/sites-available/leaddrivecrm.org << 'NGINX_EOF'
            server {
                listen 80;
                server_name leaddrivecrm.org www.leaddrivecrm.org;
                location / {
                    proxy_pass http://127.0.0.1:8766;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    client_max_body_size 50M;
                }
            }
            NGINX_EOF
              # Fix indentation in nginx config
              sed -i 's/^            //' /etc/nginx/sites-available/leaddrivecrm.org
              ln -sf /etc/nginx/sites-available/leaddrivecrm.org /etc/nginx/sites-enabled/
              nginx -t && systemctl reload nginx
              # Get SSL certificate (non-interactive)
              certbot --nginx -d leaddrivecrm.org -d www.leaddrivecrm.org --non-interactive --agree-tos -m rashadrahimsoy@gmail.com --redirect 2>&1 || echo "SSL setup pending (DNS may not be ready yet)"
            else
              echo "nginx config for leaddrivecrm.org already exists"
            fi
            systemctl restart hermes-crm
            sleep 2
            systemctl is-active hermes-crm && echo "✅ Deploy successful" || echo "❌ Deploy failed"
