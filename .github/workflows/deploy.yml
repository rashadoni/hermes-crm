name: Deploy to Hetzner VDS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 178.156.249.177
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/hermes_crm
            cp api.py api.py.bak
            cp static/index.html static/index.html.bak
            cp static/portal.html static/portal.html.bak
            git pull origin main
            pip install anthropic twilio --quiet 2>/dev/null || true
            grep -q "ANTHROPIC_API_KEY" .env 2>/dev/null || echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
            # Gmail SMTP settings
            grep -q "SMTP_HOST" .env 2>/dev/null || cat >> .env << 'SMTP_EOF'
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_USER=rashadrahimsoy@gmail.com
            SMTP_PASS=dcbwjuomvjpjsrtv
            SMTP_FROM=rashadrahimsoy@gmail.com
            SMTP_EOF
            # Twilio SMS settings
            grep -q "TWILIO_SID" .env 2>/dev/null || cat >> .env << 'TWILIO_EOF'
            TWILIO_SID=ACf33431223261aecf78755c892baebd3d
            TWILIO_TOKEN=249cdf572ad19a1493f5d1a8355ad382
            TWILIO_FROM_NUMBER=+13509005853
            TWILIO_EOF
            # Clean up any leading whitespace in .env
            sed -i 's/^[[:space:]]*//' .env
            systemctl restart hermes-crm
            sleep 2
            systemctl is-active hermes-crm && echo "✅ Deploy successful" || echo "❌ Deploy failed"
