name: Deploy to Hetzner VDS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 178.156.249.177
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 280s
          script: |
            set -e
            cd /opt/hermes_crm

            echo "═══════════════════════════════════════════════"
            echo "  Phase 1: Backup existing SQLite database"
            echo "═══════════════════════════════════════════════"
            BACKUP_DIR="/opt/hermes_crm/backups"
            mkdir -p "$BACKUP_DIR"
            if [ -f crm.db ]; then
              BACKUP_FILE="$BACKUP_DIR/crm_$(date +%Y%m%d_%H%M%S).db"
              cp crm.db "$BACKUP_FILE"
              echo "✅ SQLite backup: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
            else
              echo "⚠️  No crm.db found — fresh install"
            fi

            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  Phase 2: Install PostgreSQL (if needed)"
            echo "═══════════════════════════════════════════════"
            if ! command -v psql &> /dev/null; then
              echo "Installing PostgreSQL..."
              apt-get update -qq || true
              apt-get install -y -qq postgresql postgresql-contrib libpq-dev || apt-get install -y postgresql postgresql-contrib libpq-dev
              systemctl enable postgresql
              systemctl start postgresql
              echo "✅ PostgreSQL installed"
            else
              echo "✅ PostgreSQL already installed"
              systemctl is-active postgresql || systemctl start postgresql
            fi

            # Create database and user (idempotent)
            su - postgres -c "psql -tc \"SELECT 1 FROM pg_roles WHERE rolname='hermes'\" | grep -q 1 || psql -c \"CREATE ROLE hermes WITH LOGIN PASSWORD 'hermes';\"" 2>/dev/null || true
            su - postgres -c "psql -tc \"SELECT 1 FROM pg_database WHERE datname='hermes_crm'\" | grep -q 1 || psql -c \"CREATE DATABASE hermes_crm OWNER hermes;\"" 2>/dev/null || true
            su - postgres -c "psql -c \"GRANT ALL PRIVILEGES ON DATABASE hermes_crm TO hermes;\"" 2>/dev/null || true
            # Grant schema permissions
            su - postgres -c "psql -d hermes_crm -c \"GRANT ALL ON SCHEMA public TO hermes; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO hermes; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO hermes;\"" 2>/dev/null || true
            echo "✅ Database 'hermes_crm' and user 'hermes' ready"

            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  Phase 3: Pull code & install dependencies"
            echo "═══════════════════════════════════════════════"
            cp api.py api.py.bak
            cp database.py database.py.bak 2>/dev/null || true
            cp static/index.html static/index.html.bak
            git pull origin main

            # Ensure DejaVu fonts are installed for PDF generation
            dpkg -l fonts-dejavu-core >/dev/null 2>&1 || apt-get install -y -qq fonts-dejavu-core || true

            if [ -d "/opt/hermes_crm/venv" ]; then
              /opt/hermes_crm/venv/bin/pip install -r requirements.txt --quiet
              /opt/hermes_crm/venv/bin/pip install psycopg2-binary --quiet
              echo "✅ Dependencies installed (venv)"
            else
              pip3 install -r requirements.txt --quiet
              pip3 install psycopg2-binary --quiet
              echo "✅ Dependencies installed (system)"
            fi

            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  Phase 4: Configure environment"
            echo "═══════════════════════════════════════════════"
            # Add DATABASE_URL if not present
            grep -q "DATABASE_URL" .env 2>/dev/null || echo "DATABASE_URL=postgresql://hermes:hermes@localhost:5432/hermes_crm" >> .env
            grep -q "ANTHROPIC_API_KEY" .env 2>/dev/null || echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
            # Gmail SMTP settings — force update
            sed -i '/^SMTP_/d' .env 2>/dev/null || true
            cat >> .env << 'SMTP_EOF'
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_USER=rashadrahimsoy@gmail.com
            SMTP_PASS=dcbwjuomvjpjsrtv
            SMTP_FROM=rashadrahimsoy@gmail.com
            SMTP_EOF
            # Twilio SMS settings
            sed -i '/^TWILIO_/d' .env
            echo "TWILIO_SID=ACf33431223261aecf78755c892baebd3d" >> .env
            echo "TWILIO_TOKEN=249cdf572ad19a1493f5d1a8355ad382" >> .env
            echo "TWILIO_FROM_NUMBER=+13509005853" >> .env
            # Clean up whitespace
            sed -i 's/^[[:space:]]*//' .env
            echo "✅ Environment configured"

            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  Phase 5: Migrate data (SQLite → PostgreSQL)"
            echo "═══════════════════════════════════════════════"
            # Check if migration already done
            PG_TABLES=$(su - postgres -c "psql -d hermes_crm -tc \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public'\"" 2>/dev/null | tr -d ' ')
            PG_USERS=$(su - postgres -c "psql -d hermes_crm -tc \"SELECT COUNT(*) FROM users\" 2>/dev/null" 2>/dev/null | tr -d ' ')

            if [ "$PG_USERS" = "" ] || [ "$PG_USERS" = "0" ] || [ "$PG_USERS" = "" ]; then
              echo "Running migration..."
              if [ -d "/opt/hermes_crm/venv" ]; then
                /opt/hermes_crm/venv/bin/python migrate_sqlite_to_pg.py /opt/hermes_crm/crm.db
              else
                python3 migrate_sqlite_to_pg.py /opt/hermes_crm/crm.db
              fi
              echo "✅ Migration complete"
            else
              echo "✅ PostgreSQL already has data ($PG_USERS users) — skipping migration"
            fi

            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  Phase 6: Setup nginx (if needed)"
            echo "═══════════════════════════════════════════════"
            if [ ! -f /etc/nginx/sites-available/leaddrivecrm.org ]; then
              echo "Setting up nginx for leaddrivecrm.org..."
              cat > /etc/nginx/sites-available/leaddrivecrm.org << 'NGINX_EOF'
            server {
                listen 80;
                server_name leaddrivecrm.org www.leaddrivecrm.org;
                location / {
                    proxy_pass http://127.0.0.1:8766;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    client_max_body_size 50M;
                }
            }
            NGINX_EOF
              sed -i 's/^            //' /etc/nginx/sites-available/leaddrivecrm.org
              ln -sf /etc/nginx/sites-available/leaddrivecrm.org /etc/nginx/sites-enabled/
              nginx -t && systemctl reload nginx
              certbot --nginx -d leaddrivecrm.org -d www.leaddrivecrm.org --non-interactive --agree-tos -m rashadrahimsoy@gmail.com --redirect 2>&1 || echo "SSL setup pending"
            else
              echo "✅ nginx config already exists"
              if ! grep -q "ssl_certificate" /etc/nginx/sites-available/leaddrivecrm.org 2>/dev/null; then
                certbot --nginx -d leaddrivecrm.org -d www.leaddrivecrm.org --non-interactive --agree-tos -m rashadrahimsoy@gmail.com --redirect 2>&1 || echo "SSL still pending"
              fi
            fi
            nginx -t 2>&1 && systemctl reload nginx

            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  Phase 7: Restart service & verify"
            echo "═══════════════════════════════════════════════"
            systemctl restart hermes-crm
            sleep 3
            if systemctl is-active hermes-crm; then
              echo "✅ hermes-crm service is running"
              # Quick health check
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8766/api/health 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check passed (HTTP 200)"
              else
                echo "⚠️  Health check returned HTTP $HTTP_CODE — checking logs..."
                journalctl -u hermes-crm --no-pager -n 20
              fi
            else
              echo "❌ Service failed to start!"
              journalctl -u hermes-crm --no-pager -n 30
              exit 1
            fi

            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  ✅ Deploy successful — PostgreSQL active"
            echo "═══════════════════════════════════════════════"
