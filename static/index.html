// ─── Notifications Full Page ─────────────────────────────────
async function renderNotificationsPage(el) {
  showLoading(el);
  let filter = 'all';
  async function render(f) {
    filter = f || filter;
    const unreadOnly = filter === 'unread';
    const {data} = await api.get('/api/notifications?limit=100' + (unreadOnly ? '&unread_only=true' : ''));
    const items = data.items || [];
    const unread = data.unread || 0;
    const typeIcons = { lead_new:'🆕', lead_assigned:'👤', deal_stage_changed:'📊', deal_won:'🏆', deal_lost:'❌', task_assigned:'📋', task_overdue:'⚠️', task_due_today:'📅', contract_expiring:'⏰', contract_expired:'🔴', mention:'💬' };

    el.innerHTML = `
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">${_i._g('np_title')} ${unread ? `<span class="text-sm bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full ml-2">${unread}</span>` : ''}</h1>
        <div class="flex gap-2">
          ${unread ? `<button class="btn btn-sm btn-secondary" onclick="markAllNotifReadPage()">${_i._g('np_mark_all')}</button>` : ''}
        </div>
      </div>
      <div class="flex gap-2 mb-4">
        <button class="btn btn-sm ${filter==='all'?'btn-primary':'btn-secondary'}" onclick="filterNotifPage('all')">${_i._g('np_all')}</button>
        <button class="btn btn-sm ${filter==='unread'?'btn-primary':'btn-secondary'}" onclick="filterNotifPage('unread')">${_i._g('np_unread')} ${unread ? '('+unread+')' : ''}</button>
      </div>
      ${!items.length ? `<div class="card p-8 text-center"><p class="text-slate-500 text-lg">${_i._g('np_empty')}</p><p class="text-slate-600 text-sm mt-1">${_i._g('np_empty_desc')}</p></div>` :
        `<div class="space-y-2">${items.map(n => {
          const icon = typeIcons[n.type] || '🔔';
          const isUnread = n.is_read === 0;
          return `<div class="card p-4 cursor-pointer hover:bg-slate-800/50 transition ${isUnread ? 'border-l-4 border-l-indigo-500' : 'opacity-70'}" onclick="onNotifPageClick('${n.entity_type||''}',${n.entity_id||0},${n.id})">
            <div class="flex items-start gap-3">
              <span class="text-xl">${icon}</span>
              <div class="flex-1">
                <div class="font-medium">${esc(n.title)}</div>
                ${n.message ? `<div class="text-sm text-slate-400 mt-1">${esc(n.message)}</div>` : ''}
                <div class="text-xs text-slate-600 mt-2">${n.created_at ? new Date(n.created_at).toLocaleString() : ''}</div>
              </div>
              ${isUnread ? '<span class="w-2 h-2 rounded-full bg-indigo-500 mt-2"></span>' : ''}
            </div>
          </div>`;
        }).join('')}</div>`}
    `;
  }
  window.filterNotifPage = (f) => render(f);
  window.markAllNotifReadPage = async () => {
    await api.put('/api/notifications/read-all');
    loadNotifications();
    render(filter);
  };
  window.onNotifPageClick = async (type, id, notifId) => {
    if (notifId) {
      try { await api.put('/api/notifications/' + notifId + '/read'); loadNotifications(); } catch(e) {}
    }
    if (type === 'contact') showContactDetail(id);
    else if (type === 'contract') showContractDetail(id);
    else if (type === 'deal') showDealDetail(id);
    else if (type === 'lead') openLeadDetail(id);
    else if (type === 'task') { location.hash = '#/tasks'; }
    else render(filter);
  };
  await render('all');
}

              <td class="p-3">${ev.label}</td>

  `;
}

async function saveNotifPrefs() {
  const checkboxes = document.querySelectorAll('[data-event][data-channel]');
  const prefMap = {};
  checkboxes.forEach(cb => {
    const ev = cb.dataset.event;
    if (!prefMap[ev]) prefMap[ev] = { event_type: ev, channel_web: 0, channel_email: 0, channel_telegram: 0 };
    if (cb.dataset.channel === 'web') prefMap[ev].channel_web = cb.checked ? 1 : 0;
    if (cb.dataset.channel === 'email') prefMap[ev].channel_email = cb.checked ? 1 : 0;
    if (cb.dataset.channel === 'telegram') prefMap[ev].channel_telegram = cb.checked ? 1 : 0;
  });
  try {
    await api.put('/api/notification-preferences', { preferences: Object.values(prefMap) });
    showToast(_i._g('npp_saved'), 'success');
  } catch(e) { showToast(esc(e.message), 'error'); }
}

// ─── Leads Kanban View ───────────────────────────────────────
function _renderLeadsKanban(items) {
  const statuses = ['new','contacted','qualified','converted','unqualified'];
  const statusColors = {new:'#3b82f6',contacted:'#8b5cf6',qualified:'#f59e0b',converted:'#22c55e',unqualified:'#ef4444'};
  const columns = statuses.map(s => items.filter(i => i.status === s));

  return `<div class="flex gap-3 overflow-x-auto pb-4">
    ${statuses.map((status, idx) => `
      <div class="kanban-col" style="min-width:230px;flex:1" data-lead-status="${status}">
        <div class="font-semibold mb-3 pb-2 border-b text-sm" style="border-color:${statusColors[status]};color:${statusColors[status]}">
          ${t('lead_status_'+status)} <span class="text-slate-500">${columns[idx].length}</span>
        </div>
        <div class="space-y-2 min-h-[100px]" ondrop="onLeadDrop(event,'${status}')" ondragover="event.preventDefault()">
          ${columns[idx].map(item => {
            if (item.type === 'company') {
              return `<div class="kanban-card" onclick="showCompanyDetail(${item.id})">
                <div class="font-semibold text-sm">${esc(item.name)}</div>
                <div class="text-xs text-slate-500 mt-1">${esc(item.domain||'')}</div>
              </div>`;
            }
            const clickFn = item.isProspectCompany ? `showCompanyDetail(${item.companyId})` : `openLeadDetail(${item.id})`;
            return `<div class="kanban-card" draggable="${!item.isProspectCompany}" ondragstart="onLeadDragStart(event,${item.isProspectCompany?0:item.id})" onclick="${clickFn}">
              <div class="font-semibold text-sm">${esc(item.name)}</div>
              ${item.contact ? `<div class="text-xs text-slate-500 mt-1">${esc(item.contact)}</div>` : ''}
              <div class="flex items-center gap-1 mt-1">${_leadTempBadge(item.score)} ${item.score>0?'<span class="score-badge '+(item.score>=61?'score-high':item.score>=31?'score-medium':'score-low')+'">'+item.score+'</span>':''}</div>
              ${item.value ? `<div class="text-xs mt-1" style="color:#fcd34d">~${item.value.toLocaleString()} ₼</div>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}
  </div>`;
}

let _draggedLeadId = null;
function onLeadDragStart(e, id) { _draggedLeadId = id; e.dataTransfer.effectAllowed = 'move'; }
async function onLeadDrop(e, newStatus) {
  e.preventDefault();
  if (!_draggedLeadId) return;
  try {
    await api.put(`/api/leads/${_draggedLeadId}`, { status: newStatus });
    showToast(_i._g('ld_status_changed'), 'success');
    renderCompanyList(document.getElementById('app'), 'client');
  } catch(err) { showToast(esc(err.message), 'error'); }
  _draggedLeadId = null;
}

</script>

</body>
</html>
