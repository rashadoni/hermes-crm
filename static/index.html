let _formDirty = false;
function markFormDirty() { _formDirty = true; }
function clearFormDirty() { _formDirty = false; }

// Button loading state: prevents double-clicks during form submission
function withLoading(btn, asyncFn) {
  if (!btn || btn.disabled) return;
  const origHTML = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '0.6';
  btn.innerHTML = '<svg class="animate-spin" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline;vertical-align:text-bottom;"><circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="15"/></svg> ' + origHTML;
  return asyncFn().finally(() => {
    btn.disabled = false;
    btn.style.opacity = '';
    btn.innerHTML = origHTML;
  });
}

function trapFocus(modal) {
  const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  first.focus();
  modal.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    if (e.key === 'Escape') closeModal();
  });
}

function confirmDialog(message) {
  return new Promise(resolve => {
    const modal = document.getElementById('modalContainer');
    modal.innerHTML = `
      <div class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content" style="max-width:400px;text-align:center;">
          <p class="mb-6 text-lg">${message}</p>
          <div class="flex gap-3 justify-center">
            <button class="btn btn-danger" id="confirmYes">${t('btn_delete')}</button>
            <button class="btn btn-secondary" id="confirmNo">${t('btn_cancel')}</button>
          </div>
        </div>
      </div>`;
    document.getElementById('confirmYes').onclick = () => { modal.innerHTML = ''; resolve(true); };
    document.getElementById('confirmNo').onclick = () => { modal.innerHTML = ''; resolve(false); };
  });
}

function showModal(html) {
  const container = document.getElementById('modalContainer');
  container.innerHTML = `<div class="modal-overlay" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()"><div class="modal-content">${html}</div></div>`;
  trapFocus(container.querySelector('.modal-overlay'));
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  if (_formDirty) {
    confirmDialog(t('unsaved_changes')).then(ok => {
      if (ok) { _formDirty = false; _closeModal(); }
    });
    return;
  }
  _closeModal();
}

function _closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
  document.body.style.overflow = '';
  _formDirty = false;
}

// ─── Toast (max 5 stacked) ────────────────────────────────────
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  // Limit max toasts to prevent overflow
  while (container.children.length >= 5) container.firstChild.remove();
  const div = document.createElement('div');
  div.className = `toast toast-${type}`;
  div.textContent = msg;
  container.appendChild(div);
  setTimeout(() => { if (div.parentNode) div.remove(); }, 3000);
}

function renderMuqavileTable() {
  const tbody = document.getElementById('muqavileTableBody');
  if (!tbody) return;
  const filter = (_muqavileFilter || '').toLowerCase();
  const rows = _muqavileCompanies
    .filter(c => !filter || c.code.toLowerCase().includes(filter) ||
                  (c.legal_name||'').toLowerCase().includes(filter) ||
                  (c.group||'').toLowerCase().includes(filter));

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="px-4 py-6 text-center text-gray-500">Heç nə tapılmadı</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map((c, idx) => {
    const tplBadge = c.has_template
      ? `<span class="inline-block px-2 py-0.5 rounded text-xs bg-green-900 text-green-300">✓ ${t('muq_exists')}</span>`
      : `<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-700 text-gray-400">${t('muq_not_exists')}</span>`;
    const detBadge = c.has_details
      ? `<span class="inline-block px-2 py-0.5 rounded text-xs bg-blue-900 text-blue-300">✓ ${t('muq_exists')}</span>`
      : `<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-700 text-gray-400">${t('muq_not_exists')}</span>`;
    const lastImport = c.last_imported
      ? `<span class="text-xs text-gray-400">${c.last_imported.substring(0,10)}</span>`
      : `<span class="text-xs text-gray-600">—</span>`;
    const monthly = c.monthly_total > 0
      ? `<span class="text-green-400 font-mono text-xs">${c.monthly_total.toLocaleString('az-AZ', {minimumFractionDigits:2})} ₼</span>`
      : `<span class="text-gray-600">—</span>`;

    return `<tr class="border-b border-gray-800 hover:bg-gray-800/40 transition-colors">
      <td class="px-4 py-3 text-center text-gray-500 text-sm">${idx + 1}</td>
      <td class="px-4 py-3">
        <div class="font-medium text-sm">
          <a href="javascript:void(0)" onclick="openEditCompanyModal('${esc(c.code)}')" class="text-indigo-400 hover:text-indigo-300 hover:underline cursor-pointer">${esc(c.code)}</a>
        </div>
        ${c.legal_name
          ? `<div class="text-xs text-gray-400 mt-0.5">${esc(c.legal_name)}</div>`
          : `<div class="text-xs text-red-400 mt-0.5 cursor-pointer hover:underline" onclick="openEditCompanyModal('${esc(c.code)}')">+ ad əlavə et</div>`}
      </td>
      <td class="px-4 py-3 text-xs text-gray-400">${esc(c.group||'')}</td>
      <td class="px-4 py-3">${monthly}</td>
      <td class="px-4 py-3 text-center">${tplBadge}</td>
      <td class="px-4 py-3 text-center">${detBadge}</td>
      <td class="px-4 py-3">${lastImport}</td>
      <td class="px-4 py-3 text-center">
        ${c.has_own_qrp
          ? `<span class="inline-block px-2 py-0.5 rounded text-xs bg-purple-900 text-purple-300 cursor-pointer" title="Şirkətə xüsusi ${t('muq_qrp_template')} var. Dəyişmək üçün klik et" onclick="openUploadQrpModal('${esc(c.code)}')">✓ Öz</span>`
          : `<span class="inline-block px-2 py-0.5 rounded text-xs bg-purple-950 text-purple-500 cursor-pointer" title="Ümumi ${t('muq_qrp_template')} istifadə olunur. Xüsusi şablon yükləmək üçün klik et" onclick="openUploadQrpModal('${esc(c.code)}')">✓ ${t('muq_general')}</span>`}
      </td>
      <td class="px-4 py-3 text-right">
        <div class="flex gap-1 justify-end flex-wrap">
          <button class="btn btn-sm text-xs" style="background:#1e3a5f;color:#60a5fa" onclick="openExcelUploadModal('${esc(c.code)}','${esc(c.group||'')}')">📊 Excel</button>
          <button class="btn btn-sm text-xs" style="background:#0e4429;color:#4ade80" onclick="openPriceChangeModal('${esc(c.code)}')">💰 ${t('muq_price')}</button>
          ${c.has_template ? `<button class="btn btn-sm btn-primary text-xs" onclick="openGenerateModal('${esc(c.code)}')">📄 ${t('muq_contract')}</button>` : ''}
          <button class="btn btn-sm text-xs" style="background:#6b21a8;color:#e9d5ff" onclick="openGenerateQrpModal('${esc(c.code)}')">📋 QRP</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function onExcelGroupChange() {
  const group = document.getElementById('excelUploadGroup').value;
  const container = document.getElementById('excelCrmContainer');

  // Filter clients by selected group
  const filtered = group
    ? _excelCrmClientsAll.filter(c => c.group === group).map(c => c.name)
    : _excelCrmClientsAll.map(c => c.name);
  container.innerHTML = createSearchableDropdown({
    id: 'excelUploadCrmCompany',

    required: true
  }) + '<div id="excelCrmStatus" class="mt-1 text-xs text-yellow-400">ℹ️ Qrup dəyişdi — CRM şirkətini seçin (' + filtered.length + ' nəticə)</div>';

async function doExcelUpload() {
  const fileInput = document.getElementById('excelUploadFile');
  const code = document.getElementById('excelUploadCode').value.trim();
  const group = document.getElementById('excelUploadGroup').value.trim() || 'Separated';
  const crmCompany = document.getElementById('excelUploadCrmCompany').value.trim();
  const resultDiv = document.getElementById('excelUploadResult');
  const btn = document.getElementById('excelUploadBtn');

  if (!fileInput.files.length) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='Fayl seçin!'; resultDiv.classList.remove('hidden'); return; }
  if (!code) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='Şirkət kodu daxil edin!'; resultDiv.classList.remove('hidden'); return; }
  if (!group) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='Qrup seçmək məcburidir!'; resultDiv.classList.remove('hidden'); return; }
  if (!crmCompany) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='CRM şirkəti seçmək məcburidir!'; resultDiv.classList.remove('hidden'); return; }

  btn.disabled = true; btn.textContent = '⏳ Yüklənir...';
  resultDiv.className = 'text-yellow-400 text-sm'; resultDiv.textContent = 'Fayl emal olunur...'; resultDiv.classList.remove('hidden');

  // Save CRM mapping
  try { await api.post('/api/pricing/crm-mapping', {updates: {[code]: crmCompany}}); } catch(e) {}

  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  fd.append('company_name', code);
  fd.append('group_name', group);

  try {
    const d = await api.post('/api/pricing/import', fd);
    resultDiv.className = 'text-green-400 text-sm p-3 rounded' ;
    resultDiv.style.background = '#0f291a';
    resultDiv.innerHTML = `
      ✅ <b>${esc(d.company_name)}</b> → <b>${esc(crmCompany)}</b> uğurla import edildi!<br>
      <span class="text-xs text-gray-400">
        Aylıq: <b class="text-green-300">${Number(d.monthly).toLocaleString('az-AZ',{minimumFractionDigits:2})} ₼</b> |
        Kateqoriya: ${d.categories_count} | Xidmət: ${d.services_count}
      </span>`;
    resultDiv.classList.remove('hidden');
    btn.textContent = '✅ Tamamlandı';
    // Refresh table
    setTimeout(() => { closeModal(); renderMuqavile(document.getElementById('app')); }, 1500);
  } catch(e) {
    resultDiv.className = 'text-red-400 text-sm'; resultDiv.textContent = '❌ Xəta: ' + String(e).substring(0, 200); resultDiv.classList.remove('hidden');
    btn.disabled = false; btn.textContent = '📊 Yüklə və İmport et';
  }
}

    showToast('Qrup "' + name + '" yaradıldı', 'success');

function extractCompanyCode(filename) {
  // "1. AFİ.xlsx" → "AFİ", "ZEYTUN.xlsx" → "ZEYTUN", "23. FOTON.xlsx" → "FOTON"
  let name = filename.replace(/\.(xlsx|xlsm)$/i, '').trim();
  // Remove leading "N. " or "N " prefix
  name = name.replace(/^\d+[\.\)\-]?\s*/, '').trim();
  return name.toUpperCase();
}

async function saveEditCompanyModal(code) {
  const legalName    = document.getElementById('ecLegalName').value.trim();
  const voen         = document.getElementById('ecVoen').value.trim();
  const directorName = document.getElementById('ecDirectorName').value.trim();
  const address      = document.getElementById('ecAddress').value.trim();
  const bank         = document.getElementById('ecBank').value.trim();

  // Load existing full details to merge
  let details = {};
  try {
    const res = await api.get(`/api/contracts/details/${encodeURIComponent(code)}`);
    details = res.data || {};
  } catch(e) {}

  if (!details.client) details.client = {};
  if (legalName)    details.client.legal_name    = legalName;
  if (voen)         details.client.voen          = voen;
  if (directorName) details.client.director_name = directorName;
  if (address)      details.client.address       = address;
  if (bank)         details.client.bank          = bank;

  try {
    await api.put(`/api/contracts/details/${encodeURIComponent(code)}`, details);
    showToast('✅ Məlumatlar yadda saxlandı', 'success');
    closeModal();
    // Update local cache and re-render table
    const idx = _muqavileCompanies.findIndex(c => c.code === code);
    if (idx !== -1) _muqavileCompanies[idx].legal_name = legalName || _muqavileCompanies[idx].legal_name;
    renderMuqavileTable();
  } catch(e) {
    showToast('❌ Xəta baş verdi', 'error');
  }
}

async function openImportContractModal() {

  } catch(e) {}

  box.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold">${t('contract_upload_title')}</h2>
      <button onclick="closeImportContractModal()" class="text-gray-400 hover:text-white text-xl">✕</button>

    <div class="space-y-3">
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Fayl (.docx)</label>
        <input type="file" id="importContractFile" accept=".docx" class="input-field w-full text-sm">

      <div>
        <label class="text-xs text-gray-400 mb-1 block">${t('contract_upload_company')} <span class="text-red-400">*</span></label>
        ${createSearchableDropdown({
          id: 'importContractCompany',
          items: companies.map(c => c.cost_code || c.name),
          value: '',
          placeholder: t('contract_upload_company_ph')
        })}
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">${t('contract_upload_code')}</label>
        <input type="text" id="importContractCode" class="input-field w-full" placeholder="məs. AzMade, PMD, AGF..." readonly style="background:#1e293b;color:#94a3b8">
      </div>
      <div id="importDetectedCompany" class="text-xs text-indigo-400 hidden"></div>
      <div id="importContractError" class="text-xs text-red-400 hidden"></div>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-primary flex-1" onclick="submitImportContract()">${t('contract_upload_submit')}</button>
        <button class="btn btn-secondary" onclick="closeImportContractModal()">${t('contract_upload_cancel')}</button>
      </div>
    </div>
  `;
  document.getElementById('importContractModal').classList.remove('hidden');

  // Auto-detect company from filename → match to dropdown
  document.getElementById('importContractFile').onchange = function() {
    const file = this.files[0];
    if (file) {
      const code = file.name.split(' - ')[0].replace(/\.(docx|doc)$/i, '').trim();
      document.getElementById('importContractCode').value = code;
      // Try to find matching company
      const match = companies.find(c => c.name.toLowerCase() === code.toLowerCase() || (c.cost_code && c.cost_code.toLowerCase() === code.toLowerCase()));
      if (match) {
        selectSearchDD('importContractCompany', match.cost_code || match.name);
      }
      const det = document.getElementById('importDetectedCompany');
      det.textContent = match
        ? `✅ Avtomatik tapıldı: "${match.name}"`
        : `⚠️ "${code}" — şirkət tapılmadı, əl ilə seçin`;
      det.classList.remove('hidden');
    }
  };
}

function closeImportContractModal() {
  document.getElementById('importContractModal').classList.add('hidden');
}

async function submitImportContract() {
  const fileInput = document.getElementById('importContractFile');
  const codeInput = document.getElementById('importContractCode');
  const companyInput = document.getElementById('importContractCompany');
  const errDiv    = document.getElementById('importContractError');
  errDiv.classList.add('hidden');

  if (!fileInput.files[0]) {
    errDiv.textContent = 'Fayl seçin';
    errDiv.classList.remove('hidden');
    return;
  }
  if (!companyInput || !companyInput.value.trim()) {
    errDiv.textContent = 'Şirkət seçmək məcburidir!';
    errDiv.classList.remove('hidden');
    return;
  }

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  formData.append('company_code', codeInput.value.trim() || companyInput.value.trim());
  formData.append('company_name', companyInput.value.trim());

  try {
    const btn = document.querySelector('#importContractModal .btn-primary');
    btn.disabled = true;
    btn.textContent = '⏳ Yüklənir...';

    const res = await fetch('/api/contracts/import', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` },
      body: formData
    });
    const data = await res.json();

    if (data.success) {
      closeImportContractModal();
      showToast(`✅ ${(data.data && data.data.message) || 'Import uğurlu oldu'}`);
      await renderMuqavile(document.getElementById('app'));
    } else {
      errDiv.textContent = data.message || 'Xəta baş verdi';
      errDiv.classList.remove('hidden');
    }
  } catch(e) {
    errDiv.textContent = 'Şəbəkə xətası: ' + String(e);
    errDiv.classList.remove('hidden');
  } finally {
    const btn = document.querySelector('#importContractModal .btn-primary');
    if (btn) { btn.disabled = false; btn.textContent = t('contract_upload_submit'); }
  }
}

async function submitGenerateContract() {
  if (!_muqavileSelected) return;
  const btn = document.getElementById('genSubmitBtn');
  const errDiv = document.getElementById('genError');
  errDiv.classList.add('hidden');

  const params = {
    company_code:    _muqavileSelected,
    annex_number:    document.getElementById('genAnnexNumber').value.trim(),
    contract_number: document.getElementById('genContractNumber').value.trim(),
    signing_date:    document.getElementById('genSigningDate').value.trim(),
    period_start:    document.getElementById('genPeriodStart').value.trim(),
    period_end:      document.getElementById('genPeriodEnd').value.trim()
  };

  try {
    btn.disabled = true;
    btn.innerHTML = `<div class="spinner w-4 h-4"></div> Hazırlanır...`;

    const res = await fetch('/api/contracts/generate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('crm_token')}`
      },
      body: JSON.stringify(params)
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || `HTTP ${res.status}`);
    }

    // Download the file
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const cd   = res.headers.get('Content-Disposition') || '';
    // Support both filename*=UTF-8''encoded and filename="plain"
    const fn8 = cd.match(/filename\*=UTF-8''([^;\s]+)/i);
    const fnPlain = cd.match(/filename="([^"]+)"/);
    const fileName = fn8 ? decodeURIComponent(fn8[1]) : fnPlain ? fnPlain[1] : `${_muqavileSelected} - Guven Technology - Müqavilə.docx`;
    a.download = fileName;
    a.href = url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    closeGenerateModal();
    showToast(`✓ Müqavilə hazırlandı: ${a.download}`);
  } catch(e) {
    errDiv.textContent = 'Xəta: ' + String(e);
    errDiv.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> Yarat &amp; Yüklə`;
  }
}

async function submitUploadQrp() {
  const fileInput = document.getElementById('uploadQrpFile');
  const errDiv    = document.getElementById('uploadQrpError');
  const btn       = document.getElementById('uploadQrpSubmitBtn');
  errDiv.classList.add('hidden');

  if (!fileInput.files || !fileInput.files[0]) {
    errDiv.textContent = 'Zəhmət olmasa fayl seçin.';
    errDiv.classList.remove('hidden');
    return;
  }
  const file = fileInput.files[0];
  if (!file.name.endsWith('.docx')) {
    errDiv.textContent = 'Yalnız .docx faylı qəbul olunur.';
    errDiv.classList.remove('hidden');
    return;
  }

  try {
    btn.disabled = true;
    btn.textContent = 'Yüklənir...';

    const fd = new FormData();
    fd.append('file', file);

    let url, successMsg;
    if (_uploadQrpCode) {
      fd.append('company_code', _uploadQrpCode);
      url = '/api/contracts/upload-qrp';
      successMsg = `✓ ${_uploadQrpCode} üçün ${t('muq_qrp_template')} yeniləndi`;
    } else {
      url = '/api/contracts/upload-default-qrp';
      successMsg = '✓ Ümumi '+t('muq_qrp_template')+' yeniləndi';
    }

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` },
      body: fd
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

    showToast(successMsg);

    renderMuqavileTable();

    errDiv.textContent = 'Xəta: ' + String(e);
    errDiv.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Yüklə';
  }
}

  try {
    const r = await apiFetch('/api/pricing/data');
    pricingData = r.data || {};
  } catch(e) { showToast('Qiymət datası yüklənə bilmədi','error'); return; }

  if (myGen !== _pcModalGeneration) return;

  const companyPricing = pricingData[companyCode];
  if (!companyPricing || !companyPricing.categories) {
    showToast('Bu şirkət üçün qiymət datası tapılmadı','error');
    return;
  }

  try {
    const r = await apiFetch(`/api/price-changes?company_code=${encodeURIComponent(companyCode)}`);
    _priceChangePending = (r.data || []).filter(pc => pc.status === 'pending');
  } catch(e) { _priceChangePending = []; }

  if (myGen !== _pcModalGeneration) return;

  const items = [];
  for (const [catName, catData] of Object.entries(companyPricing.categories)) {
    for (const svc of (catData.services || [])) {
      let effPrice = svc.price || 0;
      const svcTotal = svc.total || 0;
      const svcQty = svc.qty || 0;
      if (svcQty > 0 && svcTotal > 0 && Math.abs(svcTotal - svcQty * effPrice) > 0.01) {
        effPrice = Math.round(svcTotal / svcQty * 100) / 100;
      }
      items.push({
        category: catName,
        name: svc.name,
        unit: svc.unit || '',
        old_qty: svcQty,
        old_price: effPrice,
        new_qty: svcQty,
        new_price: effPrice,
      });
    }
  }
  _priceChangeItems = items;

  renderPriceChangeModal();
}

function pcUpdateItem(el) {
  const idx = +el.dataset.pcIdx;
  const field = el.dataset.pcField;
  const val = +el.value || 0;
  if (field === 'qty') _priceChangeItems[idx].new_qty = val;
  else if (field === 'price') _priceChangeItems[idx].new_price = val;
  pcRecalcAll();
}

function pcRecalcAll() {
  const items = _priceChangeItems;

  // Update each row's Cəmi and Fərq cells
  items.forEach((it, i) => {
    const oldT = it.old_qty * it.old_price;
    const newT = it.new_qty * it.new_price;
    const d = newT - oldT;
    // Update Cəmi cell
    const totalCell = document.getElementById('pcTotal' + i);
    if (totalCell) totalCell.textContent = newT.toFixed(2);
    const cell = document.getElementById('pcDiff' + i);
    if (cell) {
      const changed = it.old_qty !== it.new_qty || it.old_price !== it.new_price;
      const row = document.getElementById('pcRow' + i);
      if (row) row.style.background = changed ? 'rgba(234,179,8,0.08)' : '';
      if (d === 0) {
        cell.textContent = '—';
        cell.className = 'px-2 py-1 text-right font-mono text-gray-600';
      } else {
        cell.textContent = (d > 0 ? '+' : '') + d.toFixed(2) + ' ₼';
        cell.className = 'px-2 py-1 text-right font-mono ' + (d > 0 ? 'text-green-400' : 'text-red-400');
      }
    }
  });

  // Update each category totals
  for (const [catId, indices] of Object.entries(window._pcCatMap || {})) {
    const catOld = indices.reduce((s, i) => s + items[i].old_qty * items[i].old_price, 0);
    const catNew = indices.reduce((s, i) => s + items[i].new_qty * items[i].new_price, 0);
    const catDiff = catNew - catOld;
    const elOld = document.getElementById(catId + '_old');
    const elNew = document.getElementById(catId + '_new');
    const elDiff = document.getElementById(catId + '_diff');
    if (elOld) elOld.textContent = catOld.toFixed(2) + ' ₼';
    if (elNew) elNew.textContent = catNew.toFixed(2) + ' ₼';
    if (elDiff) {
      if (catDiff === 0) {
        elDiff.textContent = '—';
        elDiff.className = 'font-mono text-gray-500';
      } else {
        elDiff.textContent = (catDiff > 0 ? '+' : '') + catDiff.toFixed(2) + ' ₼';
        elDiff.className = 'font-mono ' + (catDiff > 0 ? 'text-green-400' : 'text-red-400');
      }
    }
  }

  // Update global totals bar + summary card
  const oldTotal = items.reduce((s,i) => s + i.old_qty * i.old_price, 0);
  const newTotal = items.reduce((s,i) => s + i.new_qty * i.new_price, 0);
  const diff = newTotal - oldTotal;
  const diffPct = oldTotal > 0 ? ((diff / oldTotal) * 100).toFixed(1) : '0.0';
  const diffClass = diff > 0 ? 'text-green-400' : diff < 0 ? 'text-red-400' : 'text-gray-400';
  const bar = document.getElementById('pcTotalsBar');
  if (bar) {
    bar.innerHTML = `Köhnə: <span class="text-gray-400">${oldTotal.toFixed(2)} ₼</span>
      &nbsp;→&nbsp; Yeni: <span class="text-white font-bold">${newTotal.toFixed(2)} ₼</span>
      &nbsp; <span class="${diffClass}">(${diff > 0 ? '+' : ''}${diff.toFixed(2)} ₼ / ${diff > 0 ? '+' : ''}${diffPct}%)</span>`;
  }

  // Summary card
  const elOld = document.getElementById('pcSumOld');
  const elNew = document.getElementById('pcSumNew');
  const elDiff = document.getElementById('pcSumDiff');
  const elOldY = document.getElementById('pcSumOldYear');
  const elNewY = document.getElementById('pcSumNewYear');
  const elDiffY = document.getElementById('pcSumDiffYear');
  if (elOld) elOld.textContent = oldTotal.toFixed(2) + ' ₼';
  if (elNew) elNew.textContent = newTotal.toFixed(2) + ' ₼';
  if (elOldY) elOldY.textContent = 'İllik: ' + (oldTotal * 12).toFixed(2) + ' ₼';
  if (elNewY) elNewY.textContent = 'İllik: ' + (newTotal * 12).toFixed(2) + ' ₼';
  if (elDiff) {
    if (diff === 0) {
      elDiff.textContent = '—';
      elDiff.className = 'text-lg font-bold text-gray-500';
    } else {
      elDiff.textContent = (diff > 0 ? '+' : '') + diff.toFixed(2) + ' ₼ (' + (diff > 0 ? '+' : '') + diffPct + '%)';
      elDiff.className = 'text-lg font-bold ' + (diff > 0 ? 'text-green-400' : 'text-red-400');
    }
  }
  if (elDiffY) {
    const diffY = diff * 12;
    if (diffY === 0) {
      elDiffY.textContent = '—';
      elDiffY.className = 'text-xs text-gray-600';
    } else {
      elDiffY.textContent = 'İllik: ' + (diffY > 0 ? '+' : '') + diffY.toFixed(2) + ' ₼';
      elDiffY.className = 'text-xs ' + (diffY > 0 ? 'text-green-400' : 'text-red-400');
    }
  }
}

let _pcFromCalcUpload = false;
async function pcHandleCalcUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const fnEl = document.getElementById('pcCalcFileName');
  const statusEl = document.getElementById('pcCalcUploadStatus');
  if (fnEl) fnEl.textContent = file.name;
  if (statusEl) { statusEl.classList.remove('hidden'); statusEl.innerHTML = '<div class="text-xs text-yellow-300">\u23f3 Fayl y\u00fckl\u0259nir v\u0259 analiz olunur...</div>'; }
  const formData = new FormData();
  formData.append('file', file);
  try {
    const parsed = await api.post('/api/pricing/parse-calculator', formData);
    if (!parsed || !parsed.categories) {
      if (statusEl) statusEl.innerHTML = '<div class="text-xs text-red-400">Faylda kateqoriya tap\u0131lmad\u0131</div>';
      return;
    }
    function norm(s) {
      return (s||'').toLowerCase().trim()
        .replace(/\u0130/g,'i')
        .replace(/[\u201c\u201d\u0022]/g,'')
        .replace(/front\s+office\s+support/gi,'')
        .replace(/[\u200b\u00a0]/g,' ')
        .replace(/\s*[\u2013\u2014-]\s*/g,' ')
        .replace(/sisteml\u0259ri\s*,/g,',')
        .replace(/v\u0259\s+s\.\s*\)/g,')')
        .replace(/,\s*,/g,',')
        .replace(/\s*,/g,',')
        .replace(/\s+/g,' ')
        .replace(/\(\s+/g,'(').replace(/\s+\)/g,')')
        .replace(/,\s*\)/g,')')
        .replace(/\s*\(.*?\)\s*$/g, '')
        .trim();
    }
        // Zero out all items first, then fill from file
        _priceChangeItems.forEach(it => { it.new_qty = 0; it.new_price = 0; });
    let matched = 0, unmatched = 0;
    const unmatchedList = [];
    for (const [catName, catData] of Object.entries(parsed.categories)) {
      for (const svc of (catData.services || [])) {
        const svcNorm = norm(svc.name);
        let found = false;
        for (let i = 0; i < _priceChangeItems.length; i++) {
          if (norm(_priceChangeItems[i].name) === svcNorm || norm(_priceChangeItems[i].name).startsWith(svcNorm) || svcNorm.startsWith(norm(_priceChangeItems[i].name))) {
            _priceChangeItems[i].new_qty = svc.qty || 0;
            // Use effective price: if Excel total differs from qty*price, derive price from total
            let effPrice = svc.price || 0;
            const svcTotal = svc.total || 0;
            const svcQty = svc.qty || 0;
            if (svcQty > 0 && svcTotal > 0 && Math.abs(svcTotal - svcQty * effPrice) > 0.01) {
              effPrice = Math.round(svcTotal / svcQty * 100) / 100;
            }
            _priceChangeItems[i].new_price = effPrice;
            found = true; matched++; break;
          }
        }
        if (!found) { unmatched++; unmatchedList.push({name: svc.name, qty: svc.qty, price: svc.price, cat: catName}); }
      }
    }
    _priceChangeItems.forEach((it, i) => {
      const row = document.getElementById('pcRow' + i);
      if (!row) return;
      const qI = row.querySelector('[data-pc-field="qty"]');
      const pI = row.querySelector('[data-pc-field="price"]');
      if (qI) qI.value = it.new_qty;
      if (pI) pI.value = it.new_price.toFixed(2);
    });
    pcRecalcAll();
        _pcFromCalcUpload = true;
    let html = '<div class="text-xs text-green-400">\u2713 ' + matched + ' xidm\u0259t u\u011furla uy\u011funla\u015fd\u0131r\u0131ld\u0131</div>';
    if (unmatched > 0) {
      html += '<div class="text-xs text-yellow-400 mt-1">\u26a0 ' + unmatched + ' xidm\u0259t uy\u011funla\u015fd\u0131r\u0131la bilm\u0259di:</div>';
      html += '<div class="text-xs text-gray-400 mt-1 max-h-40 overflow-y-auto">';
      unmatchedList.forEach(u => { html += '<div>\u2022 ' + u.name + ' (say:' + u.qty + ', qiym\u0259t:' + u.price + ')</div>'; });
      html += '</div>';
    }
    if (statusEl) statusEl.innerHTML = html;
  } catch(e) {
    if (statusEl) statusEl.innerHTML = '<div class="text-xs text-red-400">X\u0259ta: ' + String(e) + '</div>';
  }
}

async function submitPriceChange() {
  const code = _priceChangeCompany;
  const items = _priceChangeItems;
  const notes = document.getElementById('pcNotes')?.value || '';

  // Check if any changes were made
  const hasChanges = items.some(i => i.old_qty !== i.new_qty || i.old_price !== i.new_price);
  if (!hasChanges) {
    showToast('Heç bir dəyişiklik yoxdur', 'error');
    return;
  }

  // Build new pricing structure
  const cats = {};
  for (const it of items) {
    if (!cats[it.category]) cats[it.category] = { services: [], total: 0 };
    cats[it.category].services.push({
      name: it.name,
      unit: it.unit,
      qty: it.new_qty,
      price: it.new_price
    });
    cats[it.category].total += it.new_qty * it.new_price;
  }
  // Round totals
  for (const c of Object.values(cats)) c.total = +c.total.toFixed(2);

  const monthlyTotal = Object.values(cats).reduce((s,c) => s + c.total, 0);

  try {
    await api.post('/api/price-changes', {
      auto_approve: _pcFromCalcUpload,
      company_code: code,
      new_prices: { categories: cats, monthly_total: +monthlyTotal.toFixed(2) },
      notes
    });
    _pcFromCalcUpload = false;
    showToast('✓ Qiymət dəyişikliyi təsdiqə göndərildi', 'success');
    renderPage('muqavile');
  } catch(e) {
    showToast('Xəta: ' + String(e), 'error');
  }
}

async function directSavePriceChange() {
  const code = _priceChangeCompany;
  const items = _priceChangeItems;

  const hasChanges = items.some(i => i.old_qty !== i.new_qty || i.old_price !== i.new_price);
  if (!hasChanges) {
    showToast('Hec bir deyisiklik yoxdur', 'error');
    return;
  }

  if (!confirm('Qiymetler birbasa yenilenecek. Davam etmek isteyirsiniz?')) return;

  const cats = {};
  for (const it of items) {
    if (!cats[it.category]) cats[it.category] = { services: [], total: 0 };
    cats[it.category].services.push({
      name: it.name,
      unit: it.unit,
      qty: it.new_qty,
      price: it.new_price,
    });
    cats[it.category].total += it.new_qty * it.new_price;
  }
  for (const c of Object.values(cats)) c.total = +c.total.toFixed(2);

  const monthlyTotal = Object.values(cats).reduce((s,c) => s + c.total, 0);
  const notes = document.getElementById('pcNotes')?.value || '';

  try {
    await api.post('/api/pricing/direct-save', {
      company_code: code,
      new_prices: { categories: cats, monthly_total: +monthlyTotal.toFixed(2) },
      notes: notes || 'Birbasa saxlanildi',
    });
    showToast('✓ Qiymetler birbasa yenilendi!', 'success');
    openPriceChangeModal(_priceChangeCompany);
  } catch(e) {
    showToast('Xeta: ' + String(e), 'error');
  }

// ── Status update ──────────────────────────────────────
async function updateOfferStatus(id, status) {
  try {
    const res = await apiFetch('/api/offers/' + id);
    const o = res.data;
    const items = typeof o.items === 'string' ? JSON.parse(o.items||'[]') : (o.items||[]);
    await api.put('/api/offers/' + id, {...o, items, status});
    showToast('Status updated', 'success');
    // Sync deal stage based on offer status
    try {
      const dealsRes = await apiFetch('/api/deals?limit=500');
      const deals = dealsRes.data || [];
      const linked = deals.find(d => d.title && d.title.includes(o.offer_number));
      if (linked) {
        const stageMap = { accepted: 'WON', sent: 'NEGOTIATION', rejected: 'LOST', draft: 'PROPOSAL' };
        const newStage = stageMap[status] || linked.stage;
        const upd = { stage: newStage };
        if (status === 'accepted') upd.won_date = new Date().toISOString();
        await api.put('/api/deals/' + linked.id, upd);
      }
    } catch(de) { console.warn('Deal sync failed:', de); }
    closeModal();
    renderPage('offers');
  } catch(e) { showToast(esc(e.message), 'error'); }
}

async function createDealFromOffer(e, offerId) {
  e.preventDefault();
  const form = new FormData(e.target);
  try {
    // Get offer to find company_id
    const res = await apiFetch('/api/offers/' + offerId);
    const o = res.data;
    const deal = {
      title: form.get('title'),
      company_id: o.company_id || null,
      contact_id: null,
      stage: form.get('stage'),
      value_amount: +(form.get('value_amount')||0),
      value_currency: form.get('value_currency') || 'AZN',
      notes: form.get('notes') || '',
      expected_close: null
    };
    const created = await api.post('/api/deals', deal);
    // If WON, update won_date
    if (deal.stage === 'WON' && created?.data?.id) {
      await api.put('/api/deals/' + created.data.id, { won_date: new Date().toISOString() });
    }
    showToast(t('offer_to_deal_success'), 'success');
    closeModal();
    renderPage('offers');

function findCompanyDetail(companyName) {
  if (!_offerCompanyDetails || !companyName) return null;
  const norm = s => s.toLowerCase().replace(/[\s\-«»'']/g,'');
  const n = norm(companyName);

    const cn = norm(code);

    if (crmRadio) { crmRadio.checked = true; toggleClientSource('crm'); }

  // Close dropdown when clicking outside - remove old listener if it exists
  if (window._crmDropdownListener) {
    document.removeEventListener('click', window._crmDropdownListener);
  }
  window._crmDropdownListener = function(e) {
    const dd = document.getElementById('crmClientDropdown');
    const si = document.getElementById('crmClientSearch');
    if (dd && si && !dd.contains(e.target) && e.target !== si) {
      dd.classList.add('hidden');

  };

  renderOfferItems();

function offerTypeChanged(val) {
  const vmRow = document.getElementById('offerViewModeRow');
  if (vmRow) vmRow.classList.toggle('hidden', val !== 'services');
}

function toggleClientSource(src) {
  document.getElementById('clientCrmBlock')?.classList.toggle('hidden', src !== 'crm');
  document.getElementById('clientManualBlock')?.classList.toggle('hidden', src !== 'manual');
}

function filterCrmClients(q) {
  const dd = document.getElementById('crmClientDropdown');
  if (!dd) return;
  dd.classList.remove('hidden');
  const lq = q.toLowerCase();
  dd.querySelectorAll('.crm-client-opt').forEach(el => {
    el.style.display = el.dataset.name.toLowerCase().includes(lq) ? '' : 'none';
  });
}

function selectCrmClient(id, name) {
  const si = document.getElementById('crmClientSearch');
  const hi = document.getElementById('crmCompanyIdInput');
  const dd = document.getElementById('crmClientDropdown');
  if (si) si.value = name;
  if (hi) hi.value = id;
  if (dd) dd.classList.add('hidden');
  // Also fill manual fields + auto-fill VÖEN/contact from company_details
  const form = document.querySelector('form');
  if (form) {
    const ni = form.querySelector('[name="client_name"]');
    if (ni) ni.value = name;
    const detail = findCompanyDetail(name);
    if (detail && detail.client) {
      const vi = form.querySelector('[name="client_voen"]');
      const ci = form.querySelector('[name="client_contact"]');
      const cti = form.querySelector('[name="client_contract"]');
      if (vi && !vi.value) vi.value = detail.client.voen || '';
      if (ci && !ci.value) ci.value = (detail.client.director_name || '') + (detail.client.director_title ? ' — ' + detail.client.director_title : '');
      if (cti && !cti.value) cti.value = detail.contract_number || '';
      // Also set legal name instead of short code
      if (ni && detail.client.legal_name) ni.value = detail.client.legal_name;
    }
  }
}

function offerAddManualItem() {
  const offerType = document.querySelector('[name="offer_type"]')?.value || 'services';
  const item = {name:'', unit:'', qty:1, price:0, discount:0, category:''};
  if (offerType === 'equipment') {
    Object.assign(item, {model:'', brand:'', specs:'', country:'', warranty:''});
  }
  _offerItems.push(item);
  renderOfferItems();
}

function toggleOfferDiscount(on) {
  const pctInput = document.getElementById('offerDiscountPct');
  const pctLabel = document.getElementById('offerDiscountPctLabel');
  if (pctInput) pctInput.classList.toggle('hidden', !on);
  if (pctLabel) pctLabel.classList.toggle('hidden', !on);
  if (!on) {
    // Remove discount from all items
    _offerItems.forEach(it => it.discount = 0);
    if (pctInput) pctInput.value = 0;
    renderOfferItems();
  }
}

function applyGlobalDiscount(pct) {
  _offerItems.forEach(it => it.discount = pct);
  renderOfferItems();
}

// ── Load from pricing template ─────────────────────────
async function offerLoadPricing() {
  if (!_offerPricingData) {
    try {
      const r = await apiFetch('/api/pricing/data');
      _offerPricingData = r.data;
    } catch(e) { showToast('Failed to load pricing','error'); return; }
  }
  // Load standard catalog from first company (prices are the same)
  const firstCode = Object.keys(_offerPricingData)[0];
  if (!firstCode) { showToast('No pricing data','error'); return; }
  loadPricingDirect(firstCode);
}

function loadPricingDirect(code) {
  if (!_offerPricingData || !_offerPricingData[code]) return;
  const data = _offerPricingData[code];
  const cats = data.categories || {};
  const currentDiscount = +(document.getElementById('offerDiscountPct')?.value || 0);
  _offerItems = [];
  for (const [catName, catData] of Object.entries(cats)) {
    const services = catData.services || [];
    for (const svc of services) {
      if (!(svc.price > 0)) continue;
      _offerItems.push({
        name: svc.name,
        category: catName,
        unit: svc.unit || '',
        qty: 0,
        price: svc.price || 0,
        discount: currentDiscount
      });
    }
  }
  renderOfferItems();
  showToast(`${_offerItems.length} xidmət yükləndi`, 'success');
}

// ── Save offer ─────────────────────────────────────────
async function saveOffer(e, id) {
  e.preventDefault();
  const form = new FormData(e.target);
  const clientSource = form.get('client_source');

  const data = {
    offer_type: form.get('offer_type'),
    currency: form.get('currency'),
    show_vat: form.get('show_vat') === 'on' ? 1 : 0,
    vat_pct: 18,
    view_mode: form.get('view_mode') || 'detailed',
    company_id: clientSource === 'crm' ? (form.get('company_id') || null) : null,
    client_name: form.get('client_name') || '',
    client_voen: form.get('client_voen') || '',
    client_contact: form.get('client_contact') || '',
    client_contract: form.get('client_contract') || '',
    notes: form.get('notes') || '',
    valid_until: form.get('valid_until') || '',
    items: _offerItems,
    status: 'draft'
  };

  // If CRM client, fill name from search input
  if (clientSource === 'crm' && data.company_id) {
    const si = document.getElementById('crmClientSearch');
    if (si && si.value) data.client_name = si.value;
  }

  const btn = e.target.querySelector('button[type="submit"]');
  if (btn) btn.disabled = true;

  try {
    if (id) {
      await api.put('/api/offers/' + id, data);
      showToast(t('company_updated'), 'success');
    } else {
      const created = await api.post('/api/offers', data);
      showToast(t('company_created'), 'success');
      // Auto-create deal in PROPOSAL stage
      if (created) {
        const o = created;
        const items = o.items ? (typeof o.items === 'string' ? JSON.parse(o.items) : o.items) : _offerItems;
        const total = items.reduce((s,i) => s + (i.qty||0)*(i.price||0)*(1-(i.discount||0)/100), 0);
        const vatAmt = data.show_vat ? total * 18 / 100 : 0;
        const grand = total + vatAmt;
        try {
          await api.post('/api/deals', {
            title: (o.offer_number || 'Offer') + ' — ' + (data.client_name || ''),
            company_id: data.company_id || null,
            stage: 'PROPOSAL',
            value_amount: +grand.toFixed(2),
            value_currency: data.currency || 'AZN',
            notes: t('offer_deal_auto_note').replace('{num}', o.offer_number || '')
          });
        } catch(de) { console.warn('Auto-deal creation failed:', de); }
      }
    }
    clearFormDirty();
    renderPage('offers');
  } catch(e) { showToast(esc(e.message), 'error'); }
  finally { if (btn) btn.disabled = false; }
}

let _costModelData = null;

async function renderCostModel(el) {
  el.innerHTML = `<div class="flex items-center justify-center h-32"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-400"></div></div>`;
  try {

  }

function _renderCostModelPage(el) {
  const d = _costModelData;
  if (!d) { renderCostModel(el); return; }
  const s = d.summary || {};

  const tabs = [
    { key: 'analytics', icon: '📊', tkey: 'cm_tab_analytics' },
    { key: 'services',  icon: '🔧', tkey: 'cm_tab_services' },
    { key: 'clients',   icon: '🏢', tkey: 'cm_tab_clients' },
    { key: 'overhead',  icon: '💰', tkey: 'cm_tab_overhead' },
    { key: 'employees', icon: '👥', tkey: 'cm_tab_employees' },
    { key: 'settings',  icon: '⚙️', tkey: 'cm_tab_settings' }
  ];

  const tabBtns = tabs.map(tb => `
    <button class="btn ${_costModelTab === tb.key ? 'btn-primary' : 'btn-secondary'} text-sm"
      onclick="_costModelTab='${tb.key}';_renderCostModelPage(document.getElementById('app'))">${tb.icon} ${t(tb.tkey)}</button>
  `).join('');

  let content = '';
  if (_costModelTab === 'analytics') content = _renderCostAnalytics(d);
  else if (_costModelTab === 'services') content = _renderCostServices(d);
  else if (_costModelTab === 'clients') content = _renderCostClients(d);
  else if (_costModelTab === 'overhead') content = _renderCostOverhead(d);
  else if (_costModelTab === 'employees') content = _renderCostEmployees(d);
  else if (_costModelTab === 'settings') content = _renderCostSettings(d);

  el.innerHTML = `
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-2xl font-bold">🧮 ${t('cm_title')}</h1>
      <div class="flex gap-2 flex-wrap justify-end">${tabBtns}</div>
    </div>
    ${content}

  // Auto-load AI analysis (cached) for the active tab — does NOT regenerate, only shows existing cache
  if (_costModelTab !== 'settings') {
    setTimeout(() => runAiAnalysis(_costModelTab, false), 100);
  }
}

function _fmtAZN(v) {
  if (v == null) return '—';
  return new Intl.NumberFormat('az-AZ', {minimumFractionDigits:2,maximumFractionDigits:2}).format(v) + ' ₼';
}
function _statusBadge(status) {
  if (status === 'good') return '<span style="color:#4ade80">✅ Yaxşı</span>';
  if (status === 'low') return '<span style="color:#facc15">⚠️ Aşağı</span>';
  if (status === 'loss') return '<span style="color:#f87171">❌ Zərər</span>';
  return '<span style="color:#94a3b8">— Gəlir yoxdur</span>';
}

function _renderAiMarkdown(text) {
  if (!text) return '<p style="color:#94a3b8;">—</p>';
  // Convert markdown to styled HTML
  let html = text
    // Headers: # → h2, ## → h3, ### → h4
    .replace(/^### (.+)$/gm, '<h4 style="font-size:13px;font-weight:700;color:#c4b5fd;margin:16px 0 6px 0;padding:0;">$1</h4>')
    .replace(/^## (.+)$/gm, '<h3 style="font-size:14px;font-weight:700;color:#a78bfa;margin:20px 0 8px 0;padding-bottom:4px;border-bottom:1px solid #312e81;">$1</h3>')
    .replace(/^# (.+)$/gm, '<h2 style="font-size:16px;font-weight:700;color:#e0e7ff;margin:0 0 12px 0;padding-bottom:6px;border-bottom:2px solid #4f46e5;">$1</h2>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#e2e8f0;">$1</strong>')
    // Numbered lists
    .replace(/^(\d+)\. (.+)$/gm, '<div style="display:flex;gap:8px;margin:6px 0 6px 4px;"><span style="color:#6366f1;font-weight:700;min-width:18px;">$1.</span><span>$2</span></div>')
    // Bullet points
    .replace(/^- (.+)$/gm, '<div style="display:flex;gap:8px;margin:5px 0 5px 4px;"><span style="color:#6366f1;">•</span><span>$1</span></div>')
    // Paragraphs (double newline)
    .replace(/\n\n/g, '</div><div style="margin-top:8px;">')
    // Single newlines that aren't already handled
    .replace(/\n/g, '<br>');
  return '<div style="font-size:13.5px;line-height:1.65;color:#cbd5e1;">' + html + '</div>';
}

async function runAiAnalysis(tabId, force) {
  tabId = tabId || 'analytics';
  // force=true means user clicked "Re-analyze" button; false/undefined = auto-load (show cache only)
  if (typeof force === 'undefined') force = true;
  const btn = document.getElementById('aiBtn_' + tabId);
  const loading = document.getElementById('aiLoading_' + tabId);
  const content = document.getElementById('aiContent_' + tabId);
  const empty = document.getElementById('aiEmpty_' + tabId);
  const textEl = document.getElementById('aiText_' + tabId);
  const thinkEl = document.getElementById('aiThinkBlock_' + tabId);
  const thinkText = document.getElementById('aiThinkText_' + tabId);
  const timeEl = document.getElementById('aiTime_' + tabId);

  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ ' + t('ai_wait'); }
  if (loading) loading.style.display = 'block';
  if (content) content.style.display = 'none';
  if (empty) empty.style.display = 'none';

  const lang = state.lang || 'ru';
  const startTime = Date.now();
  try {
    const r = await api.post('/api/cost-model/ai-analysis', { tab: tabId, lang: lang, force: !!force });
    const data = r.data || r;
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    if (textEl) textEl.innerHTML = _renderAiMarkdown(data.analysis);

    if (data.thinking && thinkEl) {
      thinkEl.style.display = 'block';
      if (thinkText) thinkText.textContent = data.thinking;
    } else if (thinkEl) {
      thinkEl.style.display = 'none';
    }

    if (timeEl) timeEl.innerHTML = (data.cached ? '📦 ' + t('ai_cached') + ' · ' : '🆕 ' + t('ai_new') + ' · ') + elapsed + ' sec';
    if (content) content.style.display = 'block';
    if (loading) loading.style.display = 'none';
  } catch(e) {
    if (loading) loading.style.display = 'none';
    if (empty) {
      empty.style.display = 'block';
      empty.innerHTML = '<span style="color:#f87171;">❌ ' + (e.message || 'API error') + '</span>';
    }
  }
  if (btn) { btn.disabled = false; btn.innerHTML = '🔄 ' + t('ai_reanalyze'); }
}

async function saveCostParams() {
  const keys = ['total_users','total_employees','technical_staff','back_office_staff',
                 'vat_rate','employer_tax_rate','risk_rate','misc_expense_rate','fixed_overhead_ratio'];
  const body = {};
  // Handle manual toggle for total_users
  body['total_users_manual'] = 0;
  for (const k of keys) {
    const el = document.getElementById('param_' + k);
    if (el && !el.disabled) body[k] = parseFloat(el.value);
    else if (el && el.disabled && k !== 'total_users') body[k] = parseFloat(el.value);
  }
  // Validate fixed+variable = 1 implicitly (variable is computed)
  try {
    await api.put('/api/cost-model/parameters', body);
    showToast('Parametrlər saxlanıldı ✓', 'success');
    _costModelData = null;
    await renderCostModel(document.getElementById('app'));
    _costModelTab = 'settings';
    _renderCostModelPage(document.getElementById('app'));
  } catch(e) { showToast('Xəta: ' + e.message, 'error'); }
}

async function seedClientsFromCRM() {
  // CRM bazasındakı bütün client şirkətləri maya modelinə sinxronlayır
  // Heç bir Excel datası istifadə olunmur
  try {
    const companiesRes = await api.get('/api/companies');
    const allCompanies = companiesRes.data || companiesRes;
    const clients = allCompanies.filter(c => c.category === 'client');

    if (!confirm(`CRM bazadakı ${clients.length} müştəri maya modelinə əlavə olunsun?`)) return;

    const clientsData = clients.map(c => ({
      name: c.name,
      user_count: c.user_count || 0,
      services: {}
    }));

    const res = await api.post('/api/cost-model/seed-clients', {clients: clientsData});
    const r = res.created !== undefined ? res : res.data;
    showToast(`${r.created + r.updated} müştəri maya modelinə sinxronlandı ✓`, 'success');
    _costModelData = null;
    await renderCostModel(document.getElementById('app'));
    _costModelTab = 'analytics';
    _renderCostModelPage(document.getElementById('app'));
  } catch(e) {
    showToast('Xəta: ' + e.message, 'error');
  }
}

  const allServices = ['permanent_it','infosec','erp','grc','projects','helpdesk'];
  const services = allServices.map(svc => ({
    service_type: svc,
    monthly_revenue: parseFloat(document.getElementById('svc_rev_' + svc)?.value || 0),

  }));
  const cost_code = document.getElementById('clientCostCode')?.value || '';
  // user_count is saved separately via dedicated button to prevent accidental overwrites

  // Only include user_count if user explicitly changed it in this tab

    payload.user_count = parseInt(ucInput.value || 0);

  try {
    await api.put(`/api/cost-model/client-services/${companyId}`, payload);
    showToast('Qiymətləndirmə məlumatları saxlanıldı ✓', 'success');
    _costModelData = null; // Invalidate cache
  } catch(e) {
    showToast('Xəta: ' + e.message, 'error');
  }
}

          var search = document.getElementById('tkCompanySearch');
          var list = document.getElementById('tkCompanyList');
          var v = li.getAttribute('data-v');
          if(hidden) hidden.value = v || '';
          if(search) search.value = v ? li.textContent : '';
          if(list) list.classList.add('hidden');
          return;
        }
        // Close dropdown when clicking outside
        var wrap = document.getElementById('tkCompanyWrap');
        if(wrap && !wrap.contains(e.target)){
          var list = document.getElementById('tkCompanyList');
          var hidden = document.getElementById('tkCompany');
          var search = document.getElementById('tkCompanySearch');
          if(list) list.classList.add('hidden');
          if(hidden && search && !hidden.value) search.value = '';
        }
      });
    })();

async function renderRolesAdmin(el) {
  showLoading(el);
  const {data: roles} = await api.get('/api/roles');
  const {data: users} = await api.get('/api/users');

  const lang = currentLang || 'en';
  const title = lang==='ru'?'Управление ролями':lang==='az'?'Rol idarəetməsi':'Roles Management';

  el.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">${title}</h1>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${roles.map(r => {
        const perms = typeof r.permissions === 'string' ? JSON.parse(r.permissions) : (r.permissions||{});
        const permsList = Object.entries(perms).filter(([k,v])=>v).map(([k,v])=>`<span class="text-xs" style="background:#1e293b;padding:2px 6px;border-radius:4px;"><b>${k}</b>:${v}</span>`).join(' ');
        const roleUsers = users.filter(u => u.role_id === r.id);
        const displayName = lang==='ru'?r.display_name_ru:lang==='az'?r.display_name_az:r.display_name;
        return `<div class="card p-5">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-semibold text-lg">${esc(displayName||r.display_name)}</h3>
              <p class="text-xs text-slate-500">${esc(r.name)} ${r.is_system?'<span style="color:#818cf8">(system)</span>':''}</p>
            </div>
            <span class="text-indigo-400 font-bold">${roleUsers.length}</span>
          </div>
          <p class="text-sm text-slate-400 mb-3">${esc(r.description)}</p>
          <div class="flex flex-wrap gap-1 mb-3">${permsList}</div>
          <div class="text-xs text-slate-500">
            ${roleUsers.slice(0,5).map(u=>'<span style="background:#1e3a5f;padding:1px 6px;border-radius:4px;color:#60a5fa;">'+esc(u.full_name||u.username)+'</span>').join(' ')}
            ${roleUsers.length>5 ? '<span class="text-slate-500">+' + (roleUsers.length-5) + '</span>' : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

let _auditPage = 0;
async function renderAuditLog(el) {
  showLoading(el);
  const limit = 30;
  const offset = _auditPage * limit;
  const {data} = await api.get(`/api/audit-log?limit=${limit}&offset=${offset}`);
  const items = data.items || [];
  const total = data.total || 0;

  el.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">${_i._g('al_title')} <span class="text-slate-500 text-lg font-normal">(${total})</span></h1>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-slate-500 border-b border-slate-700">
          <th class="p-3">${_i._g('al_time')}</th>
          <th class="p-3">${_i._g('al_user')}</th>
          <th class="p-3">${_i._g('al_action')}</th>
          <th class="p-3">${_i._g('al_type')}</th>
          <th class="p-3">${_i._g('al_details')}</th>
        </tr></thead>
        <tbody>
          ${items.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-500">${_i._g('al_empty')}</td></tr>` : ''}
          ${items.map(a => `<tr class="border-b border-slate-800 hover:bg-slate-800/50">
            <td class="p-3 text-xs text-slate-400 whitespace-nowrap">${esc(a.created_at||'')}</td>
            <td class="p-3">${esc(a.user_name||'System')}</td>
            <td class="p-3"><span style="background:#312e81;color:#a5b4fc;padding:1px 6px;border-radius:4px;font-size:11px;">${esc(a.action)}</span></td>
            <td class="p-3 text-slate-400">${esc(a.entity_type||'')} ${a.entity_id?'#'+a.entity_id:''}</td>
            <td class="p-3 text-xs text-slate-500 max-w-[200px] truncate">${esc(a.details||a.entity_name||'')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="flex gap-2 mt-4 justify-center">
      ${_auditPage > 0 ? `<button class="btn btn-sm btn-secondary" onclick="_auditPage--;renderAuditLog(document.getElementById('app'))">&laquo; ${_i._g('al_prev')}</button>` : ''}
      <span class="text-slate-500 text-sm py-1">${_auditPage+1} / ${Math.ceil(total/limit)||1}</span>
      ${offset+limit < total ? `<button class="btn btn-sm btn-secondary" onclick="_auditPage++;renderAuditLog(document.getElementById('app'))">${_i._g('al_next')} &raquo;</button>` : ''}
    </div>
  `;
}

// ─── ADMIN: Lead Scoring Rules ──────────────────────────────
function _srFL() { return {source:_i._g('fl_source'),priority:_i._g('fl_priority'),status:_i._g('fl_status'),email:_i._g('fl_email'),phone:_i._g('fl_phone'),company_name:_i._g('fl_company')}; }
function _srCL() { return {equals:_i._g('cd_equals'),not_empty:_i._g('cd_not_empty'),contains:_i._g('cd_contains'),greater_than:_i._g('cd_greater')}; }
function _srVL() { return {referral:_i._g('vl_referral'),website:_i._g('vl_website'),cold_call:_i._g('vl_cold_call'),social_media:_i._g('vl_social'),exhibition:_i._g('vl_exhibition'),high:_i._g('vl_high'),medium:_i._g('vl_medium'),low:_i._g('vl_low'),new:_i._g('vl_new'),contacted:_i._g('vl_contacted'),qualified:_i._g('vl_qualified'),lost:_i._g('vl_lost')}; }
function _srDescribe(r) {
  const f = _srFL()[r.field]||r.field;
  const c = _srCL()[r.condition]||r.condition;
  const v = _srVL()[r.value]||r.value;
  if(r.condition==='not_empty') return `<b>${f}</b> ${c}`;
  return `<b>${f}</b> ${c} <span style="color:#c084fc">${v}</span>`;
}

async function renderScoringRules(el) {
  showLoading(el);
  const {data: rules} = await api.get('/api/lead-scoring-rules');

  el.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold">${_i._g('sr_title')}</h1>
        <p class="text-slate-500 text-sm mt-1">${_i._g('sr_subtitle')}</p>
      </div>
      <button class="btn btn-primary" onclick="showAddScoringRuleModal()" style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:18px;">+</span> ${_i._g('sr_new')}
      </button>
    </div>
    <div class="grid gap-3">
      ${rules.map(r => {
        const pts = r.points;
        const color = pts >= 0 ? '#4ade80' : '#f87171';
        const bg = pts >= 0 ? 'rgba(74,222,128,0.08)' : 'rgba(248,113,113,0.08)';
        const icon = pts >= 0 ? '▲' : '▼';
        return `<div class="card" style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-left:3px solid ${color};background:${bg};">
          <div style="display:flex;align-items:center;gap:12px;flex:1;">
            <div style="min-width:60px;text-align:center;">
              <span style="font-size:20px;font-weight:700;color:${color};">${pts>=0?'+':''}${pts}</span>
              <div style="font-size:10px;color:${color};opacity:0.7;">${icon} ${_i._g('sr_pts')}</div>
            </div>
            <div style="border-left:1px solid rgba(148,163,184,0.2);padding-left:12px;">
              <div style="font-size:14px;color:#e2e8f0;">${_srDescribe(r)}</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px;">${r.is_active ? '● ' + _i._g('sr_active') : '○ ' + _i._g('sr_inactive')}</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm" onclick="showEditScoringRuleModal(${r.id},'${r.field}','${r.condition}','${esc(r.value||'')}',${r.points},${r.is_active?1:0})" style="background:rgba(99,102,241,0.15);color:#818cf8;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;" title="Redaktə">✎</button>
            <button class="btn btn-sm" onclick="deleteScoringRule(${r.id})" style="background:rgba(239,68,68,0.15);color:#f87171;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;" title="Sil">✕</button>
          </div>
        </div>`;
      }).join('')}
      ${rules.length===0 ? `<div class="text-center text-slate-500 py-8">${_i._g('sr_empty')}</div>` : ''}
    </div>
    <div class="mt-5">
      <button class="btn btn-secondary" onclick="rescoreAllLeads()" style="display:flex;align-items:center;gap:6px;">
        <span>🔄</span> ${_i._g('sr_rescore')}
      </button>
    </div>
  `;
}

function showAddScoringRuleModal(editField, editCond, editValue, editPoints, editActive) {
  const isEdit = editField !== undefined;
  if (!isEdit) window._srEditId = null;
  const _fieldOpts = [
    {v:'source',l:_i._g('fl_source'),hint:_i._g('fh_source')},
    {v:'priority',l:_i._g('fl_priority'),hint:_i._g('fh_priority')},
    {v:'status',l:_i._g('fl_status'),hint:_i._g('fh_status')},
    {v:'email',l:_i._g('fl_email'),hint:_i._g('fh_email')},
    {v:'phone',l:_i._g('fl_phone'),hint:_i._g('fh_phone')},
    {v:'company_name',l:_i._g('fl_company'),hint:_i._g('fh_company')}
  ];
  const _condOpts = [
    {v:'equals',l:_i._g('cl_equals')},
    {v:'not_empty',l:_i._g('cl_not_empty')},
    {v:'contains',l:_i._g('cl_contains')},
    {v:'greater_than',l:_i._g('cl_greater')}
  ];
  const _presets = {
    source: ['referral|'+_i._g('vl_referral'),'website|'+_i._g('vl_website'),'cold_call|'+_i._g('vl_cold_call'),'social_media|'+_i._g('vl_social'),'exhibition|'+_i._g('vl_exhibition')],
    priority: ['high|'+_i._g('vl_high'),'medium|'+_i._g('vl_medium'),'low|'+_i._g('vl_low')],
    status: ['new|'+_i._g('vl_new'),'contacted|'+_i._g('vl_contacted'),'qualified|'+_i._g('vl_qualified'),'lost|'+_i._g('vl_lost')]
  };

  showModal(`
    <h2 class="text-xl font-bold mb-1">${isEdit ? _i._g('sr_edit_title') : _i._g('sr_add_title')}</h2>
    <p class="text-slate-500 text-sm mb-4">${isEdit ? _i._g('sr_edit_desc') : _i._g('sr_add_desc')}</p>
    <div class="space-y-4">
      <div>
        <label class="text-sm text-slate-400 mb-1" style="display:block;">${_i._g('sr_field')}</label>
        <select id="srField" class="form-input w-full" onchange="window._srFieldChanged()" style="font-size:15px;padding:10px 12px;">
          ${_fieldOpts.map(f=>`<option value="${f.v}" ${editField===f.v?'selected':''}>${f.l} — ${f.hint}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-sm text-slate-400 mb-1" style="display:block;">${_i._g('sr_condition')}</label>
        <select id="srCondition" class="form-input w-full" onchange="window._srCondChanged()" style="font-size:15px;padding:10px 12px;">
          ${_condOpts.map(c=>`<option value="${c.v}" ${editCond===c.v?'selected':''}>${c.l}</option>`).join('')}
        </select>
      </div>
      <div id="srValueWrap">
        <label class="text-sm text-slate-400 mb-1" style="display:block;">${_i._g('sr_value')}</label>
        <select id="srValueSelect" class="form-input w-full" style="font-size:15px;padding:10px 12px;">
          ${(_presets.source||[]).map(p=>{const[v,l]=p.split('|');return`<option value="${v}">${l}</option>`;}).join('')}
        </select>
        <input id="srValueInput" class="form-input w-full" placeholder="${_i._g('sr_value')}..." style="display:none;font-size:15px;padding:10px 12px;margin-top:4px;">
      </div>
      <div>
        <label class="text-sm text-slate-400 mb-1" style="display:block;">${_i._g('sr_points')}</label>
        <div style="display:flex;align-items:center;gap:8px;">
          <button type="button" onclick="document.getElementById('srPoints').value=Math.max(-100,parseInt(document.getElementById('srPoints').value||0)-5)" style="background:#1e293b;border:1px solid #334155;color:#f87171;width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;">−</button>
          <input id="srPoints" type="number" class="form-input text-center" value="${isEdit ? editPoints : 10}" style="font-size:20px;font-weight:700;padding:8px;width:80px;">
          <button type="button" onclick="document.getElementById('srPoints').value=Math.min(100,parseInt(document.getElementById('srPoints').value||0)+5)" style="background:#1e293b;border:1px solid #334155;color:#4ade80;width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;">+</button>
          <span class="text-slate-500 text-sm" style="margin-left:4px;">${_i._g('sr_points_help')}</span>
        </div>
      </div>
      ${isEdit ? `<div style="display:flex;align-items:center;gap:10px;">
        <label class="text-sm text-slate-400">${_i._g('sr_status')}:</label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="srActive" ${editActive ? 'checked' : ''} style="width:18px;height:18px;accent-color:#4ade80;">
          <span class="text-sm" style="color:#e2e8f0;">${_i._g('sr_active')}</span>
        </label>
      </div>` : ''}
      <div id="srPreview" style="background:#1e293b;border-radius:8px;padding:12px 16px;margin-top:4px;">
        <span class="text-xs text-slate-500">${_i._g('sr_preview')}:</span>
        <div id="srPreviewText" style="color:#e2e8f0;font-size:14px;margin-top:4px;"></div>
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button class="btn btn-primary flex-1" onclick="saveScoringRule()" style="padding:12px;font-size:15px;">${isEdit ? _i._g('sr_update') : _i._g('sr_save')}</button>
      <button class="btn btn-secondary flex-1" onclick="closeModal()" style="padding:12px;font-size:15px;">${_i._g('sr_cancel')}</button>
    </div>
  `);

  const presets = _presets;

  window._srFieldChanged = function() {
    const field = document.getElementById('srField').value;
    const sel = document.getElementById('srValueSelect');
    const inp = document.getElementById('srValueInput');
    const wrap = document.getElementById('srValueWrap');
    const cond = document.getElementById('srCondition').value;
    if (presets[field]) {
      sel.innerHTML = presets[field].map(p=>{const[v,l]=p.split('|');return '<option value="'+v+'">'+l+'</option>';}).join('');
      sel.style.display = cond==='not_empty' ? 'none' : '';
      inp.style.display = 'none';
    } else {
      sel.style.display = 'none';
      inp.style.display = cond==='not_empty' ? 'none' : '';
    }
    if(cond==='not_empty') wrap.style.display='none'; else wrap.style.display='';
    window._srUpdatePreview();
  };

  window._srCondChanged = function() {
    const cond = document.getElementById('srCondition').value;
    const wrap = document.getElementById('srValueWrap');
    if(cond==='not_empty') wrap.style.display='none'; else { wrap.style.display=''; window._srFieldChanged(); }
    window._srUpdatePreview();
  };

  window._srUpdatePreview = function() {
    const field = document.getElementById('srField');
    const cond = document.getElementById('srCondition');
    const sel = document.getElementById('srValueSelect');
    const inp = document.getElementById('srValueInput');
    const pts = document.getElementById('srPoints').value;
    const fLabel = field.options[field.selectedIndex].text.split(' — ')[0];
    const cLabel = cond.options[cond.selectedIndex].text;
    let vLabel = '';
    if(cond.value !== 'not_empty') {
      vLabel = sel.style.display!=='none' ? sel.options[sel.selectedIndex]?.text||'' : inp.value;
    }
    const sign = pts>=0 ? '+' : '';
    const color = pts>=0 ? '#4ade80' : '#f87171';
    let desc = '<b>'+fLabel+'</b> '+cLabel;
    if(vLabel) desc += ' <span style="color:#c084fc">'+vLabel+'</span>';
    desc += ' → <span style="color:'+color+';font-weight:700;">'+sign+pts+' bal</span>';
    document.getElementById('srPreviewText').innerHTML = desc;
  };

  document.getElementById('srPoints').addEventListener('input', window._srUpdatePreview);
  // If editing, set the correct field/condition/value state
  if (isEdit) {
    window._srFieldChanged();
    // Set the value in select or input
    const sel = document.getElementById('srValueSelect');
    const inp = document.getElementById('srValueInput');
    if (editCond !== 'not_empty' && editValue) {
      if (sel && sel.style.display !== 'none') {
        for (let i=0; i<sel.options.length; i++) { if(sel.options[i].value===editValue) { sel.selectedIndex=i; break; } }
      } else if (inp) { inp.value = editValue; }
    }
  }
  window._srUpdatePreview();
}

function showEditScoringRuleModal(id, field, condition, value, points, isActive) {
  window._srEditId = id;
  showAddScoringRuleModal(field, condition, value, points, isActive);
}

async function saveScoringRule() {
  const field = document.getElementById('srField').value;
  const condition = document.getElementById('srCondition').value;
  const sel = document.getElementById('srValueSelect');
  const inp = document.getElementById('srValueInput');
  const value = condition==='not_empty' ? '' : (sel && sel.style.display!=='none' ? sel.value : (inp ? inp.value : ''));
  const points = parseInt(document.getElementById('srPoints').value) || 0;
  const isActive = document.getElementById('srActive') ? (document.getElementById('srActive').checked ? 1 : 0) : 1;
  try {
    if (window._srEditId) {
      await api.put('/api/lead-scoring-rules/' + window._srEditId, { field, condition, value, points, is_active: isActive });
      showToast(_i._g('sr_updated'), 'success');
    } else {
      await api.post('/api/lead-scoring-rules', { field, condition, value, points });
      showToast(_i._g('sr_added'), 'success');
    }
    window._srEditId = null;
    closeModal();
    renderScoringRules(document.getElementById('app'));
  } catch(e) { showToast(e.message, 'error'); }
}

async function deleteScoringRule(id) {
  if (!await confirmDialog(_i._g('sr_del_confirm'))) return;
  try {
    await api.delete('/api/lead-scoring-rules/' + id);
    showToast(_i._g('sr_deleted'), 'success');
    renderScoringRules(document.getElementById('app'));
  } catch(e) { showToast(e.message, 'error'); }
}

function _arCVL() { return {website:_i._g('vl_website'),referral:_i._g('vl_referral'),cold_call:_i._g('vl_cold_call'),social_media:_i._g('vl_social'),exhibition:_i._g('vl_exhibition'),high:_i._g('vl_high'),medium:_i._g('vl_medium'),low:_i._g('vl_low')}; }
function _arDescribeConds(conds) {

async function saveAssignmentRule(e) {
  e.preventDefault();
  const condField = document.getElementById('arCondField').value;
  const condValue = document.getElementById('arCondValue').value;
  const conds = condField ? {[condField]: condValue} : {};
  const data = {
    name: document.getElementById('arName').value,
    assign_method: document.getElementById('arMethod').value,
    assign_to: document.getElementById('arMethod').value==='direct' ? parseInt(document.getElementById('arUser').value) : null,
    conditions: conds,
    priority: parseInt(document.getElementById('arPriority').value) || 0
  };
  const activeEl = document.getElementById('arActive');
  if (activeEl) data.is_active = activeEl.checked ? 1 : 0;
  try {
    if (window._arEditId) {
      await api.put('/api/lead-assignment-rules/' + window._arEditId, data);
      showToast(_i._g('ar_updated'), 'success');
    } else {
      await api.post('/api/lead-assignment-rules', data);
      showToast(_i._g('ar_added'), 'success');
    }
    window._arEditId = null;
    closeModal();
    renderAssignmentRules(document.getElementById('app'));
  } catch(e) { showToast(e.message, 'error'); }
}

async function deleteAssignmentRule(id) {
  if (!confirm(_i._g('ar_del_confirm'))) return;
  await api.delete('/api/lead-assignment-rules/' + id);
  showToast(_i._g('ar_deleted'), 'success');
  renderAssignmentRules(document.getElementById('app'));
}

  if (!id) {
    const orderEl = document.getElementById('psOrder');
    if (orderEl) payload.sort_order = parseInt(orderEl.value) || 7;
  }
  if (!payload.name || !payload.display_name) {
    showToast('Name and display name required', 'error'); return;
  }
  try {
    if (id) {
      await api.put('/api/pipeline-stages/' + id, payload);
      showToast(_i._g('ps_updated'), 'success');
    } else {
      await api.post('/api/pipeline-stages', payload);
      showToast(_i._g('ps_added'), 'success');
    }
    closeModal();
    renderPipelineStagesAdmin(document.getElementById('app'));
  } catch(e) { showToast(esc(e.message), 'error'); }
}

// ─── Phase 3: Knowledge Base Page ───────────────────────────
// Multi-language article helper: title "EN / RU / AZ", content "## EN:...\n## RU:...\n## AZ:..."
function _kbLangTitle(title) {
  const parts = (title || '').split(' / ');
  const L = currentLang;
  if (parts.length >= 3) return L==='ru'?parts[1]:L==='az'?parts[2]:parts[0];
  if (parts.length === 2) return L==='ru'?parts[1]:parts[0];
  return title;
}
function _kbLangContent(content) {
  const L = currentLang;
  const key = L==='ru'?'## RU:':L==='az'?'## AZ:':'## EN:';
  const idx = (content||'').indexOf(key);
  if (idx === -1) return content || '';
  let text = content.substring(idx + key.length);
  // Cut off at next ## XX: section
  const nextMatch = text.match(/\n## (EN|RU|AZ):/);
  if (nextMatch) text = text.substring(0, nextMatch.index);
  return text.trim();
}
function _kbStatusLabel(status) {
  const L = currentLang;
  if (status === 'published') return L==='ru'?'опубликовано':L==='az'?'dərc olunub':'published';
  return L==='ru'?'черновик':L==='az'?'qaralama':'draft';
}
function _kbCatLabel(cat) {
  const L = currentLang;
  const m = {
    general: L==='ru'?'Общее':L==='az'?'Ümumi':'General',
    technical: L==='ru'?'Техническое':L==='az'?'Texniki':'Technical',
    faq: 'FAQ',
    getting_started: L==='ru'?'Начало работы':L==='az'?'Başlanğıc':'Getting Started',
    troubleshooting: L==='ru'?'Устранение неполадок':L==='az'?'Problemlərin həlli':'Troubleshooting',
    tutorial: L==='ru'?'Руководство':L==='az'?'Dərslik':'Tutorial',
    billing: L==='ru'?'Биллинг':L==='az'?'Ödəniş':'Billing'
  };
  return m[cat] || cat;
}

  const [{data: campaigns}, {data: stats}] = await Promise.all([
    api.get('/api/campaigns'),
    api.get('/api/campaigns/stats')
  ]);
  const L = currentLang;
  const _t = (en,ru,az) => L==='ru'?ru:L==='az'?az:en;
  const statusColors = {draft:'#64748b',scheduled:'#f59e0b',sending:'#3b82f6',sent:'#22c55e',cancelled:'#ef4444'};
  const statusLabels = {
    draft: _t('Draft','Черновик','Qaralama'),
    scheduled: _t('Scheduled','Запланирована','Planlaşdırılıb'),
    sending: _t('Sending','Отправляется','Göndərilir'),
    sent: _t('Sent','Отправлена','Göndərilib'),
    cancelled: _t('Cancelled','Отменена','Ləğv edilib')
  };
  const typeLabels = {email: _t('Email','Email','E-poçt'), sms: 'SMS'};

  el.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">${t('campaigns_title')}</h1>
      <button class="btn btn-primary btn-sm" onclick="showCreateCampaignModal()">+ ${t('campaign_new')}</button>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
      ${['draft','scheduled','sending','sent','cancelled'].map(status =>
        `<div class="card p-4 text-center">
          <div class="text-xl font-bold" style="color:${statusColors[status]}">${stats[status]||0}</div>
          <div class="text-xs text-slate-400 mt-1">${statusLabels[status]}</div>
        </div>`
      ).join('')}
    </div>
    ${!campaigns || campaigns.length === 0 ? `<div class="card p-8 text-center text-slate-500">${t('nothing_found')}</div>` :
      `<div class="space-y-2">
        ${campaigns.map(c => `
          <div class="card p-4 cursor-pointer hover:border-indigo-500 transition" onclick="showCampaignDetail(${c.id})">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <div class="font-semibold">${esc(c.name)}</div>
                ${c.description ? `<div class="text-xs text-slate-400 mt-1">${esc(c.description)}</div>` : ''}
                <div class="text-xs text-slate-500 mt-2">
                  <span style="color:${statusColors[c.status]||'#64748b'};font-weight:600">${statusLabels[c.status]||c.status}</span>
                  <span class="ml-3">📧 ${typeLabels[c.type]||c.type}</span>
                  <span class="ml-3">👥 ${c.total_recipients||0}</span>
                </div>
              </div>
              <div class="text-right">
                <div class="text-sm font-semibold">${c.sent_count||0}/${c.total_recipients||0}</div>
                <div class="text-xs text-slate-500">${t('campaign_sent_count')}</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>`}
  `;
}

async function saveNewCampaign() {
  const L = currentLang;
  const _t = (en,ru,az) => L==='ru'?ru:L==='az'?az:en;
  const name = document.getElementById('campName')?.value?.trim();
  if (!name) { showToast(_t('Name required','Название обязательно','Ad tələb olunur'),'error'); return; }
  try {
    await api.post('/api/campaigns', {
      name, description: document.getElementById('campDesc')?.value||'',
      type: document.getElementById('campType')?.value||'email',
      template_id: parseInt(document.getElementById('campTemplate')?.value||0)
    });
    closeModal(); showToast(t('campaign_created'),'success');
    renderCampaigns(document.getElementById('app'));
  } catch(e) { showToast(e.message,'error'); }
}

async function sendCampaign(id) {
  if (!confirm(t('campaign_send_confirm'))) return;
  try {
    await api.post('/api/campaigns/' + id + '/send', {});
    showToast(t('campaign_sent'),'success');
    closeModal();
    renderCampaigns(document.getElementById('app'));
  } catch(e) { showToast(e.message,'error'); }
}

async function deleteCampaign(id) {
  const L = currentLang;
  const _t = (en,ru,az) => L==='ru'?ru:L==='az'?az:en;
  if (!confirm(_t('Delete this campaign?','Удалить эту кампанию?','Bu kampaniya silinsin?'))) return;

    closeModal(); showToast(t('campaign_deleted'),'success');
    renderCampaigns(document.getElementById('app'));
  } catch(e) { showToast(e.message,'error'); }
}
