function onPriceEdit(input) {
  const cat = input.dataset.editCat;
  const comp = input.dataset.editComp;
  const newVal = parseFloat(input.value) || 0;

  // Update local data (backward compatibility for flat structure)
  const catData = _pricingData[comp].categories[cat];
  if (typeof catData === 'number' || !catData.services) {
    // Old structure: just a number
    _pricingData[comp].categories[cat] = newVal;
  } else {
    // New structure: has services
    catData.total = newVal;
  }

  const total = Object.values(_pricingData[comp].categories).reduce((s, v) => s + (v.total !== undefined ? v.total : v), 0);
  _pricingData[comp].monthly = Math.round(total * 100) / 100;
  _pricingData[comp].annual = Math.round(total * 12 * 100) / 100;

  // Update totals display
  const tm = document.getElementById('editTotalMonthly');
  if (tm) tm.textContent = formatCurrency(total);
  const ta = document.getElementById('editTotalAnnual');
  if (ta) ta.textContent = formatCurrency(total * 12);
  const ft = document.getElementById('editFooterTotal');
  if (ft) ft.textContent = formatCurrency(total);

  // Update sidebar monthly display for this company
  const sideItem = qsAttr('data-edit-company', comp);
  if (sideItem) { const sub = sideItem.querySelector('.text-xs'); if (sub) sub.textContent = formatCurrency(total) + '/ay'; }

  // Mark dirty for manual save
  _pricingEditDirty = true;
  const btnSave2 = document.getElementById('btnSaveEdit');
  const btnReset2 = document.getElementById('btnResetEdit');
  const badge2 = document.getElementById('editDirtyBadge');
  if (btnSave2) { btnSave2.style.opacity = '1'; btnSave2.style.pointerEvents = 'auto'; }
  if (btnReset2) { btnReset2.style.opacity = '1'; btnReset2.style.pointerEvents = 'auto'; }
  if (badge2) badge2.style.display = 'block';
  document.querySelectorAll('.cat-save-btn, .cat-reset-btn').forEach(b => { b.style.opacity = '1'; b.style.pointerEvents = 'auto'; });
}

// ─── Save / Reset for Edit Mode ─────────────────────────────

async function savePricingEdits() {
  if (!_pricingEditCompany || !_pricingEditDirty) return;
  try {
    await savePricingCompany(_pricingEditCompany);
  } catch(e) {
    // API error — keep dirty state, don't reset snapshot
    showToast('Save failed: ' + (e.message || e), 'error');
    return;
  }
  // Only mark clean if save succeeded
  _pricingEditSnapshot = JSON.parse(JSON.stringify(_pricingData[_pricingEditCompany]));
  _pricingEditDirty = false;
  const btnSave = document.getElementById('btnSaveEdit');
  const btnReset = document.getElementById('btnResetEdit');
  const badge = document.getElementById('editDirtyBadge');
  if (btnSave) { btnSave.style.opacity = '0.5'; btnSave.style.pointerEvents = 'none'; }
  if (btnReset) { btnReset.style.opacity = '0.5'; btnReset.style.pointerEvents = 'none'; }
  if (badge) badge.style.display = 'none';
  document.querySelectorAll('.orig-hint').forEach(el => el.remove());
  document.querySelectorAll('[data-edit-field]').forEach(el => el.style.borderColor = '#334155');
  document.querySelectorAll('.cat-save-btn, .cat-reset-btn').forEach(b => { b.style.opacity = '0.5'; b.style.pointerEvents = 'none'; });
}

function resetPricingEdits() {
  if (!_pricingEditCompany || !_pricingEditSnapshot) return;
  // Restore from snapshot
  _pricingData[_pricingEditCompany] = JSON.parse(JSON.stringify(_pricingEditSnapshot));
  _pricingEditDirty = false;
  // Re-render panel
  const categories = Object.keys(Object.values(_pricingData)[0].categories);
  const panel = document.getElementById('editPanel');
  if (panel) panel.innerHTML = renderCompanyEditPanel(_pricingEditCompany, categories);
  // Update sidebar
  const monthly = _pricingData[_pricingEditCompany].monthly ?? 0;
  const sideItem = qsAttr('data-edit-company', _pricingEditCompany);
  if (sideItem) { const sub = sideItem.querySelector('.text-xs'); if (sub) sub.textContent = formatCurrency(monthly) + '/ay'; }
  showToast(t('pricing_reset') + ' ✓', 'info');
}

async function savePricingCompany(companyName) {
  const indicator = document.getElementById('pricingSaveIndicator');
  if (indicator) { indicator.style.display = 'block'; indicator.textContent = t('pricing_saving'); indicator.classList.remove('text-green-400','border-green-500/30','bg-green-500/10'); indicator.classList.add('text-yellow-400','border-yellow-500/30','bg-yellow-500/10'); }
  try {
    await api.put(`/api/pricing/company/${encodeURIComponent(companyName)}`, {
      categories: _pricingData[companyName].categories
    });
    if (indicator) { indicator.textContent = t('pricing_saved'); indicator.classList.remove('text-yellow-400','border-yellow-500/30','bg-yellow-500/10'); indicator.classList.add('text-green-400','border-green-500/30','bg-green-500/10'); }
    setTimeout(() => { if (indicator) indicator.style.display = 'none'; }, 2000);
  } catch(e) {
    if (indicator) { indicator.textContent = 'Error!'; indicator.classList.remove('text-yellow-400','border-yellow-500/30','bg-yellow-500/10'); indicator.classList.add('text-red-400','border-red-500/30','bg-red-500/10'); }
    showToast(esc(e.message), 'error');
  }
}

// ─── Delete Company ──────────────────────────────────────────
async function deleteCompany(companyName) {
  if (!confirm(t('pricing_delete_confirm').replace('{name}', companyName))) return;
  try {
    const resp = await fetch(`/api/pricing/company/${encodeURIComponent(companyName)}`, {
      method: 'DELETE',
      headers: api._getHeaders()
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || 'Delete failed');
    }
    delete _pricingData[companyName];
    _pricingEditCompany = null;
    _pricingEditSnapshot = null;
    _pricingEditDirty = false;
    showToast(t('pricing_delete_success').replace('{name}', companyName), 'success');
    renderPricing(document.getElementById('app'));
  } catch(e) {
    showToast(e.message, 'error');
  }
}

async function exportPricingExcel(template) {
  const btn = document.getElementById('exportBtn');
  const origText = btn ? btn.innerHTML : '';
  if (btn) btn.innerHTML = `<svg class="animate-spin" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="15"/></svg> ${t('pricing_exporting')}`;
  try {
    const resp = await fetch('/api/pricing/export', {
      method: 'POST',
      headers: api._getHeaders(),
      body: JSON.stringify({ template, adjustments: _pricingAdjustments, effective_date: (function(){ var _ds = [].concat(Object.values(_pricingAdjustments.group_dates || {}), Object.values(_pricingAdjustments.category_dates || {}), Object.values(_pricingAdjustments.company_dates || {})).filter(Boolean).sort(); return _ds.length ? _ds[0] : null; })() })
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(errText || 'Export failed');
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = template === '2' ? 'SALES_Report.xlsx' : 'SALES_2026.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Excel exported successfully!', 'success');
  } catch(e) {
    showToast('Export error: ' + e.message, 'error');
  }
  if (btn) btn.innerHTML = origText;
}

async function submitImportCompany(e) {
  e.preventDefault();
  const fileInput = document.getElementById('importFile');
  const companyName = document.getElementById('importCompanyName').value.trim();
  const groupSel = document.getElementById('importGroupSelect').value;
  const groupNew = document.getElementById('importGroupNew').value.trim();
  const legalName = document.getElementById('importLegalName').value.trim();
  const btn = document.getElementById('importSubmitBtn');
  const resultDiv = document.getElementById('importResult');

  const groupName = groupSel === '__new__' ? groupNew : groupSel;

  if (!fileInput.files[0] || !companyName || !groupName) {
    showToast(t('pricing_import_fill_all'), 'error');
    return;
  }

  // Confirm if overwriting
  if (_pricingData[companyName]) {
    if (!confirm(t('pricing_import_overwrite').replace('{name}', companyName) + ' ' + t('pricing_import_continue'))) return;
  }

  btn.disabled = true;
  btn.innerHTML = '<svg class="animate-spin" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline;vertical-align:text-bottom;"><circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="15"/></svg> ' + t('pricing_importing');

  try {
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('company_name', companyName);
    formData.append('group_name', groupName);
    formData.append('legal_name', legalName);

    // Use raw fetch with auth header (FormData, no JSON content-type)
    const headers = {};
    const token = localStorage.getItem('crm_token');
    if (token) headers['Authorization'] = 'Bearer ' + token;

    const resp = await fetch('/api/pricing/import', {
      method: 'POST',
      headers: headers,
      body: formData
    });

    const result = await resp.json();
    if (!resp.ok) throw new Error(result.detail || result.message || 'Import failed');

    const data = result.data || result;

    // Show success
    resultDiv.style.display = 'block';
    resultDiv.style.background = '#064e3b44';
    resultDiv.style.border = '1px solid #059669';
    resultDiv.style.color = '#34d399';
    resultDiv.innerHTML = `
      <div style="font-weight:700;margin-bottom:6px;">✓ ${data.message || t('pricing_import_success')}</div>
      <div style="font-size:12px;color:#a7f3d0;">
        ${t('pricing_monthly')}: ${formatCurrency(data.monthly)} &nbsp;|&nbsp;
        ${t('pricing_annual')}: ${formatCurrency(data.annual)} &nbsp;|&nbsp;
        ${t('pricing_categories')}: ${data.categories_count} &nbsp;|&nbsp;
        ${t('pricing_services')}: ${data.services_count}
      </div>
    `;

    showToast(data.message || t('pricing_import_success'), 'success');

    // Reload pricing data and re-render
    setTimeout(async () => {
      try {
        const freshResp = await api.get('/api/pricing/data');
        _pricingData = freshResp.data;
        closeImportModal();
        renderPricing(document.getElementById('app'));
      } catch(e2) {
        console.warn('Could not auto-reload:', e2);
      }
    }, 1500);

  } catch(err) {
    resultDiv.style.display = 'block';
    resultDiv.style.background = '#7f1d1d44';
    resultDiv.style.border = '1px solid #dc2626';
    resultDiv.style.color = '#f87171';
    resultDiv.innerHTML = `<div style="font-weight:700;">✗ ${esc(err.message)}</div>`;
    showToast(err.message, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = t('pricing_import_submit');
}

let _formDirty = false;
function markFormDirty() { _formDirty = true; }
function clearFormDirty() { _formDirty = false; }

// Button loading state: prevents double-clicks during form submission
function withLoading(btn, asyncFn) {
  if (!btn || btn.disabled) return;
  const origHTML = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '0.6';
  btn.innerHTML = '<svg class="animate-spin" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline;vertical-align:text-bottom;"><circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="15"/></svg> ' + origHTML;
  return asyncFn().finally(() => {
    btn.disabled = false;
    btn.style.opacity = '';
    btn.innerHTML = origHTML;
  });
}

function trapFocus(modal) {
  const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  first.focus();
  modal.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    if (e.key === 'Escape') closeModal();
  });
}

function confirmDialog(message) {
  return new Promise(resolve => {
    const modal = document.getElementById('modalContainer');
    modal.innerHTML = `
      <div class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content" style="max-width:400px;text-align:center;">
          <p class="mb-6 text-lg">${message}</p>
          <div class="flex gap-3 justify-center">
            <button class="btn btn-danger" id="confirmYes">${t('btn_delete')}</button>
            <button class="btn btn-secondary" id="confirmNo">${t('btn_cancel')}</button>
          </div>
        </div>
      </div>`;
    document.getElementById('confirmYes').onclick = () => { modal.innerHTML = ''; resolve(true); };
    document.getElementById('confirmNo').onclick = () => { modal.innerHTML = ''; resolve(false); };
  });
}

function showModal(html) {
  const container = document.getElementById('modalContainer');
  container.innerHTML = `<div class="modal-overlay" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()"><div class="modal-content">${html}</div></div>`;
  trapFocus(container.querySelector('.modal-overlay'));
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  if (_formDirty) {
    confirmDialog(t('unsaved_changes')).then(ok => {
      if (ok) { _formDirty = false; _closeModal(); }
    });
    return;
  }
  _closeModal();
}

function _closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
  document.body.style.overflow = '';
  _formDirty = false;
}

// ─── Toast (max 5 stacked) ────────────────────────────────────
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  // Limit max toasts to prevent overflow
  while (container.children.length >= 5) container.firstChild.remove();
  const div = document.createElement('div');
  div.className = `toast toast-${type}`;
  div.textContent = msg;
  container.appendChild(div);
  setTimeout(() => { if (div.parentNode) div.remove(); }, 3000);
}

function showLoading(el) {
  el.innerHTML = '<div class="spinner"></div>';
}

// ─── Sync ────────────────────────────────────────────────────
async function triggerSync() {
  const btn = document.getElementById('syncBtn');
  if (btn) { btn.disabled = true; btn.classList.add('sync-pulse'); btn.textContent = t('btn_syncing'); }
  try {
    const r = await api.post('/api/sync', {});
    showToast(t('toast_synced', {new: r.new||0, updated: r.updated||0}), 'success');
    renderPage(state.page);
  } catch(e) {
    showToast(t('toast_sync_error'), 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('sync-pulse'); btn.textContent = t('btn_sync'); }
  }
}

function renderMuqavileTable() {
  const tbody = document.getElementById('muqavileTableBody');
  if (!tbody) return;

  const rows = _muqavileCompanies
    .filter(c => !filter || c.code.toLowerCase().includes(filter) ||
                  (c.legal_name||'').toLowerCase().includes(filter) ||
                  (c.group||'').toLowerCase().includes(filter));

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="px-4 py-6 text-center text-gray-500">Heç nə tapılmadı</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map((c, idx) => {
    const tplBadge = c.has_template
      ? `<span class="inline-block px-2 py-0.5 rounded text-xs bg-green-900 text-green-300">✓ ${t('muq_exists')}</span>`
      : `<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-700 text-gray-400">${t('muq_not_exists')}</span>`;
    const detBadge = c.has_details
      ? `<span class="inline-block px-2 py-0.5 rounded text-xs bg-blue-900 text-blue-300">✓ ${t('muq_exists')}</span>`
      : `<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-700 text-gray-400">${t('muq_not_exists')}</span>`;
    const lastImport = c.last_imported
      ? `<span class="text-xs text-gray-400">${c.last_imported.substring(0,10)}</span>`
      : `<span class="text-xs text-gray-600">—</span>`;
    const monthly = c.monthly_total > 0

async function doExcelUpload() {
  const fileInput = document.getElementById('excelUploadFile');
  const code = document.getElementById('excelUploadCode').value.trim();
  const group = document.getElementById('excelUploadGroup').value.trim() || 'Separated';
  const crmCompany = document.getElementById('excelUploadCrmCompany').value.trim();
  const resultDiv = document.getElementById('excelUploadResult');
  const btn = document.getElementById('excelUploadBtn');

  if (!fileInput.files.length) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='Fayl seçin!'; resultDiv.classList.remove('hidden'); return; }
  if (!code) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='Şirkət kodu daxil edin!'; resultDiv.classList.remove('hidden'); return; }
  if (!group) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='Qrup seçmək məcburidir!'; resultDiv.classList.remove('hidden'); return; }
  if (!crmCompany) { resultDiv.className='text-red-400 text-sm'; resultDiv.textContent='CRM şirkəti seçmək məcburidir!'; resultDiv.classList.remove('hidden'); return; }

  btn.disabled = true; btn.textContent = '⏳ Yüklənir...';
  resultDiv.className = 'text-yellow-400 text-sm'; resultDiv.textContent = 'Fayl emal olunur...'; resultDiv.classList.remove('hidden');

  // Save CRM mapping
  try { await api.post('/api/pricing/crm-mapping', {updates: {[code]: crmCompany}}); } catch(e) {}

  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  fd.append('company_name', code);
  fd.append('group_name', group);

  try {
    const d = await api.post('/api/pricing/import', fd);
    resultDiv.className = 'text-green-400 text-sm p-3 rounded' ;
    resultDiv.style.background = '#0f291a';
    resultDiv.innerHTML = `
      ✅ <b>${esc(d.company_name)}</b> → <b>${esc(crmCompany)}</b> uğurla import edildi!<br>
      <span class="text-xs text-gray-400">
        Aylıq: <b class="text-green-300">${Number(d.monthly).toLocaleString('az-AZ',{minimumFractionDigits:2})} ₼</b> |
        Kateqoriya: ${d.categories_count} | Xidmət: ${d.services_count}
      </span>`;
    resultDiv.classList.remove('hidden');
    btn.textContent = '✅ Tamamlandı';
    // Refresh table
    setTimeout(() => { closeModal(); renderMuqavile(document.getElementById('app')); }, 1500);
  } catch(e) {
    resultDiv.className = 'text-red-400 text-sm'; resultDiv.textContent = '❌ Xəta: ' + String(e).substring(0, 200); resultDiv.classList.remove('hidden');
    btn.disabled = false; btn.textContent = '📊 Yüklə və İmport et';
  }
}

function extractCompanyCode(filename) {
  // "1. AFİ.xlsx" → "AFİ", "ZEYTUN.xlsx" → "ZEYTUN", "23. FOTON.xlsx" → "FOTON"
  let name = filename.replace(/\.(xlsx|xlsm)$/i, '').trim();
  // Remove leading "N. " or "N " prefix
  name = name.replace(/^\d+[\.\)\-]?\s*/, '').trim();
  return name.toUpperCase();
}

async function saveEditCompanyModal(code) {
  const legalName    = document.getElementById('ecLegalName').value.trim();
  const voen         = document.getElementById('ecVoen').value.trim();
  const directorName = document.getElementById('ecDirectorName').value.trim();
  const address      = document.getElementById('ecAddress').value.trim();
  const bank         = document.getElementById('ecBank').value.trim();

  // Load existing full details to merge
  let details = {};
  try {
    const res = await api.get(`/api/contracts/details/${encodeURIComponent(code)}`);
    details = res.data || {};
  } catch(e) {}

  if (!details.client) details.client = {};
  if (legalName)    details.client.legal_name    = legalName;
  if (voen)         details.client.voen          = voen;
  if (directorName) details.client.director_name = directorName;
  if (address)      details.client.address       = address;
  if (bank)         details.client.bank          = bank;

  try {
    await api.put(`/api/contracts/details/${encodeURIComponent(code)}`, details);
    showToast('✅ Məlumatlar yadda saxlandı', 'success');
    closeModal();
    // Update local cache and re-render table
    const idx = _muqavileCompanies.findIndex(c => c.code === code);
    if (idx !== -1) _muqavileCompanies[idx].legal_name = legalName || _muqavileCompanies[idx].legal_name;
    renderMuqavileTable();
  } catch(e) {
    showToast('❌ Xəta baş verdi', 'error');
  }
}

      </div>
    </div>
  `;
  document.getElementById('importContractModal').classList.remove('hidden');

  // Auto-detect company from filename → match to dropdown
  document.getElementById('importContractFile').onchange = function() {
    const file = this.files[0];
    if (file) {
      const code = file.name.split(' - ')[0].replace(/\.(docx|doc)$/i, '').trim();
      document.getElementById('importContractCode').value = code;
      // Try to find matching company
      const match = companies.find(c => c.name.toLowerCase() === code.toLowerCase() || (c.cost_code && c.cost_code.toLowerCase() === code.toLowerCase()));
      if (match) {
        selectSearchDD('importContractCompany', match.cost_code || match.name);
      }
      const det = document.getElementById('importDetectedCompany');
      det.textContent = match
        ? `✅ Avtomatik tapıldı: "${match.name}"`
        : `⚠️ "${code}" — şirkət tapılmadı, əl ilə seçin`;
      det.classList.remove('hidden');
    }
  };
}

function closeImportContractModal() {
  document.getElementById('importContractModal').classList.add('hidden');
}

async function submitImportContract() {
  const fileInput = document.getElementById('importContractFile');
  const codeInput = document.getElementById('importContractCode');
  const companyInput = document.getElementById('importContractCompany');
  const errDiv    = document.getElementById('importContractError');
  errDiv.classList.add('hidden');

  if (!fileInput.files[0]) {
    errDiv.textContent = 'Fayl seçin';
    errDiv.classList.remove('hidden');
    return;
  }
  if (!companyInput || !companyInput.value.trim()) {
    errDiv.textContent = 'Şirkət seçmək məcburidir!';
    errDiv.classList.remove('hidden');
    return;
  }

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  formData.append('company_code', codeInput.value.trim() || companyInput.value.trim());
  formData.append('company_name', companyInput.value.trim());

  try {
    const btn = document.querySelector('#importContractModal .btn-primary');
    btn.disabled = true;
    btn.textContent = '⏳ Yüklənir...';

    const res = await fetch('/api/contracts/import', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` },
      body: formData
    });
    const data = await res.json();

    if (data.success) {
      closeImportContractModal();
      showToast(`✅ ${(data.data && data.data.message) || 'Import uğurlu oldu'}`);
      await renderMuqavile(document.getElementById('app'));
    } else {
      errDiv.textContent = data.message || 'Xəta baş verdi';
      errDiv.classList.remove('hidden');
    }
  } catch(e) {
    errDiv.textContent = 'Şəbəkə xətası: ' + String(e);
    errDiv.classList.remove('hidden');
  } finally {
    const btn = document.querySelector('#importContractModal .btn-primary');
    if (btn) { btn.disabled = false; btn.textContent = t('contract_upload_submit'); }
  }
}

    contract_number: document.getElementById('genContractNumber').value.trim(),
    signing_date:    document.getElementById('genSigningDate').value.trim(),
    period_start:    document.getElementById('genPeriodStart').value.trim(),

  };

      },
      body: JSON.stringify(params)
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || `HTTP ${res.status}`);
    }

    // Download the file
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const cd   = res.headers.get('Content-Disposition') || '';
    // Support both filename*=UTF-8''encoded and filename="plain"
    const fn8 = cd.match(/filename\*=UTF-8''([^;\s]+)/i);

    const fileName = fn8 ? decodeURIComponent(fn8[1]) : fnPlain ? fnPlain[1] : `${_muqavileSelected} - Guven Technology - Müqavilə.docx`;
    a.download = fileName;
    a.href = url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    closeGenerateModal();
    showToast(`✓ Müqavilə hazırlandı: ${a.download}`);
  } catch(e) {
    errDiv.textContent = 'Xəta: ' + String(e);
    errDiv.classList.remove('hidden');

    btn.disabled = false;
    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> Yarat &amp; Yüklə`;
  }

async function submitUploadQrp() {
  const fileInput = document.getElementById('uploadQrpFile');
  const errDiv    = document.getElementById('uploadQrpError');
  const btn       = document.getElementById('uploadQrpSubmitBtn');
  errDiv.classList.add('hidden');

  if (!fileInput.files || !fileInput.files[0]) {
    errDiv.textContent = 'Zəhmət olmasa fayl seçin.';
    errDiv.classList.remove('hidden');
    return;
  }
  const file = fileInput.files[0];
  if (!file.name.endsWith('.docx')) {
    errDiv.textContent = 'Yalnız .docx faylı qəbul olunur.';
    errDiv.classList.remove('hidden');
    return;
  }

  try {

      successMsg = `✓ ${_uploadQrpCode} üçün ${t('muq_qrp_template')} yeniləndi`;

// ── Price Change Modal ────────────────────────────────────
let _priceChangeCompany = null;
let _priceChangeItems = [];  // [{cat, name, unit, old_qty, old_price, new_qty, new_price}]
let _priceChangePending = []; // list of pending price changes from DB

let _pcModalGeneration = 0;
async function openPriceChangeModal(companyCode) {
  _priceChangeCompany = companyCode;
  const myGen = ++_pcModalGeneration;

  let pricingData = null;
  try {
    const r = await apiFetch('/api/pricing/data');
    pricingData = r.data || {};
  } catch(e) { showToast('Qiymət datası yüklənə bilmədi','error'); return; }

  if (myGen !== _pcModalGeneration) return;

  const companyPricing = pricingData[companyCode];
  if (!companyPricing || !companyPricing.categories) {
    showToast('Bu şirkət üçün qiymət datası tapılmadı','error');
    return;
  }

  try {
    const r = await apiFetch(`/api/price-changes?company_code=${encodeURIComponent(companyCode)}`);
    _priceChangePending = (r.data || []).filter(pc => pc.status === 'pending');
  } catch(e) { _priceChangePending = []; }

  if (myGen !== _pcModalGeneration) return;

  const items = [];
  for (const [catName, catData] of Object.entries(companyPricing.categories)) {
    for (const svc of (catData.services || [])) {
      let effPrice = svc.price || 0;
      const svcTotal = svc.total || 0;
      const svcQty = svc.qty || 0;
      if (svcQty > 0 && svcTotal > 0 && Math.abs(svcTotal - svcQty * effPrice) > 0.01) {
        effPrice = Math.round(svcTotal / svcQty * 100) / 100;
      }
      items.push({
        category: catName,
        name: svc.name,
        unit: svc.unit || '',
        old_qty: svcQty,
        old_price: effPrice,
        new_qty: svcQty,
        new_price: effPrice,
      });
    }
  }
  _priceChangeItems = items;

  renderPriceChangeModal();
}

function renderPriceChangeModal() {
  const code = _priceChangeCompany;
  const items = _priceChangeItems;

  // Group by category

    if (!cats[it.category]) cats[it.category] = [];
    cats[it.category].push({...it, idx: i});

  const oldTotal = items.reduce((s,i) => s + i.old_qty * i.old_price, 0);
  const newTotal = items.reduce((s,i) => s + i.new_qty * i.new_price, 0);
  const diff = newTotal - oldTotal;
  const diffPct = oldTotal > 0 ? ((diff / oldTotal) * 100).toFixed(1) : '0.0';

function pcUpdateItem(el) {
  const idx = +el.dataset.pcIdx;
  const field = el.dataset.pcField;
  const val = +el.value || 0;
  if (field === 'qty') _priceChangeItems[idx].new_qty = val;
  else if (field === 'price') _priceChangeItems[idx].new_price = val;
  pcRecalcAll();
}

function pcRecalcAll() {
  const items = _priceChangeItems;

  // Update each row's Cəmi and Fərq cells
  items.forEach((it, i) => {
    const oldT = it.old_qty * it.old_price;
    const newT = it.new_qty * it.new_price;
    const d = newT - oldT;
    // Update Cəmi cell
    const totalCell = document.getElementById('pcTotal' + i);
    if (totalCell) totalCell.textContent = newT.toFixed(2);
    const cell = document.getElementById('pcDiff' + i);
    if (cell) {
      const changed = it.old_qty !== it.new_qty || it.old_price !== it.new_price;
      const row = document.getElementById('pcRow' + i);
      if (row) row.style.background = changed ? 'rgba(234,179,8,0.08)' : '';
      if (d === 0) {
        cell.textContent = '—';
        cell.className = 'px-2 py-1 text-right font-mono text-gray-600';
      } else {
        cell.textContent = (d > 0 ? '+' : '') + d.toFixed(2) + ' ₼';
        cell.className = 'px-2 py-1 text-right font-mono ' + (d > 0 ? 'text-green-400' : 'text-red-400');
      }
    }
  });

  // Update each category totals
  for (const [catId, indices] of Object.entries(window._pcCatMap || {})) {
    const catOld = indices.reduce((s, i) => s + items[i].old_qty * items[i].old_price, 0);
    const catNew = indices.reduce((s, i) => s + items[i].new_qty * items[i].new_price, 0);
    const catDiff = catNew - catOld;
    const elOld = document.getElementById(catId + '_old');
    const elNew = document.getElementById(catId + '_new');
    const elDiff = document.getElementById(catId + '_diff');
    if (elOld) elOld.textContent = catOld.toFixed(2) + ' ₼';
    if (elNew) elNew.textContent = catNew.toFixed(2) + ' ₼';
    if (elDiff) {
      if (catDiff === 0) {
        elDiff.textContent = '—';
        elDiff.className = 'font-mono text-gray-500';
      } else {
        elDiff.textContent = (catDiff > 0 ? '+' : '') + catDiff.toFixed(2) + ' ₼';
        elDiff.className = 'font-mono ' + (catDiff > 0 ? 'text-green-400' : 'text-red-400');
      }
    }
  }

  // Update global totals bar + summary card
  const oldTotal = items.reduce((s,i) => s + i.old_qty * i.old_price, 0);
  const newTotal = items.reduce((s,i) => s + i.new_qty * i.new_price, 0);
  const diff = newTotal - oldTotal;
  const diffPct = oldTotal > 0 ? ((diff / oldTotal) * 100).toFixed(1) : '0.0';
  const diffClass = diff > 0 ? 'text-green-400' : diff < 0 ? 'text-red-400' : 'text-gray-400';
  const bar = document.getElementById('pcTotalsBar');
  if (bar) {
    bar.innerHTML = `Köhnə: <span class="text-gray-400">${oldTotal.toFixed(2)} ₼</span>
      &nbsp;→&nbsp; Yeni: <span class="text-white font-bold">${newTotal.toFixed(2)} ₼</span>
      &nbsp; <span class="${diffClass}">(${diff > 0 ? '+' : ''}${diff.toFixed(2)} ₼ / ${diff > 0 ? '+' : ''}${diffPct}%)</span>`;
  }

  // Summary card
  const elOld = document.getElementById('pcSumOld');
  const elNew = document.getElementById('pcSumNew');
  const elDiff = document.getElementById('pcSumDiff');
  const elOldY = document.getElementById('pcSumOldYear');
  const elNewY = document.getElementById('pcSumNewYear');
  const elDiffY = document.getElementById('pcSumDiffYear');
  if (elOld) elOld.textContent = oldTotal.toFixed(2) + ' ₼';
  if (elNew) elNew.textContent = newTotal.toFixed(2) + ' ₼';
  if (elOldY) elOldY.textContent = 'İllik: ' + (oldTotal * 12).toFixed(2) + ' ₼';
  if (elNewY) elNewY.textContent = 'İllik: ' + (newTotal * 12).toFixed(2) + ' ₼';
  if (elDiff) {
    if (diff === 0) {
      elDiff.textContent = '—';
      elDiff.className = 'text-lg font-bold text-gray-500';
    } else {
      elDiff.textContent = (diff > 0 ? '+' : '') + diff.toFixed(2) + ' ₼ (' + (diff > 0 ? '+' : '') + diffPct + '%)';
      elDiff.className = 'text-lg font-bold ' + (diff > 0 ? 'text-green-400' : 'text-red-400');
    }
  }
  if (elDiffY) {
    const diffY = diff * 12;
    if (diffY === 0) {
      elDiffY.textContent = '—';
      elDiffY.className = 'text-xs text-gray-600';
    } else {
      elDiffY.textContent = 'İllik: ' + (diffY > 0 ? '+' : '') + diffY.toFixed(2) + ' ₼';
      elDiffY.className = 'text-xs ' + (diffY > 0 ? 'text-green-400' : 'text-red-400');
    }
  }
}

let _pcFromCalcUpload = false;
async function pcHandleCalcUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const fnEl = document.getElementById('pcCalcFileName');
  const statusEl = document.getElementById('pcCalcUploadStatus');
  if (fnEl) fnEl.textContent = file.name;
  if (statusEl) { statusEl.classList.remove('hidden'); statusEl.innerHTML = '<div class="text-xs text-yellow-300">\u23f3 Fayl y\u00fckl\u0259nir v\u0259 analiz olunur...</div>'; }
  const formData = new FormData();
  formData.append('file', file);
  try {
    const parsed = await api.post('/api/pricing/parse-calculator', formData);
    if (!parsed || !parsed.categories) {
      if (statusEl) statusEl.innerHTML = '<div class="text-xs text-red-400">Faylda kateqoriya tap\u0131lmad\u0131</div>';
      return;
    }
    function norm(s) {
      return (s||'').toLowerCase().trim()
        .replace(/\u0130/g,'i')
        .replace(/[\u201c\u201d\u0022]/g,'')
        .replace(/front\s+office\s+support/gi,'')
        .replace(/[\u200b\u00a0]/g,' ')
        .replace(/\s*[\u2013\u2014-]\s*/g,' ')
        .replace(/sisteml\u0259ri\s*,/g,',')
        .replace(/v\u0259\s+s\.\s*\)/g,')')
        .replace(/,\s*,/g,',')
        .replace(/\s*,/g,',')
        .replace(/\s+/g,' ')
        .replace(/\(\s+/g,'(').replace(/\s+\)/g,')')
        .replace(/,\s*\)/g,')')
        .replace(/\s*\(.*?\)\s*$/g, '')
        .trim();
    }
        // Zero out all items first, then fill from file
        _priceChangeItems.forEach(it => { it.new_qty = 0; it.new_price = 0; });
    let matched = 0, unmatched = 0;
    const unmatchedList = [];
    for (const [catName, catData] of Object.entries(parsed.categories)) {
      for (const svc of (catData.services || [])) {
        const svcNorm = norm(svc.name);
        let found = false;
        for (let i = 0; i < _priceChangeItems.length; i++) {
          if (norm(_priceChangeItems[i].name) === svcNorm || norm(_priceChangeItems[i].name).startsWith(svcNorm) || svcNorm.startsWith(norm(_priceChangeItems[i].name))) {
            _priceChangeItems[i].new_qty = svc.qty || 0;
            // Use effective price: if Excel total differs from qty*price, derive price from total
            let effPrice = svc.price || 0;
            const svcTotal = svc.total || 0;
            const svcQty = svc.qty || 0;
            if (svcQty > 0 && svcTotal > 0 && Math.abs(svcTotal - svcQty * effPrice) > 0.01) {
              effPrice = Math.round(svcTotal / svcQty * 100) / 100;
            }
            _priceChangeItems[i].new_price = effPrice;
            found = true; matched++; break;
          }
        }
        if (!found) { unmatched++; unmatchedList.push({name: svc.name, qty: svc.qty, price: svc.price, cat: catName}); }
      }
    }
    _priceChangeItems.forEach((it, i) => {
      const row = document.getElementById('pcRow' + i);
      if (!row) return;
      const qI = row.querySelector('[data-pc-field="qty"]');
      const pI = row.querySelector('[data-pc-field="price"]');
      if (qI) qI.value = it.new_qty;
      if (pI) pI.value = it.new_price.toFixed(2);
    });
    pcRecalcAll();
        _pcFromCalcUpload = true;
    let html = '<div class="text-xs text-green-400">\u2713 ' + matched + ' xidm\u0259t u\u011furla uy\u011funla\u015fd\u0131r\u0131ld\u0131</div>';
    if (unmatched > 0) {
      html += '<div class="text-xs text-yellow-400 mt-1">\u26a0 ' + unmatched + ' xidm\u0259t uy\u011funla\u015fd\u0131r\u0131la bilm\u0259di:</div>';
      html += '<div class="text-xs text-gray-400 mt-1 max-h-40 overflow-y-auto">';
      unmatchedList.forEach(u => { html += '<div>\u2022 ' + u.name + ' (say:' + u.qty + ', qiym\u0259t:' + u.price + ')</div>'; });
      html += '</div>';
    }
    if (statusEl) statusEl.innerHTML = html;
  } catch(e) {
    if (statusEl) statusEl.innerHTML = '<div class="text-xs text-red-400">X\u0259ta: ' + String(e) + '</div>';
  }
}

async function submitPriceChange() {
  const code = _priceChangeCompany;
  const items = _priceChangeItems;
  const notes = document.getElementById('pcNotes')?.value || '';

  // Check if any changes were made
  const hasChanges = items.some(i => i.old_qty !== i.new_qty || i.old_price !== i.new_price);
  if (!hasChanges) {
    showToast('Heç bir dəyişiklik yoxdur', 'error');
    return;
  }

  // Build new pricing structure
  const cats = {};
  for (const it of items) {
    if (!cats[it.category]) cats[it.category] = { services: [], total: 0 };
    cats[it.category].services.push({
      name: it.name,
      unit: it.unit,
      qty: it.new_qty,
      price: it.new_price
    });
    cats[it.category].total += it.new_qty * it.new_price;
  }
  // Round totals
  for (const c of Object.values(cats)) c.total = +c.total.toFixed(2);

  const monthlyTotal = Object.values(cats).reduce((s,c) => s + c.total, 0);

  try {
    await api.post('/api/price-changes', {
      auto_approve: _pcFromCalcUpload,
      company_code: code,
      new_prices: { categories: cats, monthly_total: +monthlyTotal.toFixed(2) },
      notes
    });
    _pcFromCalcUpload = false;
    showToast('✓ Qiymət dəyişikliyi təsdiqə göndərildi', 'success');
    renderPage('muqavile');
  } catch(e) {
    showToast('Xəta: ' + String(e), 'error');
  }
}

      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || data.message || `HTTP ${res.status}`);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const cd = res.headers.get('Content-Disposition') || '';

// ── Status update ──────────────────────────────────────
async function updateOfferStatus(id, status) {
  try {
    const res = await apiFetch('/api/offers/' + id);
    const o = res.data;
    const items = typeof o.items === 'string' ? JSON.parse(o.items||'[]') : (o.items||[]);
    await api.put('/api/offers/' + id, {...o, items, status});
    showToast('Status updated', 'success');
    // Sync deal stage based on offer status
    try {
      const dealsRes = await apiFetch('/api/deals?limit=500');
      const deals = dealsRes.data || [];
      const linked = deals.find(d => d.title && d.title.includes(o.offer_number));
      if (linked) {
        const stageMap = { accepted: 'WON', sent: 'NEGOTIATION', rejected: 'LOST', draft: 'PROPOSAL' };
        const newStage = stageMap[status] || linked.stage;
        const upd = { stage: newStage };
        if (status === 'accepted') upd.won_date = new Date().toISOString();
        await api.put('/api/deals/' + linked.id, upd);
      }
    } catch(de) { console.warn('Deal sync failed:', de); }
    closeModal();
    renderPage('offers');
  } catch(e) { showToast(esc(e.message), 'error'); }
}

async function createDealFromOffer(e, offerId) {
  e.preventDefault();
  const form = new FormData(e.target);
  try {
    // Get offer to find company_id
    const res = await apiFetch('/api/offers/' + offerId);
    const o = res.data;
    const deal = {
      title: form.get('title'),
      company_id: o.company_id || null,
      contact_id: null,
      stage: form.get('stage'),
      value_amount: +(form.get('value_amount')||0),
      value_currency: form.get('value_currency') || 'AZN',
      notes: form.get('notes') || '',
      expected_close: null
    };
    const created = await api.post('/api/deals', deal);
    // If WON, update won_date
    if (deal.stage === 'WON' && created?.data?.id) {
      await api.put('/api/deals/' + created.data.id, { won_date: new Date().toISOString() });
    }
    showToast(t('offer_to_deal_success'), 'success');
    closeModal();
    renderPage('offers');

}

// ── Generate PDF ───────────────────────────────────────
async function generateOfferPdf(id) {
  try {
    const res = await fetch('/api/offers/' + id + '/pdf', {
      method: 'POST',
      headers: {'Authorization': `Bearer ${localStorage.getItem('crm_token')}`}
    });
    if (!res.ok) {
      const d = await res.json().catch(()=>({}));
      throw new Error(d.detail || `HTTP ${res.status}`);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const cd = res.headers.get('Content-Disposition') || '';
    const fnm = cd.match(/filename="([^"]+)"/);
    a.download = fnm ? fnm[1] : `offer_${id}.pdf`;
    a.href = url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('PDF generated', 'success');
  } catch(e) { showToast(esc(e.message), 'error'); }
}

// Find company_details entry by CRM company name (fuzzy match by code or legal_name)
function findCompanyDetail(companyName) {
  if (!_offerCompanyDetails || !companyName) return null;
  const norm = s => s.toLowerCase().replace(/[\s\-«»'']/g,'');
  const n = norm(companyName);
  for (const [code, info] of Object.entries(_offerCompanyDetails)) {
    const cn = norm(code);
    const ln = norm(info.client?.legal_name || '');
    const lnClean = norm((info.client?.legal_name || '').replace(/MMC|ASC/gi,''));
    if (cn === n || n.includes(cn) || cn.includes(n) || ln.includes(n) || lnClean === n) return info;
  }
  return null;
}

function filterCrmClients(q) {
  const dd = document.getElementById('crmClientDropdown');

  dd.classList.remove('hidden');
  const lq = q.toLowerCase();
  dd.querySelectorAll('.crm-client-opt').forEach(el => {

  });
}

function selectCrmClient(id, name) {
  const si = document.getElementById('crmClientSearch');
  const hi = document.getElementById('crmCompanyIdInput');
  const dd = document.getElementById('crmClientDropdown');
  if (si) si.value = name;
  if (hi) hi.value = id;
  if (dd) dd.classList.add('hidden');
  // Also fill manual fields + auto-fill VÖEN/contact from company_details
  const form = document.querySelector('form');
  if (form) {
    const ni = form.querySelector('[name="client_name"]');
    if (ni) ni.value = name;
    const detail = findCompanyDetail(name);
    if (detail && detail.client) {
      const vi = form.querySelector('[name="client_voen"]');
      const ci = form.querySelector('[name="client_contact"]');
      const cti = form.querySelector('[name="client_contract"]');
      if (vi && !vi.value) vi.value = detail.client.voen || '';
      if (ci && !ci.value) ci.value = (detail.client.director_name || '') + (detail.client.director_title ? ' — ' + detail.client.director_title : '');
      if (cti && !cti.value) cti.value = detail.contract_number || '';
      // Also set legal name instead of short code
      if (ni && detail.client.legal_name) ni.value = detail.client.legal_name;
    }
  }
}

// ── Load from pricing template ─────────────────────────
async function offerLoadPricing() {
  if (!_offerPricingData) {
    try {
      const r = await apiFetch('/api/pricing/data');
      _offerPricingData = r.data;
    } catch(e) { showToast('Failed to load pricing','error'); return; }
  }
  // Load standard catalog from first company (prices are the same)
  const firstCode = Object.keys(_offerPricingData)[0];
  if (!firstCode) { showToast('No pricing data','error'); return; }
  loadPricingDirect(firstCode);
}

function loadPricingDirect(code) {
  if (!_offerPricingData || !_offerPricingData[code]) return;
  const data = _offerPricingData[code];
  const cats = data.categories || {};
  const currentDiscount = +(document.getElementById('offerDiscountPct')?.value || 0);
  _offerItems = [];
  for (const [catName, catData] of Object.entries(cats)) {
    const services = catData.services || [];
    for (const svc of services) {
      if (!(svc.price > 0)) continue;
      _offerItems.push({
        name: svc.name,
        category: catName,
        unit: svc.unit || '',
        qty: 0,
        price: svc.price || 0,
        discount: currentDiscount
      });
    }
  }
  renderOfferItems();
  showToast(`${_offerItems.length} xidmət yükləndi`, 'success');
}

// ── Save offer ─────────────────────────────────────────
async function saveOffer(e, id) {
  e.preventDefault();
  const form = new FormData(e.target);
  const clientSource = form.get('client_source');

  const data = {
    offer_type: form.get('offer_type'),
    currency: form.get('currency'),
    show_vat: form.get('show_vat') === 'on' ? 1 : 0,
    vat_pct: 18,
    view_mode: form.get('view_mode') || 'detailed',
    company_id: clientSource === 'crm' ? (form.get('company_id') || null) : null,
    client_name: form.get('client_name') || '',
    client_voen: form.get('client_voen') || '',
    client_contact: form.get('client_contact') || '',
    client_contract: form.get('client_contract') || '',
    notes: form.get('notes') || '',
    valid_until: form.get('valid_until') || '',
    items: _offerItems,
    status: 'draft'
  };

  // If CRM client, fill name from search input
  if (clientSource === 'crm' && data.company_id) {
    const si = document.getElementById('crmClientSearch');
    if (si && si.value) data.client_name = si.value;
  }

  const btn = e.target.querySelector('button[type="submit"]');
  if (btn) btn.disabled = true;

  try {
    if (id) {
      await api.put('/api/offers/' + id, data);
      showToast(t('company_updated'), 'success');
    } else {
      const created = await api.post('/api/offers', data);
      showToast(t('company_created'), 'success');
      // Auto-create deal in PROPOSAL stage
      if (created) {
        const o = created;
        const items = o.items ? (typeof o.items === 'string' ? JSON.parse(o.items) : o.items) : _offerItems;
        const total = items.reduce((s,i) => s + (i.qty||0)*(i.price||0)*(1-(i.discount||0)/100), 0);
        const vatAmt = data.show_vat ? total * 18 / 100 : 0;
        const grand = total + vatAmt;
        try {
          await api.post('/api/deals', {
            title: (o.offer_number || 'Offer') + ' — ' + (data.client_name || ''),
            company_id: data.company_id || null,
            stage: 'PROPOSAL',
            value_amount: +grand.toFixed(2),
            value_currency: data.currency || 'AZN',
            notes: t('offer_deal_auto_note').replace('{num}', o.offer_number || '')
          });
        } catch(de) { console.warn('Auto-deal creation failed:', de); }
      }
    }
    clearFormDirty();
    renderPage('offers');
  } catch(e) { showToast(esc(e.message), 'error'); }
  finally { if (btn) btn.disabled = false; }
}

function _renderAiMarkdown(text) {
  if (!text) return '<p style="color:#94a3b8;">—</p>';
  // Convert markdown to styled HTML
  let html = text
    // Headers: # → h2, ## → h3, ### → h4
    .replace(/^### (.+)$/gm, '<h4 style="font-size:13px;font-weight:700;color:#c4b5fd;margin:16px 0 6px 0;padding:0;">$1</h4>')
    .replace(/^## (.+)$/gm, '<h3 style="font-size:14px;font-weight:700;color:#a78bfa;margin:20px 0 8px 0;padding-bottom:4px;border-bottom:1px solid #312e81;">$1</h3>')
    .replace(/^# (.+)$/gm, '<h2 style="font-size:16px;font-weight:700;color:#e0e7ff;margin:0 0 12px 0;padding-bottom:6px;border-bottom:2px solid #4f46e5;">$1</h2>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#e2e8f0;">$1</strong>')
    // Numbered lists
    .replace(/^(\d+)\. (.+)$/gm, '<div style="display:flex;gap:8px;margin:6px 0 6px 4px;"><span style="color:#6366f1;font-weight:700;min-width:18px;">$1.</span><span>$2</span></div>')
    // Bullet points
    .replace(/^- (.+)$/gm, '<div style="display:flex;gap:8px;margin:5px 0 5px 4px;"><span style="color:#6366f1;">•</span><span>$1</span></div>')
    // Paragraphs (double newline)
    .replace(/\n\n/g, '</div><div style="margin-top:8px;">')
    // Single newlines that aren't already handled
    .replace(/\n/g, '<br>');
  return '<div style="font-size:13.5px;line-height:1.65;color:#cbd5e1;">' + html + '</div>';
}

async function runAiAnalysis(tabId, force) {
  tabId = tabId || 'analytics';
  // force=true means user clicked "Re-analyze" button; false/undefined = auto-load (show cache only)
  if (typeof force === 'undefined') force = true;
  const btn = document.getElementById('aiBtn_' + tabId);
  const loading = document.getElementById('aiLoading_' + tabId);
  const content = document.getElementById('aiContent_' + tabId);
  const empty = document.getElementById('aiEmpty_' + tabId);
  const textEl = document.getElementById('aiText_' + tabId);
  const thinkEl = document.getElementById('aiThinkBlock_' + tabId);
  const thinkText = document.getElementById('aiThinkText_' + tabId);
  const timeEl = document.getElementById('aiTime_' + tabId);

  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ ' + t('ai_wait'); }
  if (loading) loading.style.display = 'block';
  if (content) content.style.display = 'none';
  if (empty) empty.style.display = 'none';

  const lang = state.lang || 'ru';
  const startTime = Date.now();
  try {
    const r = await api.post('/api/cost-model/ai-analysis', { tab: tabId, lang: lang, force: !!force });
    const data = r.data || r;
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    if (textEl) textEl.innerHTML = _renderAiMarkdown(data.analysis);

    if (data.thinking && thinkEl) {
      thinkEl.style.display = 'block';
      if (thinkText) thinkText.textContent = data.thinking;
    } else if (thinkEl) {
      thinkEl.style.display = 'none';
    }

    if (timeEl) timeEl.innerHTML = (data.cached ? '📦 ' + t('ai_cached') + ' · ' : '🆕 ' + t('ai_new') + ' · ') + elapsed + ' sec';
    if (content) content.style.display = 'block';
    if (loading) loading.style.display = 'none';
  } catch(e) {
    if (loading) loading.style.display = 'none';
    if (empty) {
      empty.style.display = 'block';
      empty.innerHTML = '<span style="color:#f87171;">❌ ' + (e.message || 'API error') + '</span>';
    }
  }
  if (btn) { btn.disabled = false; btn.innerHTML = '🔄 ' + t('ai_reanalyze'); }
}

async function updateOverhead(id, field, value) {
  try {
    await api.put(`/api/cost-model/overhead/${id}`, {[field]: field === 'is_annual' || field === 'has_vat' ? parseInt(value) : parseFloat(value)});
    _costModelData = null;
    await renderCostModel(document.getElementById('app'));
  } catch(e) { showToast('Xəta: ' + e.message, 'error'); }
}

async function updateEmployee(id, field, value) {
  try {
    await api.put(`/api/cost-model/employees/${id}`, {[field]: value});
    _costModelData = null;
    await renderCostModel(document.getElementById('app'));
    _costModelTab = 'employees';
    _renderCostModelPage(document.getElementById('app'));
  } catch(e) { showToast('Xəta: ' + e.message, 'error'); }
}

async function deleteEmployee(id) {
  if (!confirm('Bu əməkdaşı silmək istəyirsiniz?')) return;
  try {
    await api.delete ? api.delete(`/api/cost-model/employees/${id}`) :
      fetch(`/api/cost-model/employees/${id}`, {method:'DELETE',headers:api._getHeaders()});
    _costModelData = null;
    await renderCostModel(document.getElementById('app'));
    _costModelTab = 'employees';
    _renderCostModelPage(document.getElementById('app'));
  } catch(e) { showToast('Xəta: ' + e.message, 'error'); }
}

async function saveCostParams() {
  const keys = ['total_users','total_employees','technical_staff','back_office_staff',
                 'vat_rate','employer_tax_rate','risk_rate','misc_expense_rate','fixed_overhead_ratio'];
  const body = {};
  // Handle manual toggle for total_users
  body['total_users_manual'] = 0;
  for (const k of keys) {
    const el = document.getElementById('param_' + k);
    if (el && !el.disabled) body[k] = parseFloat(el.value);
    else if (el && el.disabled && k !== 'total_users') body[k] = parseFloat(el.value);
  }
  // Validate fixed+variable = 1 implicitly (variable is computed)
  try {
    await api.put('/api/cost-model/parameters', body);
    showToast('Parametrlər saxlanıldı ✓', 'success');
    _costModelData = null;
    await renderCostModel(document.getElementById('app'));
    _costModelTab = 'settings';
    _renderCostModelPage(document.getElementById('app'));
  } catch(e) { showToast('Xəta: ' + e.message, 'error'); }
}

async function seedClientsFromCRM() {
  // CRM bazasındakı bütün client şirkətləri maya modelinə sinxronlayır
  // Heç bir Excel datası istifadə olunmur
  try {
    const companiesRes = await api.get('/api/companies');
    const allCompanies = companiesRes.data || companiesRes;
    const clients = allCompanies.filter(c => c.category === 'client');

    if (!confirm(`CRM bazadakı ${clients.length} müştəri maya modelinə əlavə olunsun?`)) return;

    const clientsData = clients.map(c => ({
      name: c.name,
      user_count: c.user_count || 0,
      services: {}
    }));

    const res = await api.post('/api/cost-model/seed-clients', {clients: clientsData});
    const r = res.created !== undefined ? res : res.data;
    showToast(`${r.created + r.updated} müştəri maya modelinə sinxronlandı ✓`, 'success');
    _costModelData = null;
    await renderCostModel(document.getElementById('app'));
    _costModelTab = 'analytics';
    _renderCostModelPage(document.getElementById('app'));
  } catch(e) {
    showToast('Xəta: ' + e.message, 'error');
  }
}

async function saveClientCostServices(companyId) {
  const allServices = ['permanent_it','infosec','erp','grc','projects','helpdesk'];
  const services = allServices.map(svc => ({
    service_type: svc,
    monthly_revenue: parseFloat(document.getElementById('svc_rev_' + svc)?.value || 0),
    is_active: document.getElementById('svc_active_' + svc)?.checked ? 1 : 0
  }));
  const cost_code = document.getElementById('clientCostCode')?.value || '';
  // user_count is saved separately via dedicated button to prevent accidental overwrites
  const payload = {services, cost_code};
  // Only include user_count if user explicitly changed it in this tab
  const ucInput = document.getElementById('clientUserCount');
  if (ucInput && ucInput.dataset.changed === 'true') {
    payload.user_count = parseInt(ucInput.value || 0);
  }
  try {
    await api.put(`/api/cost-model/client-services/${companyId}`, payload);
    showToast('Qiymətləndirmə məlumatları saxlanıldı ✓', 'success');
    _costModelData = null; // Invalidate cache
  } catch(e) {
    showToast('Xəta: ' + e.message, 'error');
  }
}

          var list = document.getElementById('tkCompanyList');
          if(list){ list.classList.remove('hidden'); e.target.select(); }
        }
      });

      // Input handler for search filtering

          var q = e.target.value.toLowerCase();
          var list = document.getElementById('tkCompanyList');
          if(!list) return;
          var items = list.querySelectorAll('li');
          items.forEach(function(li){
            li.style.display = li.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
          });
          list.classList.remove('hidden');
        }
      });

      // Click handler for selecting a company from the list
      document.addEventListener('click', function(e){
        var li = e.target && e.target.closest ? e.target.closest('#tkCompanyList li') : null;
        if(li){
          var hidden = document.getElementById('tkCompany');
          var search = document.getElementById('tkCompanySearch');
          var list = document.getElementById('tkCompanyList');
          var v = li.getAttribute('data-v');
          if(hidden) hidden.value = v || '';
          if(search) search.value = v ? li.textContent : '';
          if(list) list.classList.add('hidden');
          return;
        }
        // Close dropdown when clicking outside
        var wrap = document.getElementById('tkCompanyWrap');
        if(wrap && !wrap.contains(e.target)){
          var list = document.getElementById('tkCompanyList');
          var hidden = document.getElementById('tkCompany');
          var search = document.getElementById('tkCompanySearch');
          if(list) list.classList.add('hidden');
          if(hidden && search && !hidden.value) search.value = '';
        }
      });

  const condition = document.getElementById('srCondition').value;
  const value = document.getElementById('srValue').value;
  const points = parseInt(document.getElementById('srPoints').value) || 0;
  try {
    await api.post('/api/lead-scoring-rules', { field, condition, value, points });
    closeModal();
    showToast('Rule added', 'success');
    renderScoringRules(document.getElementById('app'));
  } catch(e) { showToast(e.message, 'error'); }
}

async function deleteScoringRule(id) {
  if (!await confirmDialog('Delete this rule?')) return;
  try {
    await api.delete('/api/lead-scoring-rules/' + id);
    showToast('Rule deleted', 'success');
    renderScoringRules(document.getElementById('app'));
  } catch(e) { showToast(e.message, 'error'); }
}

async function rescoreAllLeads() {
  try {
    const {data} = await api.post('/api/leads/rescore-all');
    showToast(`Rescored ${data.rescored} leads`, 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

</script>

</body>
