  .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; }

  .stage-LEAD { background: #374151; color: #9ca3af; }
  .stage-QUALIFIED { background: #1e3a5f; color: #60a5fa; }
  .stage-PROPOSAL { background: #3b2f63; color: #a78bfa; }
  .stage-NEGOTIATION { background: #4a3728; color: #fbbf24; }
  .stage-WON { background: #1a3a2a; color: #34d399; }
  .stage-LOST { background: #3b1c1c; color: #f87171; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .modal-content { background: #1e293b; border-radius: 16px; border: 1px solid #334155; max-width: 640px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 24px; }
  .modal-box { background: #1e293b; border-radius: 16px; border: 1px solid #334155; width: 90%; max-height: 85vh; overflow-y: auto; padding: 24px; }
  .input-field { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; padding: 8px 12px; width: 100%; font-size: 14px; }
  .input-field:focus { outline: none; border-color: #6366f1; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; border-bottom: 1px solid #334155; color: #94a3b8; font-size: 13px; }
  td { padding: 10px 12px; border-bottom: 1px solid #1e293b; }
  tr:hover td { background: rgba(99,102,241,0.05); }
  input, select, textarea { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; padding: 10px 14px; min-height: 42px; width: 100%; color-scheme: dark; box-sizing: border-box; }

  .btn { padding: 8px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; }
  .btn-primary { background: #6366f1; color: white; }
  .btn-primary:hover { background: #818cf8; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }
  .btn-danger { background: #7f1d1d; color: #fca5a5; }
  .btn-danger:hover { background: #991b1b; }
  .btn-sm { padding: 4px 10px; font-size: 13px; }
  .kanban-col { min-width: 240px; flex: 1; }
  .kanban-col[data-stage="WON"] .kanban-header { color: #22c55e; border-color: #22c55e; }
  .kanban-col[data-stage="LOST"] .kanban-header { color: #ef4444; border-color: #ef4444; }
  .kanban-col[data-stage="WON"] { background: rgba(34,197,94,0.05); border-radius: 8px; padding: 8px; }
  .kanban-col[data-stage="LOST"] { background: rgba(239,68,68,0.05); border-radius: 8px; padding: 8px; }
  .kanban-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: grab; }
  .kanban-card:hover { border-color: #6366f1; }
  .kanban-card .lost-reason { color: #f87171; font-size: 11px; margin-top: 4px; }
  .score-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .score-badge.score-high { background: #166534; color: #4ade80; }
  .score-badge.score-medium { background: #854d0e; color: #fbbf24; }
  .score-badge.score-low { background: #991b1b; color: #fca5a5; }
  .stat-card { text-align: center; }
  .stat-value { font-size: 2rem; font-weight: 700; color: #818cf8; }
  .stat-label { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
  .sync-pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; flex-direction: column-reverse; gap: 8px; }
  .toast { padding: 12px 20px; border-radius: 8px; font-size: 14px; animation: slideIn 0.3s ease; }
  .toast-success { background: #166534; color: #bbf7d0; }
  .toast-error { background: #7f1d1d; color: #fecaca; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .ctype-badge { padding: 3px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
  .ctype-service_agreement { background: #1e3a5f; color: #60a5fa; }
  .ctype-addendum { background: #3b2f63; color: #a78bfa; }
  .ctype-price_protocol { background: #4a3728; color: #fbbf24; }
  .ctype-project { background: #1a3a2a; color: #34d399; }
  .ctype-nda { background: #3b1c1c; color: #f87171; }
  .ctype-termination { background: #4a2020; color: #fca5a5; }
  .ctype-other { background: #374151; color: #9ca3af; }
  .ctype-admin { background: #4c1d95; color: #c4b5fd; }
  .ctype-manager { background: #1e3a5f; color: #60a5fa; }
  .ctype-viewer { background: #374151; color: #9ca3af; }
  .cstatus-active { color: #34d399; } .cstatus-signed { color: #60a5fa; }
  .cstatus-negotiation { color: #fbbf24; } .cstatus-terminated { color: #f87171; }
  .cstatus-expired { color: #f87171; } .cstatus-draft { color: #9ca3af; } .cstatus-unknown { color: #9ca3af; }
  .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
  .pagination .active-page { background: #6366f1; color: white; }
  .info-row { display: flex; gap: 4px; }
  .info-row .label { color: #64748b; min-width: 100px; }
  .search-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 12px; max-height: 420px; overflow-y: auto; z-index: 60; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .search-section { padding: 8px 0; }
  .search-section-title { padding: 4px 16px; font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
  .search-item { padding: 8px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .search-item:hover { background: rgba(99,102,241,0.1); }
  .notif-panel { position: absolute; top: 100%; right: 0; width: 380px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; max-height: 480px; overflow-y: auto; z-index: 60; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .notif-item { padding: 12px 16px; border-bottom: 1px solid #334155; cursor: pointer; }
  .notif-item:hover { background: rgba(99,102,241,0.05); }
  .notif-item:last-child { border-bottom: none; }
  .sev-high { border-left: 3px solid #ef4444; }
  .sev-medium { border-left: 3px solid #f59e0b; }
  .sev-low { border-left: 3px solid #6b7280; }
  .silent-badge { background: #7f1d1d; color: #fca5a5; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .alert-card { border-left: 3px solid #f59e0b; }
  .lang-dropdown { position: absolute; top: 100%; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 8px; min-width: 120px; z-index: 60; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
  .nav-dropdown { position: relative; display: inline-block; }
  .nav-dropdown-btn { cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .nav-dropdown-btn::after { content: '▾'; font-size: 10px; opacity: 0.7; }
  .nav-dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: #1e293b; border: 1px solid #334155; border-radius: 8px; min-width: 200px; z-index: 60; box-shadow: 0 10px 25px rgba(0,0,0,0.3); padding: 4px 0; }
  .nav-dropdown:hover .nav-dropdown-menu { display: block; }
  .nav-dropdown-menu a { display: block; padding: 8px 16px; color: #94a3b8; font-size: 13px; text-decoration: none; white-space: nowrap; }
  .nav-dropdown-menu a:hover { background: rgba(99,102,241,0.1); color: #e2e8f0; }
  .lang-option { padding: 8px 16px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .lang-option:hover { background: rgba(99,102,241,0.1); }
  .lang-option.active { background: rgba(99,102,241,0.2); color: #818cf8; font-weight: 600; }

  /* Required field markers */
  .required-mark::after { content: ' *'; color: #f87171; }

  /* Loading spinner */
  .spinner { border: 3px solid #334155; border-top: 3px solid #6366f1; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 40px auto; }

  /* Contact Page Tabs */
  .contact-tab-btn { cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .contact-tab-btn.active { color: #818cf8; border-bottom-color: #6366f1; }
  .contact-tab-content { display: block; }
  .contact-tab-content.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Focus visible outlines */
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }

  /* Mobile responsive navigation */
  .hamburger { display: none; cursor: pointer; background: none; border: none; color: #94a3b8; font-size: 24px; padding: 8px; }
  .nav-links { display: flex; gap: 1px; flex-shrink: 1; min-width: 0; }
  .nav-links a { white-space: nowrap; flex-shrink: 0; padding: 6px 8px !important; font-size: 13px !important; }

  /* Tablet */
  @media (max-width: 1024px) {
    .nav-links a { padding: 6px 6px !important; font-size: 12px !important; }
    .stat-cards, .grid-3, .grid-cols-3 { grid-template-columns: repeat(2, 1fr) !important; }
  }

  /* Mobile */
  @media (max-width: 768px) {
    .nav-links {
      display: none; flex-direction: column;
      position: absolute; top: 56px; left: 0; right: 0;
      background: #0f172a; border-bottom: 1px solid #334155;
      padding: 8px; z-index: 1000;
    }
    .nav-links.open { display: flex; }
    .nav-links a { padding: 10px 16px !important; font-size: 14px !important; border-bottom: 1px solid #1e293b; }
    .hamburger { display: block !important; }

    /* Tables — horizontal scroll */
    .table-responsive, .overflow-x-auto, table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { font-size: 12px; min-width: 600px; }
    th, td { padding: 6px 8px; }

    /* Stats */
    .stat-cards { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
    .stat-value { font-size: 1.3rem; }

    /* Kanban — horizontal scroll */
    .kanban-board { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap !important; }
    .kanban-col { min-width: 240px; flex-shrink: 0; }

    /* Cards */
    .grid-2, .grid-cols-2 { grid-template-columns: 1fr !important; }
    .grid-3, .grid-cols-3, .grid-4, .grid-cols-4, .grid-cols-6 { grid-template-columns: 1fr !important; }

    /* Modals — almost fullscreen */
    .modal-content { width: 95% !important; max-height: 90vh; overflow-y: auto; padding: 16px; }

    /* Charts */
    canvas { max-height: 250px !important; }

    /* Typography */
    h1 { font-size: 1.5rem !important; }
    h2 { font-size: 1.25rem !important; }

    /* Main container */
    #app { padding-left: 8px; padding-right: 8px; }

    /* Flex wrapping */
    .flex.gap-4, .flex.gap-3, .flex.gap-2 { flex-wrap: wrap; }

    /* Filters row */
    .filters-row, .flex.items-center.gap-2 { flex-wrap: wrap; gap: 6px; }
    .filters-row select, .filters-row input { min-width: 120px; flex: 1; }

    /* Hide less important table columns on mobile */
    .hide-mobile { display: none !important; }
  }

  /* Small mobile */
  @media (max-width: 480px) {
    .stat-cards { grid-template-columns: 1fr !important; }
    nav .text-xl { font-size: 1rem !important; }
    .btn { padding: 6px 12px; font-size: 13px; }
    .kanban-col { min-width: 200px; }
  }
</style>

// Translation function with support for variables
function t(key, vars = {}) {
  const lang = state.lang || 'en';
  const dict = translations[lang] || translations.en;
  let text = dict[key] || key;
  for (const [k, v] of Object.entries(vars)) {
    text = text.replace('{' + k + '}', v);
  }
  return text;
}

// ── Searchable Dropdown Component ───────────────────────────────
// Usage: createSearchableDropdown({id, items:[], value:'', placeholder:'', onChange:fn, containerStyle:''})
// Returns HTML string. Call initSearchableDropdown(id) after inserting into DOM.
function createSearchableDropdown(opts) {
  const {id, items=[], value='', placeholder='Axtar...', label='', required=false, containerStyle=''} = opts;
  const matched = value ? items.find(i => i === value) : null;
  return `
    <div class="searchable-dd" id="${id}_wrap" style="position:relative;${containerStyle}">
      ${label ? `<label class="text-xs text-gray-400 mb-1 block">${label}${required ? ' <span class="text-red-400">*</span>' : ''}</label>` : ''}
      <input type="text" id="${id}_input" class="input-field w-full" autocomplete="off"
        placeholder="${esc(placeholder)}"
        value="${esc(value)}"
        style="border-color:${matched ? '#22c55e' : (value ? '#f59e0b' : '#475569')}"
        onfocus="openSearchDD('${id}')"
        oninput="filterSearchDD('${id}', this.value)">
      <input type="hidden" id="${id}" value="${esc(value)}">
      <div id="${id}_list" class="searchable-dd-list" style="display:none;position:absolute;z-index:999;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:#1e293b;border:1px solid #475569;border-radius:0 0 8px 8px;box-shadow:0 8px 24px rgba(0,0,0,.5);">
        ${items.map(item => `
          <div class="searchable-dd-item" data-value="${esc(item)}"
            style="padding:6px 12px;cursor:pointer;font-size:13px;color:#e2e8f0;${item===value?'background:#312e81;color:#a5b4fc;':''}"
            onmousedown="selectSearchDD('${id}','${esc(item).replace(/'/g,"\\'")}')">
            ${esc(item)}
          </div>
        `).join('')}
      </div>
    </div>`;
}

function openSearchDD(id) {
  const list = document.getElementById(id + '_list');
  if (list) { list.style.display = 'block'; filterSearchDD(id, document.getElementById(id+'_input').value); }
  // Close on outside click
  setTimeout(() => {
    const handler = (e) => {
      const wrap = document.getElementById(id + '_wrap');
      if (wrap && !wrap.contains(e.target)) { closeSearchDD(id); document.removeEventListener('mousedown', handler); }
    };
    document.addEventListener('mousedown', handler);
  }, 50);
}

function closeSearchDD(id) {
  const list = document.getElementById(id + '_list');
  if (list) list.style.display = 'none';
  // Validate: if typed text doesn't match any item, clear hidden value
  const input = document.getElementById(id + '_input');
  const hidden = document.getElementById(id);
  if (input && hidden && hidden.value && input.value !== hidden.value) {
    // User typed something different — try to match
    const wrap = document.getElementById(id + '_wrap');
    const items = wrap ? Array.from(wrap.querySelectorAll('.searchable-dd-item')).map(el => el.getAttribute('data-value')) : [];
    const match = items.find(i => i.toLowerCase() === input.value.toLowerCase());
    if (match) { hidden.value = match; input.value = match; input.style.borderColor = '#22c55e'; }
    else if (!input.value.trim()) { hidden.value = ''; input.style.borderColor = '#475569'; }
    else { input.style.borderColor = '#ef4444'; }
  }
}

function filterSearchDD(id, query) {
  const list = document.getElementById(id + '_list');
  if (!list) return;
  const q = (query || '').toLowerCase();
  const items = list.querySelectorAll('.searchable-dd-item');
  let visible = 0;
  items.forEach(el => {
    const val = el.getAttribute('data-value').toLowerCase();
    const show = !q || val.includes(q);
    el.style.display = show ? 'block' : 'none';
    if (show) { visible++; el.style.background = ''; el.style.color = '#e2e8f0'; }
  });
  // Highlight first visible
  const first = Array.from(items).find(el => el.style.display !== 'none');
  if (first) { first.style.background = '#312e81'; first.style.color = '#a5b4fc'; }
}

function selectSearchDD(id, value) {
  const input = document.getElementById(id + '_input');
  const hidden = document.getElementById(id);
  if (input) { input.value = value; input.style.borderColor = value ? '#22c55e' : '#475569'; }
  if (hidden) { hidden.value = value; }
  closeSearchDD(id);
  // Trigger custom event for onChange handlers
  const wrap = document.getElementById(id + '_wrap');
  if (wrap) wrap.dispatchEvent(new CustomEvent('dd-change', {detail: {value}}));
}
// Sanitize HTML before innerHTML assignment (DOMPurify safety net)
function safeHTML(el, html) {
  if (typeof DOMPurify !== 'undefined') {
    el.innerHTML = DOMPurify.sanitize(html, {
      ALLOWED_TAGS: ['div','span','p','a','b','strong','i','em','br','hr','h1','h2','h3','h4','h5','h6',
        'ul','ol','li','table','thead','tbody','tfoot','tr','th','td','img','svg','path','circle','rect',
        'line','polyline','polygon','g','defs','clipPath','use','text','tspan',
        'input','select','option','textarea','button','label','form','small','code','pre',
        'nav','header','footer','main','section','article','aside','details','summary','figure','figcaption',
        'mark','del','ins','sub','sup','blockquote','abbr','cite','dfn','kbd','samp','var'],
      ALLOWED_ATTR: ['class','id','style','href','src','alt','title','type','value','name','placeholder',
        'checked','selected','disabled','readonly','multiple','rows','cols','colspan','rowspan',
        'data-*','aria-*','role','tabindex','target','rel','width','height','viewBox','fill','stroke',
        'stroke-width','stroke-linecap','stroke-linejoin','d','cx','cy','r','x','y','x1','y1','x2','y2',
        'points','transform','xmlns','onclick','onchange','oninput','onsubmit','draggable','ondragstart',
        'ondragover','ondrop','ondragend'],
      ADD_ATTR: ['onclick','onchange','oninput','onsubmit','ondragstart','ondragover','ondrop','ondragend']
    });
  } else {
    el.innerHTML = html;
  }
}
// Escape string for safe embedding in JS onclick attributes (prevents XSS via backslash/quote injection)
function escJs(str) { if (!str) return ''; return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r'); }
// Escape string for CSS.escape-compatible attribute selector (fallback if CSS.escape unavailable)
function escSel(str) { return typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(str) : str.replace(/["\\]/g, '\\$&'); }
// Safe querySelector for data attributes with special chars
function qsAttr(attr, val) { try { return document.querySelector(`[${attr}="${escSel(val)}"]`); } catch(e) { return document.querySelector(`[${attr}]`) && Array.from(document.querySelectorAll(`[${attr}]`)).find(el => el.getAttribute(attr) === val); } }
function qsaAttr(attr, val) { try { return document.querySelectorAll(`[${attr}="${escSel(val)}"]`); } catch(e) { return Array.from(document.querySelectorAll(`[${attr}]`)).filter(el => el.getAttribute(attr) === val); } }
function formatCurrency(val) {
  if (!val) return '0 ₼';
  const formatted = new Intl.NumberFormat('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);
  return formatted + ' ₼';
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  try { return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000); } catch(e) { return null; }
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  try { return Math.floor((new Date(dateStr + 'T00:00:00Z').getTime() - Date.now()) / 86400000); } catch(e) { return null; }
}

// ─── API Client ──────────────────────────────────────────────
const api = {
  _getHeaders() {
    const headers = {'Content-Type':'application/json'};
    const token = localStorage.getItem('crm_token');
    if (token) {
      headers['Authorization'] = 'Bearer ' + token;
    }
    return headers;
  },
  async get(url) {
    const r = await fetch(url, {headers: this._getHeaders()});
    if (r.status === 401) { forceLogout(); throw new Error('Unauthorized'); }
    if (!r.ok) throw new Error(await this._parseError(r));
    const j = await r.json();
    return { data: j.data, total: j.total };
  },
  async post(url, d) {
    const isForm = d instanceof FormData;
    const headers = {};
    const token = localStorage.getItem('crm_token');
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (!isForm) headers['Content-Type'] = 'application/json';
    const r = await fetch(url, {method:'POST', headers, body: isForm ? d : JSON.stringify(d)});
    if (r.status === 401) { forceLogout(); throw new Error('Unauthorized'); }
    if (!r.ok) throw new Error(await this._parseError(r));
    return (await r.json()).data;
  },
  async put(url, d) {
    const r = await fetch(url, {method:'PUT', headers:this._getHeaders(), body:JSON.stringify(d)});
    if (r.status === 401) { forceLogout(); throw new Error('Unauthorized'); }
    if (!r.ok) throw new Error(await this._parseError(r));
    return (await r.json()).data;
  },
  async patch(url, d) {
    const r = await fetch(url, {method:'PATCH', headers:this._getHeaders(), body:JSON.stringify(d)});
    if (r.status === 401) { forceLogout(); throw new Error('Unauthorized'); }
    if (!r.ok) throw new Error(await this._parseError(r));
    return (await r.json()).data;
  },
  async remove(url) {
    const r = await fetch(url, {method:'DELETE', headers:this._getHeaders()});
    if (r.status === 401) { forceLogout(); throw new Error('Unauthorized'); }
    if (!r.ok) throw new Error(await this._parseError(r));
    return (await r.json()).data;
  },
  async _parseError(r) {
    try {
      const text = await r.text();
      const j = JSON.parse(text);
      const d = j.detail || j.message || j.error || text;
      return typeof d === 'string' ? d : Array.isArray(d) ? d.map(e => e.msg || JSON.stringify(e)).join('; ') : JSON.stringify(d);
    } catch(e) { return 'Server error (' + r.status + ')'; }
  }
};

async function login(email, password, totp_code) {
  try {
    const body = {email, password};
    if (totp_code) body.totp_code = totp_code;
    const result = await api.post('/api/auth/login', body);
    // Check if 2FA is required
    if (result.requires_2fa) {
      show2FALoginStep(email, password);
      return false;
    }
    state.token = result.token;
    state.user = result.user;
    localStorage.setItem('crm_token', state.token);
    showToast('Logged in successfully', 'success');
    await loadAllUsers();
    renderPage('dashboard');
    return true;
  } catch(e) {
    showToast(t('login_error'), 'error');
    return false;
  }
}

async function onChangePassword(event) {
  event.preventDefault();
  const old_password = document.getElementById('cpOld').value;
  const new_password = document.getElementById('cpNew').value;
  const confirm = document.getElementById('cpConfirm').value;
  if (new_password !== confirm) {
    showToast(t('change_pw_mismatch'), 'error');
    return;
  }
  try {
    await api.post('/api/auth/change-password', {old_password, new_password});

// Check authentication on page load
(function checkAuth() {
  const token = localStorage.getItem('crm_token');
  if (token) {
    state.token = token;
    // Try to load user info — use raw fetch to avoid api wrapper's 401→forceLogout
    try { const cu = localStorage.getItem("crm_user"); if (cu) state.user = JSON.parse(cu); } catch(e) {}
    fetch('/api/auth/me', {headers: {'Authorization':'Bearer ' + token}})
      .then(r => {
        if (!r.ok) throw new Error('Unauthorized');
        return r.json();
      })
      .then(j => {
        state.user = j.data;
        try { localStorage.setItem("crm_user", JSON.stringify(j.data)); } catch(e) {}
        try {
          loadAllUsers();
        } catch(e) {
          console.error('Failed to load users:', e);
        }
        document.querySelector('nav').style.display = 'block';
        navigate();
      })
      .catch(() => {
        localStorage.removeItem('crm_token');
        localStorage.removeItem("crm_user");
        state.token = null;
        state.user = null;
        renderLoginPage();
      });
  } else {
    renderLoginPage();
  }
})();

// ─── Pagination ─────────────────────────────────────────────
function renderPagination(total, currentPage, onPageFn) {
  const tp = Math.ceil(total / PAGE_SIZE);
  if (tp <= 1) return '';
  let b = `<button class="btn btn-sm btn-secondary" onclick="${onPageFn}(${currentPage-1})" ${currentPage===0?'disabled':''}>&laquo;</button>`;
  const s = Math.max(0, currentPage-2), e = Math.min(tp, s+5);
  for (let i=s;i<e;i++) b += `<button class="btn btn-sm ${i===currentPage?'active-page':'btn-secondary'}" onclick="${onPageFn}(${i})">${i+1}</button>`;
  b += `<button class="btn btn-sm btn-secondary" onclick="${onPageFn}(${currentPage+1})" ${currentPage>=tp-1?'disabled':''}>&raquo;</button>`;
  return `<div class="pagination">${b}<span class="text-slate-500 text-xs ml-2">${t('pagination_page')} ${currentPage+1} / ${tp} (${total} ${t('pagination_total')})</span></div>`;
}

// ─── Dashboard Task Toggle ──────────────────────────────────────
async function toggleDashTask(taskId, newStatus) {
  // Instantly update UI before API call
  var row = document.getElementById('dash-task-' + taskId);
  if (!row) return;
  var circle = row.querySelector('.dash-task-circle');
  var titleEl = row.querySelector('.dash-task-title');
  var becomingDone = (newStatus === 'done');

  if (circle) {
    circle.style.background = becomingDone ? '#10b981' : 'transparent';
    circle.style.borderColor = becomingDone ? '#10b981' : '#334155';
    circle.innerHTML = becomingDone ? '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2" fill="none"/></svg>' : '';
    circle.setAttribute('onclick', "toggleDashTask(" + taskId + ",'" + (becomingDone ? 'todo' : 'done') + "')");
  }
  if (titleEl) {
    titleEl.style.color = becomingDone ? '#64748b' : '#e2e8f0';
    titleEl.style.textDecoration = becomingDone ? 'line-through' : 'none';
  }

  // API call in background
  try {
    var resp = await fetch('/api/tasks/' + taskId + '/status', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('crm_token') },
      body: JSON.stringify({ status: newStatus })
    });
    if (!resp.ok) {
      console.error('Toggle task failed:', resp.status);
      // Revert on error
      if (circle) {
        circle.style.background = becomingDone ? 'transparent' : '#10b981';
        circle.style.borderColor = becomingDone ? '#334155' : '#10b981';
        circle.innerHTML = becomingDone ? '' : '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2" fill="none"/></svg>';
        circle.setAttribute('onclick', "toggleDashTask(" + taskId + ",'" + newStatus + "')");
      }
      if (titleEl) {
        titleEl.style.color = becomingDone ? '#e2e8f0' : '#64748b';
        titleEl.style.textDecoration = becomingDone ? 'none' : 'line-through';
      }
    }
  } catch(e) {
    console.error('Toggle task error:', e);
  }
}

      api.get('/api/notifications?limit=5').catch(() => ({data:[]})),
      api.get('/api/deals?limit=5').catch(() => ({data:[]}))
    ]);

    const summary = summaryR.data || {};
    const ticketsStats = ticketsR.data || {};
    const activitiesRaw = activitiesR.data || [];

    const tasksRaw = tasksR.data || [];

    const deals_pipeline = summary.deals_active || 0;

    const companies_total = summary.clients_total || 0;
    const contacts_total = summary.contacts_total || 0;
    const open_tickets = ticketsStats.open || ticketsStats.total || 0;
    const deals_total = summary.deals_total || 0;
    const contracts_total = summary.contracts_total || 0;

    if (notifications.length === 0) {

function formatMoney(v) {
  if (typeof window._formatMoney === 'function') return window._formatMoney(v);
  if (v >= 1000000) return (v/1000000).toFixed(1) + 'M';
  if (v >= 1000) return (v/1000).toFixed(1) + 'K';
  return v.toFixed(0);
}

// ─── Sorting System ──────────────────────────────────────────
let contactsSort = 'name_asc';
let companiesSort = 'name_asc';
let contractsSort = 'date_newest';

function sortData(arr, sortKey) {
  const sorted = [...arr];
  const cmp = (a, b, field, dir) => {
    let va = a[field], vb = b[field];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  };
  switch(sortKey) {
    case 'name_asc': return sorted.sort((a,b) => cmp(a,b,'name','asc') || cmp(a,b,'email','asc'));
    case 'name_desc': return sorted.sort((a,b) => cmp(a,b,'name','desc') || cmp(a,b,'email','desc'));
    case 'email_asc': return sorted.sort((a,b) => cmp(a,b,'email','asc'));
    case 'email_desc': return sorted.sort((a,b) => cmp(a,b,'email','desc'));
    case 'company_asc': return sorted.sort((a,b) => cmp(a,b,'company_name','asc') || cmp(a,b,'name','asc'));
    case 'emails_desc': return sorted.sort((a,b) => (b.activity_count||0) - (a.activity_count||0));
    case 'emails_asc': return sorted.sort((a,b) => (a.activity_count||0) - (b.activity_count||0));
    case 'last_recent': return sorted.sort((a,b) => cmp(a,b,a.last_contact!==undefined?'last_contact':'last_activity','desc'));
    case 'last_oldest': return sorted.sort((a,b) => cmp(a,b,a.last_contact!==undefined?'last_contact':'last_activity','asc'));
    case 'contacts_desc': return sorted.sort((a,b) => (b.contacts_count||0) - (a.contacts_count||0));
    case 'contacts_asc': return sorted.sort((a,b) => (a.contacts_count||0) - (b.contacts_count||0));
    case 'contracts_desc': return sorted.sort((a,b) => (b.contracts_count||0) - (a.contracts_count||0));
    case 'cname_asc': return sorted.sort((a,b) => cmp(a,b,'contract_name','asc'));
    case 'cname_desc': return sorted.sort((a,b) => cmp(a,b,'contract_name','desc'));
    case 'date_newest': return sorted.sort((a,b) => cmp(a,b,'id','desc'));
    case 'date_oldest': return sorted.sort((a,b) => cmp(a,b,'id','asc'));
    case 'value_desc': return sorted.sort((a,b) => (parseFloat(b.amount||b.value_amount||0)) - (parseFloat(a.amount||a.value_amount||0)));
    case 'value_asc': return sorted.sort((a,b) => (parseFloat(a.amount||a.value_amount||0)) - (parseFloat(b.amount||b.value_amount||0)));
    case 'end_soon': return sorted.sort((a,b) => { const ea = a.end_date||'9999'; const eb = b.end_date||'9999'; return ea < eb ? -1 : ea > eb ? 1 : 0; });
    default: return sorted;
  }
}

let _ctcSearchTimer = null;
function onContactsSearch(q) {
  state.searchQuery = q; state.contactsPage = 0;

}

async function saveActivity(contactId, actType) {
  var subject = (document.getElementById('act-subject').value || '').trim();
  var notes = (document.getElementById('act-notes').value || '').trim();
  var dateVal = document.getElementById('act-date').value;
  var timeVal = document.getElementById('act-time').value;

  if (!subject) {
    var el = document.getElementById('act-subject');
    el.style.borderColor = '#ef4444';
    el.placeholder = 'Укажите тему!';
    el.focus();
    return;
  }

  var timestamp = dateVal + 'T' + timeVal + ':00';
  var btn = document.getElementById('act-save-btn');
  if (btn) { btn.innerHTML = '⏳ Сохранение...'; btn.style.opacity = '0.6'; btn.disabled = true; }

  try {
    await api.post('/api/activities', {
      contact_id: contactId,
      activity_type: actType,
      subject: subject,
      notes: notes,
      timestamp: timestamp
    });
    // Close modal
    var modal = document.getElementById('activity-modal');
    if (modal) modal.remove();
    // Refresh contact page
    var app = document.getElementById('app');
    if (app) renderContactPage(app, contactId);
  } catch(e) {
    if (btn) { btn.innerHTML = '❌ Ошибка'; btn.style.opacity = '1'; btn.disabled = false; }
    alert('Ошибка: ' + e.message);
  }
}

async function saveContact(e, id) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"], .btn-primary');
  const form = new FormData(e.target);
  const data = Object.fromEntries(form);
  if (btn) btn.disabled = true;
  try {
    if (id === null) {
      await api.post('/api/contacts', data);
      showToast(t('contact_created'), 'success');
    } else {
      await api.put('/api/contacts/' + id, data);
      showToast(t('contact_updated'), 'success');
    }
    clearFormDirty();
    closeModal();
    renderPage('contacts');
  } catch(e) { showToast(esc(e.message), 'error'); }
  finally { if (btn) btn.disabled = false; }
}

async function deleteContact(id) {
  if (!await confirmDialog(t('contact_delete_confirm'))) return;
  try {
    await api.remove('/api/contacts/' + id);
    showToast(t('contact_deleted'), 'success');
    closeModal();
    renderPage('contacts');
  } catch(e) { showToast(esc(e.message), 'error'); }
}

// ─── Lead helper functions ──────────────────────────────────
function _leadStatusBadge(s) {
  const colors = {new:'bg-blue-600',contacted:'bg-purple-600',qualified:'bg-amber-600',unqualified:'bg-red-700',converted:'bg-green-600'};
  return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${colors[s]||'bg-slate-600'}">${t('lead_status_'+s)}</span>`;
}
function _leadPriorityBadge(p) {
  const colors = {low:'text-slate-400',medium:'text-blue-400',high:'text-orange-400'};
  return `<span class="text-xs font-medium ${colors[p]||''}">${t('lead_priority_'+(p||'medium'))}</span>`;
}
function _leadSourceLabel(s) {
  return t('lead_source_'+(s||'other'));
}

function _leadTempBadge(score) {
  if (!score) return '';
  if (score >= 61) return `<span style="background:#7f1d1d;color:#fca5a5;padding:1px 6px;border-radius:9999px;font-size:10px;font-weight:700">🔥 HOT</span>`;
  if (score >= 31) return `<span style="background:#78350f;color:#fcd34d;padding:1px 6px;border-radius:9999px;font-size:10px;font-weight:700">🌡️ WARM</span>`;
  return `<span style="background:#1e3a5f;color:#93c5fd;padding:1px 6px;border-radius:9999px;font-size:10px;font-weight:700">❄️ COLD</span>`;
}

function _companyTempScore(item) {
  // Calculate temperature score for companies based on activity data
  let score = 0;
  const actCount = item.activityCount || 0;
  const lastAct = item.lastActivity;
  // Activity count: +10 per activity, max 40
  score += Math.min(actCount * 10, 40);
  // Has contracts: +15
  if (item.contracts_count > 0) score += 15;
  // Has contacts: +5 per 10 contacts, max 15
  score += Math.min(Math.floor((item.contacts_count || 0) / 10) * 5, 15);
  // Recent activity bonus
  if (lastAct) {
    const daysSince = Math.floor((Date.now() - new Date(lastAct).getTime()) / 86400000);
    if (daysSince <= 7) score += 20;
    else if (daysSince <= 30) score += 10;
    else if (daysSince > 90) score -= 10;
  }
  // Has cost data (revenue): +10
  if (item.costData) score += 10;
  return Math.max(0, Math.min(100, score));
}

async function renderCompanyList(el, mode) {

    // ─── UNIFIED LEADS PIPELINE VIEW ───

    const [{data:companies}, costRes, {data:leadsRes}, {data:leadStats}, {data:actCounts}] = await Promise.all([
      api.get(`/api/companies?limit=500&q=`+encodeURIComponent(state.companiesQuery)),
      api.get('/api/cost-model/client-costs').catch(()=>({data:{clients:{}}})),
      api.get('/api/leads?limit=500'),
      api.get('/api/leads/stats').catch(()=>({data:{total:0,new:0,contacted:0,qualified:0,unqualified:0,converted:0}})),
      api.get('/api/activities/company-counts').catch(()=>({data:{}})),
    ]);
    const costMap = costRes.data?.clients || {};
    const activityCounts = actCounts || {};
    const leads = leadsRes.leads || [];
    const clients = companies.filter(c => c.category === 'client');
    const prospects = companies.filter(c => c.category === 'prospect');
    const inactive = companies.filter(c => c.category === 'inactive');

    // Build unified list: prospects + leads (new/contacted/qualified/unqualified) + converted (clients) + inactive
    let allItems = [];
    // Prospect companies → shown as "new" leads
    prospects.forEach(c => {
      const ac = activityCounts[c.id] || {};
      allItems.push({ type:'lead', id:'c_'+c.id, companyId:c.id, name:c.cost_code||c.name, status:'new', contact:'', email:'', phone:'', priority:'medium', source:'', value:0, users:c.user_count||0, notes:c.notes||'', created_at:c.created_at, isProspectCompany:true, domain:c.domain, group:c.group_name, contacts_count:c.contacts_count, activityCount:ac.count||0, lastActivity:ac.last_activity||null });
    });
    // Leads from leads table (not converted)
    leads.filter(l => l.status !== 'converted').forEach(l => {
      allItems.push({ type:'lead', id:l.id, name:l.company_name, status:l.status, contact:l.contact_name, email:l.email, phone:l.phone, priority:l.priority, source:l.source, value:l.estimated_value, users:l.estimated_users, notes:l.notes, created_at:l.created_at, score:l.score||0 });
    });
    // Converted = active clients
    clients.forEach(c => {
      const ac = activityCounts[c.id] || {};
      allItems.push({ type:'company', id:c.id, name:c.cost_code||c.name, status:'converted', domain:c.domain, group:c.group_name, contacts_count:c.contacts_count, contracts_count:c.contracts_count, user_count:c.user_count, has_contracts:c.has_contracts, costData:costMap[c.id], activityCount:ac.count||0, lastActivity:ac.last_activity||null });
    });
    // Inactive
    inactive.forEach(c => {
      const ac = activityCounts[c.id] || {};
      allItems.push({ type:'company', id:c.id, name:c.cost_code||c.name, status:'inactive', domain:c.domain, group:c.group_name, contacts_count:c.contacts_count, contracts_count:c.contracts_count, activityCount:ac.count||0, lastActivity:ac.last_activity||null });
    });

    // Save for incremental search updates
    window._lastCompanyItems = allItems;

    // Counts
    const counts = {
      all: allItems.length,
      new: prospects.length + leads.filter(l=>l.status==='new').length,
      contacted: leads.filter(l=>l.status==='contacted').length,
      qualified: leads.filter(l=>l.status==='qualified').length,
      converted: clients.length,
      unqualified: leads.filter(l=>l.status==='unqualified').length,
      inactive: inactive.length
    };

    // Filter
    let filtered = allItems;
    if (_lf !== 'all') filtered = allItems.filter(i => i.status === _lf);

    // Search
    if (state.companiesQuery) {
      const sq = state.companiesQuery.toLowerCase();

    const clickFn = item.isProspectCompany ? `showCompanyDetail(${item.companyId})` : `openLeadDetail(${item.id})`;
    return `<div class="card p-5 cursor-pointer hover:border-yellow-500/50 transition" onclick="${clickFn}">
      <div class="flex items-start justify-between mb-2">
        <h3 class="font-semibold text-lg">${esc(item.name)}</h3>

      </div>
      ${item.contact ? `<p class="text-slate-400 text-sm">${esc(item.contact)}</p>` : ''}

      <div class="flex gap-2 mt-2 items-center">${pBadge} ${item.source ? '<span class="text-xs text-slate-500">'+_leadSourceLabel(item.source)+'</span>' : ''} ${_leadTempBadge(item.score)} ${item.score>0 ? '<span class="score-badge '+(item.score>=61?'score-high':item.score>=31?'score-medium':'score-low')+'">'+item.score+'</span>' : ''}</div>
      <div class="flex justify-between mt-3 text-sm text-slate-400">
        ${item.value ? '<span style="color:#fcd34d">~'+item.value.toLocaleString()+' ₼</span>' : '<span>—</span>'}
        ${item.users ? '<span>&#128100; '+item.users+' ist.</span>' : ''}
      </div>
      ${item.isProspectCompany ? '<div class="flex items-center gap-2 mt-2 text-xs">'
        + (()=>{ const cs = _companyTempScore(item); return cs > 0 ? _leadTempBadge(cs) + ' <span class="score-badge '+(cs>=61?'score-high':cs>=31?'score-medium':'score-low')+'">'+cs+'</span>' : ''; })()
        + (item.activityCount > 0 ? '<span style="background:rgba(99,102,241,0.2);color:#a5b4fc;padding:2px 8px;border-radius:6px;font-weight:600;">📋 '+item.activityCount+'</span>' : '')
        + '</div>' : ''}
    </div>`;
  } else {

      ? '<span style="background:#14532d;color:#4ade80;padding:1px 8px;border-radius:9999px;font-size:10px;font-weight:600">'+t('lead_status_converted')+'</span>'

      <div class="flex items-start justify-between mb-2">
        <h3 class="font-semibold text-lg">${esc(item.name)}</h3>

        <p class="text-indigo-400 text-sm">${esc(item.domain||'')||'—'}</p>
        ${item.group ? '<span style="background:#312e81;color:#a5b4fc;padding:1px 7px;border-radius:9999px;font-size:10px;font-weight:500;">'+esc(item.group)+'</span>' : ''}
      </div>
      <div class="flex justify-between mt-3 text-sm text-slate-400">
        <span>${item.contacts_count||0} ${t('companies_contacts')}</span>
        <span>${item.contracts_count ? '<span style="color:#34d399;font-weight:600">'+item.contracts_count+' '+t('companies_contracts_cnt')+'</span>' : '<span style="color:#64748b">'+t('company_no_contract')+'</span>'}</span>
      </div>
      <div class="flex items-center gap-2 mt-2 text-xs">
        ${(()=>{ const cs = _companyTempScore(item); return cs > 0 ? _leadTempBadge(cs) + ' <span class="score-badge '+(cs>=61?'score-high':cs>=31?'score-medium':'score-low')+'">'+cs+'</span>' : ''; })()}

      ${item.status==='converted' ? `<div class="mt-2 text-xs flex gap-2 flex-wrap" style="color:#818cf8">
        <span style="background:#312e81;padding:1px 7px;border-radius:4px;">&#128100; ${item.user_count||0} ist.</span>

}
let _compSearchTimer = null;
function onCompaniesSearch(q) {
  state.companiesQuery = q;
  clearTimeout(_compSearchTimer);
  _compSearchTimer = setTimeout(() => {
    // Only update the cards grid, not the whole page (prevents flicker)
    const grid = document.getElementById('companyCardsGrid');
    const el = document.getElementById('app');
    if (grid && el) {
      // Re-filter and re-render only the cards
      _updateCompanyGrid(grid);
    } else {
      renderPage(state.page);
    }
  }, 300);
}
function _updateCompanyGrid(grid) {
  // Get current page mode
  const mode = state.page === 'partners' ? 'partner' : 'client';
  const allItems = window._lastCompanyItems || [];
  let filtered = allItems;
  const _lf = window._leadsFilter || 'converted';
  if (_lf !== 'all') filtered = filtered.filter(i => i.status === _lf);
  if (state.companiesQuery) {
    const sq = state.companiesQuery.toLowerCase();
    filtered = filtered.filter(i => (i.name||'').toLowerCase().includes(sq) || (i.email||'').toLowerCase().includes(sq) || (i.domain||'').toLowerCase().includes(sq) || (i.contact||'').toLowerCase().includes(sq));
  }
  // Update count in header
  const h1 = document.querySelector('h1');
  if (h1) {
    const span = h1.querySelector('span');
    if (span) span.textContent = `(${filtered.length})`;
  }
  // Re-render only the grid content
  grid.innerHTML = filtered.length === 0
    ? `<div class="col-span-full text-center text-slate-500 py-8">${t('nothing_found')}</div>`
    : filtered.map(item => _renderCompanyCard(item, mode)).join('');
}
function filterCompanyContract(val) { companiesContractFilter = val; renderPage(state.page); }

async function showCompanyContracts(companyId) {

window._taskView = window._taskView || 'list';
window._taskFilter = window._taskFilter || 'all';
window._taskCalMonth = window._taskCalMonth || new Date().getMonth();
window._taskCalYear = window._taskCalYear || new Date().getFullYear();
window._taskDetailCache = {};

async function renderTasks(el) {
  try {
    const [statsRes, tasksRes] = await Promise.all([
      api.get('/api/tasks/stats'),
      api.get('/api/tasks')
    ]);
    const stats = statsRes.data || statsRes;
    const tasksRaw = tasksRes.data || tasksRes;
    const tasks = Array.isArray(tasksRaw) ? tasksRaw : (tasksRaw.tasks || tasksRaw.items || []);

    const statCards = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="card p-4 stat-card cursor-pointer" onclick="filterTasks('all')">
          <div class="stat-value">${stats.total||0}</div><div class="stat-label">${t('task_all')}</div></div>
        <div class="card p-4 stat-card cursor-pointer" onclick="filterTasks('overdue')" style="border-left:3px solid #ef4444">
          <div class="stat-value text-red-400">${stats.overdue||0}</div><div class="stat-label">${t('task_overdue')}</div></div>
        <div class="card p-4 stat-card cursor-pointer" onclick="filterTasks('due_today')" style="border-left:3px solid #f59e0b">
          <div class="stat-value text-amber-400">${stats.due_today||0}</div><div class="stat-label">${t('task_due_today')}</div></div>
        <div class="card p-4 stat-card cursor-pointer" onclick="filterTasks('due_week')" style="border-left:3px solid #3b82f6">
          <div class="stat-value text-blue-400">${stats.due_week||0}</div><div class="stat-label">${t('task_due_week')}</div></div>
      </div>`;

    const viewToggle = `
      <div class="flex gap-2">
        <button class="btn btn-sm ${window._taskView==='list'?'bg-indigo-600':'btn-secondary'}" onclick="window._taskView='list';renderTasks(document.getElementById('app'))">${t('task_view_list')}</button>
        <button class="btn btn-sm ${window._taskView==='calendar'?'bg-indigo-600':'btn-secondary'}" onclick="window._taskView='calendar';renderTasks(document.getElementById('app'))">${t('task_view_calendar')}</button>
      </div>`;

    el.innerHTML = `
      <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
        <h1 class="text-2xl font-bold">${t('tasks_title')}</h1>
        <div class="flex gap-2 items-center">
          ${viewToggle}
          <button class="btn btn-secondary text-sm" onclick="openCalendarIntegration()" title="${t('cal_integration')}">📅 ${t('cal_connect')}</button>
          <button class="btn bg-indigo-600 hover:bg-indigo-700 text-sm" onclick="openTaskModal()">${t('tasks_new')}</button>
        </div>
      </div>
      ${statCards}
      <div id="tasksContent"></div>`;

    if (window._taskView === 'calendar') {
      await renderTasksCalendar(document.getElementById('tasksContent'));
    } else {
      renderTasksList(document.getElementById('tasksContent'), tasks);
    }
  } catch(e) { el.innerHTML = `<div class="card p-6 text-red-400">${esc(e.message)}</div>`; }
}

function renderTasksList(el, tasks) {
  const filter = window._taskFilter || 'all';
  let filtered = tasks;
  const today = new Date().toISOString().slice(0,10);
  if (filter === 'overdue') filtered = tasks.filter(t => t.status !== 'done' && t.status !== 'cancelled' && t.due_date && t.due_date < today);
  else if (filter === 'due_today') filtered = tasks.filter(t => t.due_date === today);
  else if (filter === 'due_week') {
    const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate()+7);
    const we = weekEnd.toISOString().slice(0,10);
    filtered = tasks.filter(t => t.due_date && t.due_date >= today && t.due_date <= we);
  }
  else if (filter === 'todo') filtered = tasks.filter(t => t.status === 'todo');
  else if (filter === 'in_progress') filtered = tasks.filter(t => t.status === 'in_progress');
  else if (filter === 'done') filtered = tasks.filter(t => t.status === 'done');

  const filterBtns = ['all','todo','in_progress','done'].map(f =>
    `<button class="btn btn-sm ${filter===f?'bg-indigo-600':'btn-secondary'}" onclick="filterTasks('${f}')">${t('task_'+(f==='all'?'all':'status_'+f))}</button>`
  ).join('');

  if (!filtered.length) {
    el.innerHTML = `<div class="flex gap-2 mb-4">${filterBtns}</div><div class="card p-8 text-center text-slate-400">${t('task_no_tasks')}</div>`;
    return;
  }

  const rows = filtered.map(tk => {
    window._taskDetailCache[tk.id] = tk;
    const isDone = tk.status === 'done';
    const isOverdue = !isDone && tk.status !== 'cancelled' && tk.due_date && tk.due_date < today;
    return `<tr class="border-b border-slate-700/50 hover:bg-slate-800/30 ${isDone?'opacity-60':''}">
      <td class="px-3 py-2"><input type="checkbox" ${isDone?'checked':''} onchange="quickToggleTask(${tk.id}, this.checked)"></td>
      <td class="px-3 py-2 cursor-pointer" onclick="openTaskDetail(${tk.id})">
        <div class="${isDone?'line-through text-slate-500':''}">${esc(tk.title)}</div>
        ${tk.company_name?'<div class="text-xs text-slate-400">'+esc(tk.company_name)+'</div>':''}
      </td>
      <td class="px-3 py-2">${_taskStatusBadge(tk.status)}</td>
      <td class="px-3 py-2">${_taskPriorityBadge(tk.priority)}</td>
      <td class="px-3 py-2 text-sm ${isOverdue?'text-red-400 font-bold':''}">${tk.due_date||'—'}</td>
      <td class="px-3 py-2 text-sm">${_taskCatIcon(tk.category)}</td>
    </tr>`;
  }).join('');

async function renderTasksCalendar(el) {
  const m = window._taskCalMonth, y = window._taskCalYear;
  try {
    const res = await api.get(`/api/tasks/calendar?month=${m+1}&year=${y}`);
    const calRaw = res.data || res;
    // API returns {tasks:[...]} — group by date for calendar view
    const calData = {};
    const calTasks = Array.isArray(calRaw) ? calRaw : (calRaw.tasks || []);
    calTasks.forEach(tk => { if(tk.due_date){(calData[tk.due_date]=calData[tk.due_date]||[]).push(tk);} });
    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const today = new Date().toISOString().slice(0,10);

    let cells = '';
    for (let i=0; i<firstDay; i++) cells += '<div class="p-1 min-h-[80px]"></div>';
    for (let d=1; d<=daysInMonth; d++) {
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayTasks = calData[dateStr] || [];
      const isToday = dateStr === today;
      const dots = dayTasks.slice(0,3).map(tk =>
        `<div class="text-xs truncate px-1 rounded ${tk.status==='done'?'bg-green-900/40 text-green-400':tk.priority==='high'||tk.priority==='urgent'?'bg-red-900/40 text-red-400':'bg-slate-700 text-slate-300'} cursor-pointer" onclick="openTaskDetail(${tk.id})">${esc(tk.title)}</div>`
      ).join('');
      const more = dayTasks.length > 3 ? `<div class="text-xs text-slate-500">+${dayTasks.length-3}</div>` : '';
      cells += `<div class="p-1 min-h-[80px] border border-slate-700/30 rounded ${isToday?'bg-indigo-900/20 border-indigo-500/50':''}">
        <div class="text-xs font-bold ${isToday?'text-indigo-400':'text-slate-400'} mb-1">${d}</div>
        <div class="space-y-0.5">${dots}${more}</div>
      </div>`;
    }

    el.innerHTML = `
      <div class="flex items-center justify-between mb-4">
        <button class="btn btn-sm btn-secondary" onclick="window._taskCalMonth--;if(window._taskCalMonth<0){window._taskCalMonth=11;window._taskCalYear--;}renderTasks(document.getElementById('app'))">&laquo;</button>
        <span class="text-lg font-bold">${monthNames[m]} ${y}</span>
        <button class="btn btn-sm btn-secondary" onclick="window._taskCalMonth++;if(window._taskCalMonth>11){window._taskCalMonth=0;window._taskCalYear++;}renderTasks(document.getElementById('app'))">&raquo;</button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="grid grid-cols-7 gap-1">${cells}</div>`;
  } catch(e) { el.innerHTML = `<div class="text-red-400">${esc(e.message)}</div>`; }}

let _savingTask = false;
async function saveTask(taskId) {
  if (_savingTask) return;
  const body = {    title: document.getElementById('tkTitle').value.trim(),
    description: document.getElementById('tkDesc').value.trim(),
    status: document.getElementById('tkStatus').value,
    priority: document.getElementById('tkPriority').value,
    due_date: document.getElementById('tkDueDate').value || null,
    due_time: document.getElementById('tkDueTime').value || null,
    category: document.getElementById('tkCategory').value,
    company_id: document.getElementById('tkCompany').value ? parseInt(document.getElementById('tkCompany').value) : null
  };
  if (!body.title) { showToast(t('task_title')+' required','error'); return; }
  _savingTask = true;
  // Close modal immediately for snappy UX
  document.querySelector('.modal-overlay')?.remove();
  try {
    if (taskId) await api.put(`/api/tasks/${taskId}`, body);
    else await api.post('/api/tasks', body);
    showToast(taskId ? t('toast_user_updated') : t('toast_user_created'));
    renderTasks(document.getElementById('app'));
  } catch(e) { showToast(esc(e.message),'error'); }
  _savingTask = false;
}

function copyCalLink() {
  const input = document.getElementById('calFeedUrl');
  if (!input) return;
  const text = input.value;
  // Try modern clipboard API first (requires HTTPS)
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast(t('cal_copied'))).catch(() => _fallbackCopy(input));
  } else {
    _fallbackCopy(input);
  }
}
function _fallbackCopy(input) {
  // Fallback for HTTP: use textarea + execCommand
  const ta = document.createElement('textarea');
  ta.value = input.value;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); showToast(t('cal_copied')); }
  catch(e) { showToast('Скопируйте вручную: Ctrl+C', 'warning'); }
  document.body.removeChild(ta);
}

function confirmLostDeal(dealId) {
  const selected = document.querySelector('input[name="lost_reason"]:checked');
  if (!selected) { showToast('Please select a reason', 'error'); return; }
  const reason = selected.value;
  const note = document.getElementById('lostReasonNote')?.value || '';
  const lost_reason = note ? `${reason}: ${note}` : reason;
  api.patch(`/api/deals/${dealId}/stage`, { stage: 'LOST', lost_reason }).then(() => {
    closeModal();
    showToast(t('toast_moved'), 'success');
    renderPage('deals');
  }).catch(e => showToast(esc(e.message), 'error'));
}

async function deleteDeal(id) {

function moveDeal(id, stage) {

    showLostReasonModal(id);
    return;

  api.patch(`/api/deals/${id}/stage`, { stage }).then(() => {
    showToast(t('toast_moved'), 'success');
    closeModal();
    renderPage('deals');
  }).catch(e => showToast(esc(e.message), 'error'));
}

async function saveDeal(e, id) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"], .btn-primary');
  const form = new FormData(e.target);
  const data = Object.fromEntries(form);
  if (btn) btn.disabled = true;
  try {
    if (id === null) {
      await api.post('/api/deals', data);
      showToast(t('deal_created'), 'success');
    } else {
      await api.put('/api/deals/' + id, data);
      showToast(t('toast_moved'), 'success');
    }
    clearFormDirty();
    closeModal();
    renderPage('deals');
  } catch(e) { showToast(esc(e.message), 'error'); }
  finally { if (btn) btn.disabled = false; }
}

async function saveUser(event, userId) {
  event.preventDefault();
  try {
    const data = {
      full_name: document.getElementById('formFullName').value,
      role: document.getElementById('formRole').value
    };

    if (userId) {
      const pwd = document.getElementById('formPassword').value;
      if (pwd) data.password = pwd;
      await api.put(`/api/users/${userId}`, data);
    } else {
      data.email = document.getElementById('formEmail').value;
      data.password = document.getElementById('formPassword').value;
      await api.post('/api/users', data);
    }
    clearFormDirty();
    closeModal();
    await loadAllUsers();
    renderUsers(document.getElementById('app'));
    showToast(userId ? t('toast_user_updated') : t('toast_user_created'), 'success');
  } catch(e) {
    showToast(esc(e.message), 'error');
  }
}

async function deleteUser(userId) {
  if (!await confirmDialog(t('confirm_delete'))) return;
  try {
    await api.remove(`/api/users/${userId}`);
    await loadAllUsers();
    renderUsers(document.getElementById('app'));
    showToast(t('toast_deleted'), 'success');
  } catch(e) {
    showToast(esc(e.message), 'error');
  }
}

async function renderPricing(el) {
  if (!_pricingData) {
    try {
      const r = await api.get('/api/pricing/data');
      _pricingData = r.data;
      // Initialize all service totals from qty * price (fix: JSON may have stale totals)
      Object.values(_pricingData).forEach(comp => {
        if (comp && comp.categories) {
          Object.values(comp.categories).forEach(cat => {
            if (cat && typeof cat === 'object' && Array.isArray(cat.services)) {
              cat.services.forEach(s => { s.total = (s.qty || 0) * (s.price || 0); });
              cat.total = cat.services.reduce((sum, s) => sum + (s.total || 0), 0);
            }
          });
          const compTotal = Object.values(comp.categories).reduce((s, v) => s + ((v !== null && typeof v === 'object') ? (v.total ?? 0) : (v || 0)), 0);
          comp.monthly = Math.round(compTotal * 100) / 100;
          comp.annual = Math.round(compTotal * 12 * 100) / 100;
        }
      });
    } catch(e) {
      el.innerHTML = `<div class="card p-6"><h2 class="text-red-400">${t('error_title')}</h2><p class="text-slate-400 mt-2">${esc(e.message)}</p></div>`;

function _restorePricingSliders() {
  const ga = document.getElementById('globalSlider');
  if (ga) ga.value = _pricingAdjustments.global || 0;
  const gv = document.getElementById('globalValue');
  if (gv) gv.textContent = (_pricingAdjustments.global || 0) + '%';
  Object.entries(_pricingAdjustments.groups).forEach(([g, v]) => {
    const s = document.querySelector(`[data-group="${g}"]`);
    if (s) s.value = v;
    const l = document.querySelector(`[data-group-value="${g}"]`);
    if (l) l.textContent = v + '%';
  });
  // Restore per-group dates
  if (_pricingAdjustments.group_dates) {
    Object.entries(_pricingAdjustments.group_dates).forEach(([g, d]) => {
      const di = document.querySelector(`[data-group-date="${g}"]`);
      if (di) di.value = d;
    });
  }
  // Restore per-category dates
  if (_pricingAdjustments.category_dates) {
    Object.entries(_pricingAdjustments.category_dates).forEach(([c, d]) => {
      const di = document.querySelector(`[data-cat-date="${c}"]`);
      if (di) di.value = d;
    });
  }
  // Restore per-company dates
  if (_pricingAdjustments.company_dates) {
    Object.entries(_pricingAdjustments.company_dates).forEach(([c, d]) => {
      const di = document.querySelector(`[data-comp-date="${c}"]`);
      if (di) di.value = d;
    });
  }
  Object.entries(_pricingAdjustments.categories).forEach(([c, v]) => {
    const s = document.querySelector(`[data-category="${c}"]`);
    if (s) s.value = v;
    const l = document.querySelector(`[data-cat-value="${c}"]`);
    if (l) l.textContent = v + '%';
  });
  Object.entries(_pricingAdjustments.companies).forEach(([name, v]) => {
    const s = document.querySelector(`[data-company="${name}"]`);
    if (s) s.value = v;
    const l = document.querySelector(`[data-comp-value="${name}"]`);
    if (l) l.textContent = v + '%';
  });
}

function filterCompanySliders(val) {
  const q = val.toLowerCase();
  document.querySelectorAll('.company-slider-item').forEach(el => {
    el.style.display = !q || el.dataset.cname.includes(q) ? '' : 'none';
  });
}

function updatePricingGroupDate(group, value) {

function onPricingFilterGroup(val) {
  _pricingFilterGroup = val;
  _pricingFilterCompany = ''; // reset company when group changes
  // Re-render to update company dropdown options
  renderPricing(document.getElementById('app'));
}

function onPricingFilterCompany(val) {
  _pricingFilterCompany = val;
}

function _getFilteredCompanies() {
  if (!_pricingData) return [];
  if (_pricingFilterCompany) return [_pricingFilterCompany];
  if (_pricingFilterGroup) {
    return Object.entries(_pricingData)
      .filter(([_, c]) => c.group === _pricingFilterGroup)
      .map(([name]) => name);
  }
  return Object.keys(_pricingData);
}

async function applyPricingChanges() {
  // Check if there are any adjustments
  const adj = _pricingAdjustments;
  const hasAny = (adj.global !== 0) ||
    Object.values(adj.groups).some(v => v !== 0) ||
    Object.values(adj.categories).some(v => v !== 0) ||
    Object.values(adj.companies).some(v => v !== 0);

  if (!hasAny) {
    showToast(t('pricing_no_adjustments'), 'error');
    return;
  }

  // Compute effective date from per-group/company dates or use today
  const _allDates = [
    ...Object.values(_pricingAdjustments.group_dates || {}),
    ...Object.values(_pricingAdjustments.category_dates || {}),
    ...Object.values(_pricingAdjustments.company_dates || {})
  ].filter(Boolean).sort();
  const _effectiveDate = _allDates.length ? _allDates[0] : new Date().toISOString().slice(0, 10);

  const companies = _getFilteredCompanies();
  const msg = t('pricing_apply_confirm')
    .replace('{count}', companies.length)
    .replace('{date}', _effectiveDate);

  if (!confirm(msg)) return;

  try {
    const res = await api.post('/api/price-changes/batch', {
      companies,
      adjustments: adj,
      effective_date: _effectiveDate,
      notes: `Pricing model adjustment: global=${adj.global}%, groups=${JSON.stringify(adj.groups)}, categories=${JSON.stringify(adj.categories)}, effective=${_effectiveDate}`
    });
    const count = res.created || res.data?.created || companies.length;
    showToast(t('pricing_apply_success').replace('{count}', count), 'success');
  } catch(e) {
    showToast('Error: ' + String(e), 'error');
  }
}

let _pricingChartTimer = null;

function updatePricingDisplay() {
  if (!_pricingData) return;
  const companies = Object.entries(_pricingData);
  let totalBase = 0;
  let totalNew = 0;
  const companyData = [];

  companies.forEach(([name, data]) => {
    let baseMonthly = 0;
    let newMonthly = 0;

    Object.entries(data.categories).forEach(([catName, baseValue]) => {
      const catTotal = (baseValue !== null && typeof baseValue === 'object') ? (baseValue.total ?? 0) : (baseValue || 0);
      baseMonthly += catTotal;
      const g = (1 + (_pricingAdjustments.global || 0) / 100);
      const gr = (1 + (_pricingAdjustments.groups[data.group] || 0) / 100);
      const cr = (1 + (_pricingAdjustments.categories[catName] || 0) / 100);
      const co = (1 + (_pricingAdjustments.companies[name] || 0) / 100);
      newMonthly += catTotal * g * gr * cr * co;
    });

    totalBase += baseMonthly;
    totalNew += newMonthly;
    companyData.push({
      name, baseMonthly, newMonthly,
      group: data.group,
      diff: newMonthly - baseMonthly,
      pct: baseMonthly > 0 ? ((newMonthly - baseMonthly) / baseMonthly * 100) : 0
    });
  });

  const impact = (totalNew - totalBase) * 12;
  const avgChange = totalBase > 0 ? ((totalNew - totalBase) / totalBase * 100) : 0;

  // Update KPI cards (with null checks)
  const baseEl = document.getElementById('baseRevenueCard');
  if (baseEl) baseEl.textContent = formatCurrency(totalBase);
  const newEl = document.getElementById('newRevenueCard');
  if (newEl) newEl.textContent = formatCurrency(totalNew);
  const impEl = document.getElementById('impactValue');
  if (impEl) impEl.textContent = formatCurrency(impact);
  const avgEl = document.getElementById('avgChangeValue');
  if (avgEl) avgEl.textContent = avgChange.toFixed(2) + '%';

  const impactCard = document.getElementById('impactCard');
  if (impactCard) {
    if (impact >= 0) {
      impactCard.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
      impactCard.style.borderColor = 'rgba(16, 185, 129, 0.3)';
    } else {
      impactCard.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
      impactCard.style.borderColor = 'rgba(239, 68, 68, 0.3)';
    }
  }

  // Update table immediately (fast)
  renderPricingTable(companyData);

  // Debounce chart updates (heavy operation)
  clearTimeout(_pricingChartTimer);
  _pricingChartTimer = setTimeout(() => {
    try { updatePricingCharts(companyData); } catch(e) { console.warn('Chart update error:', e); }
  }, 150);
}

function updatePricingCharts(companyData) {
  Object.values(_pricingCharts).forEach(chart => {
    if (chart && typeof chart.destroy === 'function') chart.destroy();
  });
  _pricingCharts = {};

  const groupData = {};
  companyData.forEach(c => {
    if (!groupData[c.group]) groupData[c.group] = { base: 0, new: 0 };
    groupData[c.group].base += c.baseMonthly;
    groupData[c.group].new += c.newMonthly;
  });

  const ctx1 = document.getElementById('revenueByGroupChart');
  if (ctx1) {
    _pricingCharts.byGroup = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: Object.keys(groupData),
        datasets: [
          { label: t('pricing_base'), data: Object.values(groupData).map(d => d.base), backgroundColor: '#475569', borderColor: '#64748b', borderWidth: 1 },
          { label: t('pricing_new'), data: Object.values(groupData).map(d => d.new), backgroundColor: '#6366f1', borderColor: '#818cf8', borderWidth: 1 }
        ]
      },
      options: {
        indexAxis: 'y', responsive: true,
        plugins: { legend: { labels: { color: '#94a3b8' } } },
        scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, y: { ticks: { color: '#94a3b8' }, grid: { display: false } } }
      }
    });
  }

  const catData = {};
  companyData.forEach(c => {
    Object.entries(_pricingData[c.name].categories).forEach(([cat, baseVal]) => {
      const catTotal = (baseVal !== null && typeof baseVal === 'object') ? (baseVal.total ?? 0) : (baseVal || 0);
      if (!catData[cat]) catData[cat] = 0;
      catData[cat] += catTotal *
        (1 + (_pricingAdjustments.global || 0) / 100) *
        (1 + (_pricingAdjustments.groups[c.group] || 0) / 100) *
        (1 + (_pricingAdjustments.categories[cat] || 0) / 100) *
        (1 + (_pricingAdjustments.companies[c.name] || 0) / 100);
    });
  });

  const ctx2 = document.getElementById('revenueByCategeoryChart');
  if (ctx2) {
    _pricingCharts.byCategory = new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: Object.keys(catData),
        datasets: [{ data: Object.values(catData),
          backgroundColor: ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#84cc16','#22c55e','#10b981','#06b6d4','#0ea5e9'],
          borderWidth: 0 }]
      },
      options: { responsive: true, plugins: { legend: { position: 'right', labels: { color: '#94a3b8', padding: 10, font: { size: 10 } } } } }
    });
  }

  const top15 = [...companyData].sort((a, b) => b.newMonthly - a.newMonthly).slice(0, 15);
  const ctx3 = document.getElementById('topCompaniesChart');
  if (ctx3) {
    _pricingCharts.topCompanies = new Chart(ctx3, {
      type: 'bar',
      data: {
        labels: top15.map(c => c.name),
        datasets: [{ label: t('pricing_new'), data: top15.map(c => c.newMonthly), backgroundColor: '#6366f1', borderColor: '#818cf8', borderWidth: 1 }]
      },
      options: {
        indexAxis: 'y', responsive: true,
        plugins: { legend: { labels: { color: '#94a3b8' } } },

let _pricingTableData = [];
let _pricingTableSort = { field: 'name', asc: true };

function renderPricingTable(companyData) {
  _pricingTableData = companyData;
  let filtered = companyData;
  const filterVal = document.getElementById('companyFilter')?.value || '';
  if (filterVal) {
    const q = filterVal.toLowerCase();
    filtered = companyData.filter(c => c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
  }

  filtered.sort((a, b) => {
    let aVal = a[_pricingTableSort.field];
    let bVal = b[_pricingTableSort.field];
    if (typeof aVal === 'string') { aVal = aVal.toLowerCase(); bVal = (bVal||'').toLowerCase(); }
    return _pricingTableSort.asc ? (aVal > bVal ? 1 : -1) : (aVal < bVal ? 1 : -1);
  });

  const tbody = document.getElementById('pricingTableBody');
  if (!tbody) return;
  tbody.innerHTML = filtered.map((c, i) => {
    const compAdj = _pricingAdjustments.companies[c.name] || 0;
    return `
    <tr style="background:${i % 2 === 0 ? 'transparent' : 'rgba(99,102,241,0.05)'}">
      <td style="font-size:11px;">${i + 1}</td>
      <td style="font-size:11px;font-weight:600;">${esc(c.name)}</td>
      <td style="font-size:11px;">${esc(c.group)}</td>
      <td class="text-right" style="font-size:11px;">${formatCurrency(c.baseMonthly)}</td>
      <td class="text-right" style="font-size:11px;">${formatCurrency(c.newMonthly)}</td>
      <td class="text-right ${c.diff >= 0 ? 'text-green-400' : 'text-red-400'}" style="font-size:11px;">${formatCurrency(c.diff)}</td>
      <td class="text-right ${c.pct >= 0 ? 'text-green-400' : 'text-red-400'}" style="font-size:11px;">${c.pct.toFixed(1)}%</td>
      <td style="min-width:140px;">
        <div class="flex items-center gap-2">
          <input type="range" data-tbl-company="${c.name}" min="-50" max="100" value="${compAdj}" step="1"
            style="width:80px;cursor:pointer;accent-color:#8b5cf6;" oninput="updatePricingCompanyFromTable(this.dataset.tblCompany, this.value)">
          <span class="text-xs text-indigo-400 font-bold" style="min-width:32px;" data-tbl-comp-value="${c.name}">${compAdj}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function filterPricingTable(val) {
  renderPricingTable(_pricingTableData);
}

function sortPricingTable(field) {
  if (_pricingTableSort.field === field) {
    _pricingTableSort.asc = !_pricingTableSort.asc;
  } else {
    _pricingTableSort.field = field;
    _pricingTableSort.asc = true;
  }
  renderPricingTable(_pricingTableData);
}

function toggleCategoryAccordion(catId) {

    accordion.style.display = accordion.style.display === 'none' ? '' : 'none';
    if (icon) {
      icon.style.transform = accordion.style.display === 'none' ? 'rotate(0deg)' : 'rotate(180deg)';
    }
  }
}

function onServiceEdit(input) {
  const comp = input.dataset.editComp;
  const cat = input.dataset.editCat;
  const svcIdx = parseInt(input.dataset.editSvc);
  const field = input.dataset.editField; // 'qty' or 'price'
  const newVal = parseFloat(input.value) || 0;

  // Update the service data
  const data = _pricingData[comp];
  if (!data || !data.categories[cat] || !data.categories[cat].services) return;

  const service = data.categories[cat].services[svcIdx];
  if (!service) return;

  if (field === 'qty') {
    service.qty = Math.max(0, parseInt(newVal) || 0);
  } else if (field === 'price') {
    service.price = Math.max(0, newVal);
  }

  // Recalculate service total
  service.total = (service.qty || 0) * (service.price || 0);

  // Recalculate ALL service totals in category (fix: stored totals may be stale/zero)
  data.categories[cat].services.forEach(s => { s.total = (s.qty || 0) * (s.price || 0); });
  const catTotal = data.categories[cat].services.reduce((sum, s) => sum + (s.total || 0), 0);
  data.categories[cat].total = catTotal;

  // Recalculate ALL category totals from their services (fix: stored totals may be stale)
  Object.values(data.categories).forEach(v => {
    if (v !== null && typeof v === 'object' && Array.isArray(v.services)) {
      v.services.forEach(s => { s.total = (s.qty || 0) * (s.price || 0); });
      v.total = v.services.reduce((sum, s) => sum + (s.total || 0), 0);
    }
  });
  // Recalculate company monthly/annual
  const compTotal = Object.values(data.categories).reduce((s, v) => s + ((v !== null && typeof v === 'object') ? (v.total ?? 0) : (v || 0)), 0);
  data.monthly = Math.round(compTotal * 100) / 100;
  data.annual = Math.round(compTotal * 12 * 100) / 100;

  // Update UI (use safe selectors for special chars in names)
  const svcTotalEl = qsAttr('data-svc-total', `${comp}-${cat}-${svcIdx}`);
  if (svcTotalEl) svcTotalEl.textContent = formatCurrency(service.total);

  const tm = document.getElementById('editTotalMonthly');
  if (tm) tm.textContent = formatCurrency(compTotal);
  const ta = document.getElementById('editTotalAnnual');
  if (ta) ta.textContent = formatCurrency(compTotal * 12);
  const ft = document.getElementById('editFooterTotal');
  if (ft) ft.textContent = formatCurrency(compTotal);

  // Update category header total
  const catHeaderTotal = qsAttr('data-cat-header-total', `${comp}-${cat}`);
  if (catHeaderTotal) catHeaderTotal.textContent = formatCurrency(catTotal);

  // Update sidebar monthly display
  const sideItem = qsAttr('data-edit-company', comp);
  if (sideItem) { const sub = sideItem.querySelector('.text-xs'); if (sub) sub.textContent = formatCurrency(compTotal) + '/ay'; }

  // Mark dirty — enable ALL Save/Reset buttons (footer + inside accordions)
  _pricingEditDirty = true;
  const btnSave = document.getElementById('btnSaveEdit');
  const btnReset = document.getElementById('btnResetEdit');
  const badge = document.getElementById('editDirtyBadge');
  if (btnSave) { btnSave.style.opacity = '1'; btnSave.style.pointerEvents = 'auto'; }
  if (btnReset) { btnReset.style.opacity = '1'; btnReset.style.pointerEvents = 'auto'; }
  if (badge) badge.style.display = 'block';
  document.querySelectorAll('.cat-save-btn, .cat-reset-btn').forEach(b => { b.style.opacity = '1'; b.style.pointerEvents = 'auto'; });

  // Highlight changed input
  input.style.borderColor = '#f59e0b';
  // Show original value tooltip
  if (_pricingEditSnapshot) {
    const origCat = _pricingEditSnapshot.categories[cat];
    if (origCat && origCat.services && origCat.services[svcIdx]) {
      const origVal = origCat.services[svcIdx][field];
      const hint = input.parentElement.querySelector('.orig-hint');
      if (!hint && origVal !== undefined && parseFloat(origVal) !== parseFloat(input.value)) {
        const span = document.createElement('span');
        span.className = 'orig-hint';
        span.style.cssText = 'font-size:10px;color:#94a3b8;display:block;margin-top:2px;';
        span.textContent = t('pricing_original') + ': ' + origVal;
        input.parentElement.appendChild(span);
      }
    }
  }

  // NO auto-save — user must click Save
}


function selectEditCompany(name) {
  // Warn if unsaved changes
  if (_pricingEditDirty && _pricingEditCompany && _pricingEditCompany !== name) {
    if (!confirm(t('pricing_unsaved') + '. ' + t('pricing_reset') + '?')) return;
    resetPricingEdits();
  }
  _pricingEditCompany = name;
  _pricingEditDirty = false;
  // Deep copy snapshot for reset
  _pricingEditSnapshot = JSON.parse(JSON.stringify(_pricingData[name]));
  const categories = Object.keys(Object.values(_pricingData)[0].categories);
  const panel = document.getElementById('editPanel');
  if (panel) panel.innerHTML = renderCompanyEditPanel(name, categories);
  // Highlight active company
  document.querySelectorAll('.edit-company-item').forEach(el => {
    const isActive = el.dataset.editCompany === name;
    el.className = `edit-company-item px-3 py-2 rounded-lg text-sm cursor-pointer transition ${isActive ? 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/50' : 'hover:bg-slate-800'}`;
  });
}

function onPriceEdit(input) {
  const cat = input.dataset.editCat;
  const comp = input.dataset.editComp;
  const newVal = parseFloat(input.value) || 0;

  // Update local data (backward compatibility for flat structure)
  const catData = _pricingData[comp].categories[cat];
  if (typeof catData === 'number' || !catData.services) {
    // Old structure: just a number
    _pricingData[comp].categories[cat] = newVal;
  } else {
    // New structure: has services
    catData.total = newVal;
  }

  const total = Object.values(_pricingData[comp].categories).reduce((s, v) => s + (v.total !== undefined ? v.total : v), 0);
  _pricingData[comp].monthly = Math.round(total * 100) / 100;
  _pricingData[comp].annual = Math.round(total * 12 * 100) / 100;

  // Update totals display
  const tm = document.getElementById('editTotalMonthly');
  if (tm) tm.textContent = formatCurrency(total);
  const ta = document.getElementById('editTotalAnnual');
  if (ta) ta.textContent = formatCurrency(total * 12);
  const ft = document.getElementById('editFooterTotal');
  if (ft) ft.textContent = formatCurrency(total);

  // Update sidebar monthly display for this company
  const sideItem = qsAttr('data-edit-company', comp);
  if (sideItem) { const sub = sideItem.querySelector('.text-xs'); if (sub) sub.textContent = formatCurrency(total) + '/ay'; }

  // Mark dirty for manual save
  _pricingEditDirty = true;
  const btnSave2 = document.getElementById('btnSaveEdit');
  const btnReset2 = document.getElementById('btnResetEdit');
  const badge2 = document.getElementById('editDirtyBadge');
  if (btnSave2) { btnSave2.style.opacity = '1'; btnSave2.style.pointerEvents = 'auto'; }
  if (btnReset2) { btnReset2.style.opacity = '1'; btnReset2.style.pointerEvents = 'auto'; }
  if (badge2) badge2.style.display = 'block';
  document.querySelectorAll('.cat-save-btn, .cat-reset-btn').forEach(b => { b.style.opacity = '1'; b.style.pointerEvents = 'auto'; });
}

async function deleteCompany(companyName) {

  try {
    const resp = await fetch(`/api/pricing/company/${encodeURIComponent(companyName)}`, {
      method: 'DELETE',
      headers: api._getHeaders()

    if (token) headers['Authorization'] = 'Bearer ' + token;

    const resp = await fetch('/api/pricing/import', {
      method: 'POST',
      headers: headers,
      body: formData
    });

    const result = await resp.json();
