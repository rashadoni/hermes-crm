<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #020617; color: #e2e8f0; line-height: 1.6; }
        a { color: #60a5fa; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Layout */
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid #1e293b; }
        .sidebar-logo { font-size: 20px; font-weight: 700; color: #60a5fa; }
        .sidebar-subtitle { font-size: 12px; color: #64748b; margin-top: 2px; }
        .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
        .nav-section { padding: 0 12px; margin-bottom: 8px; }
        .nav-section-title { font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 600; padding: 8px 12px; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; margin: 2px 0; border-radius: 8px; cursor: pointer; color: #94a3b8; font-size: 14px; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; }
        .nav-item:hover { background: #1e293b; color: #e2e8f0; }
        .nav-item.active { background: #1e3a5f; color: #60a5fa; font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .nav-badge { margin-left: auto; background: #dc2626; color: white; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; min-width: 20px; text-align: center; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: white; flex-shrink: 0; }
        .user-name { font-size: 13px; font-weight: 500; color: #e2e8f0; }
        .user-email { font-size: 11px; color: #64748b; overflow: hidden; text-overflow: ellipsis; }
        .user-meta { min-width: 0; flex: 1; }
        .logout-btn { background: none; border: none; color: #64748b; cursor: pointer; padding: 4px; border-radius: 4px; }
        .logout-btn:hover { color: #ef4444; background: #1e293b; }

        .main-content { margin-left: 260px; min-height: 100vh; }
        .top-bar { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .top-bar-title { font-size: 18px; font-weight: 600; }
        .top-bar-actions { display: flex; gap: 12px; align-items: center; }
        .page-content { padding: 32px; }

        /* Components */
        .input-field { width: 100%; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #f1f5f9; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-field::placeholder { color: #64748b; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        textarea.input-field { min-height: 100px; resize: vertical; font-family: inherit; }
        select.input-field { appearance: auto; cursor: pointer; }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
        .btn-secondary:hover { background: #334155; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }

        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .card-body { padding: 24px; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .stat-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; transition: border-color 0.2s; }
        .stat-card:hover { border-color: #334155; }
        .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; font-size: 20px; }
        .stat-icon.blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .stat-icon.green { background: rgba(34,197,94,0.15); color: #4ade80; }
        .stat-icon.purple { background: rgba(168,85,247,0.15); color: #c084fc; }
        .stat-icon.orange { background: rgba(249,115,22,0.15); color: #fb923c; }
        .stat-icon.red { background: rgba(239,68,68,0.15); color: #f87171; }
        .stat-value { font-size: 28px; font-weight: 700; color: #f8fafc; }
        .stat-label { font-size: 13px; color: #64748b; margin-top: 4px; }

        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-new { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .badge-open { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-closed { background: rgba(239,68,68,0.15); color: #f87171; }
        .badge-pending, .badge-draft { background: rgba(234,179,8,0.15); color: #facc15; }
        .badge-active { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-sent { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .badge-approved { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-high { background: rgba(239,68,68,0.15); color: #f87171; }
        .badge-medium { background: rgba(234,179,8,0.15); color: #facc15; }
        .badge-low { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 20px; color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #1e293b; background: #0a0f1e; }
        td { padding: 14px 20px; border-bottom: 1px solid #1e293b; font-size: 14px; }
        tr.clickable { cursor: pointer; transition: background 0.15s; }
        tr.clickable:hover { background: rgba(30,58,95,0.3); }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 16px; font-weight: 600; color: #e2e8f0; margin-bottom: 8px; }
        .empty-text { font-size: 14px; color: #64748b; }

        .comment-item { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
        .comment-author { font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .comment-date { font-size: 11px; color: #475569; }
        .comment-text { font-size: 14px; color: #e2e8f0; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #1e293b; }
        .detail-label { font-size: 12px; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
        .detail-value { font-size: 15px; color: #e2e8f0; font-weight: 500; }

        /* Auth */
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at top, #0f172a 0%, #020617 70%); }
        .auth-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-logo { font-size: 28px; font-weight: 700; color: #60a5fa; margin-bottom: 4px; }
        .auth-desc { font-size: 14px; color: #64748b; }
        .auth-card { background: #0f172a; padding: 32px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .auth-title { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .auth-link { background: none; border: none; color: #60a5fa; cursor: pointer; font-size: 14px; display: block; text-align: center; margin-top: 20px; }
        .auth-link:hover { text-decoration: underline; }

        /* Notifications */
        .notif-panel { position: fixed; top: 0; right: -380px; width: 380px; height: 100vh; background: #0f172a; border-left: 1px solid #1e293b; z-index: 200; transition: right 0.3s ease; box-shadow: -4px 0 20px rgba(0,0,0,0.3); }
        .notif-panel.open { right: 0; }
        .notif-header { padding: 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .notif-title { font-size: 16px; font-weight: 600; }
        .notif-close { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 4px; }
        .notif-close:hover { color: #e2e8f0; background: #1e293b; }
        .notif-list { overflow-y: auto; max-height: calc(100vh - 70px); padding: 12px; }
        .notif-item { padding: 14px 16px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s; border-left: 3px solid transparent; }
        .notif-item:hover { background: #1e293b; }
        .notif-item.unread { background: rgba(30,58,95,0.3); border-left-color: #3b82f6; }
        .notif-item-title { font-size: 13px; font-weight: 500; color: #e2e8f0; margin-bottom: 4px; }
        .notif-item-text { font-size: 12px; color: #64748b; }
        .notif-item-time { font-size: 11px; color: #475569; margin-top: 6px; }
        .notif-empty { text-align: center; padding: 40px 20px; color: #475569; font-size: 14px; }
        .notif-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 199; display: none; }
        .notif-overlay.open { display: block; }

        .notif-bell { position: relative; background: none; border: none; color: #94a3b8; cursor: pointer; padding: 8px; border-radius: 8px; transition: all 0.2s; }
        .notif-bell:hover { background: #1e293b; color: #e2e8f0; }
        .notif-bell svg { width: 22px; height: 22px; }
        .notif-count { position: absolute; top: 2px; right: 2px; background: #dc2626; color: white; font-size: 10px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* Toast */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
        .toast { padding: 14px 20px; border-radius: 10px; margin-top: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; animation: slideUp 0.3s ease; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .toast-error { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
        .toast-success { background: #14532d; color: #bbf7d0; border: 1px solid #166534; }
        .toast-info { background: #1e3a5f; color: #93c5fd; border: 1px solid #1e40af; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .lang-select { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-size: 13px; color: #e2e8f0; cursor: pointer; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
        }

        /* AI Chat Widget */
        .chat-fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border: none; color: white; cursor: pointer; box-shadow: 0 4px 24px rgba(59,130,246,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(.4,0,.2,1); }
        .chat-fab:hover { transform: scale(1.08); box-shadow: 0 6px 32px rgba(59,130,246,0.55); }
        .chat-fab svg { width: 28px; height: 28px; transition: opacity 0.2s; }
        .chat-fab .chat-fab-close { display: none; }
        .chat-fab.open .chat-fab-icon { display: none; }
        .chat-fab.open .chat-fab-close { display: block; }
        .chat-fab.open { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

        .chat-window { position: fixed; bottom: 96px; right: 24px; width: 400px; height: 560px; background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; box-shadow: 0 12px 48px rgba(0,0,0,0.6); z-index: 999; display: none; flex-direction: column; overflow: hidden; animation: chatSlideUp 0.3s ease-out; }
        .chat-window.open { display: flex; }
        @keyframes chatSlideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .chat-header { padding: 16px 20px; background: linear-gradient(135deg, #1e3a5f 0%, #1e1b4b 100%); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .chat-header-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .chat-header-avatar svg { width: 22px; height: 22px; color: white; }
        .chat-header-info { flex: 1; }
        .chat-header-info h4 { font-size: 15px; font-weight: 600; color: #f1f5f9; margin: 0; }
        .chat-header-status { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .chat-header-status .dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .chat-header-status span { font-size: 11px; color: #94a3b8; }

        .chat-messages { flex: 1; padding: 16px 16px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .chat-bubble-wrap { display: flex; flex-direction: column; gap: 2px; }
        .chat-bubble-wrap.user { align-items: flex-end; }
        .chat-bubble-wrap.ai { align-items: flex-start; }

        .chat-msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.65; word-wrap: break-word; overflow-wrap: break-word; }
        .chat-msg.ai { background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 6px; }
        .chat-msg.user { background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; border-bottom-right-radius: 6px; box-shadow: 0 2px 8px rgba(59,130,246,0.25); }
        .chat-msg.ai strong, .chat-msg.ai b { color: #93c5fd; font-weight: 600; }
        .chat-msg.ai em, .chat-msg.ai i { color: #a5b4fc; }
        .chat-msg.ai ul, .chat-msg.ai ol { margin: 6px 0 6px 18px; padding: 0; }
        .chat-msg.ai li { margin-bottom: 4px; }
        .chat-msg.ai p { margin: 0 0 6px; }
        .chat-msg.ai p:last-child { margin-bottom: 0; }
        .chat-msg.ai code { background: #0f172a; padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #a5b4fc; }
        .chat-msg.ai .ticket-card { background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 100%); border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; margin: 8px 0 4px; }
        .chat-msg.ai .ticket-card .tc-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
        .chat-msg.ai .ticket-card .tc-label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }
        .chat-msg.ai .ticket-card .tc-value { color: #e2e8f0; font-size: 13px; font-weight: 500; }

        .chat-tool-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; align-self: flex-start; margin-top: 2px; }
        .chat-tool-badge.escalate { background: linear-gradient(135deg, #7f1d1d, #991b1b); color: #fca5a5; }
        .chat-tool-badge.tool { background: #1e1b4b; color: #a5b4fc; }
        .chat-tool-badge svg { width: 12px; height: 12px; }

        .chat-time { font-size: 10px; color: #475569; margin-top: 2px; padding: 0 4px; }
        .chat-time.right { text-align: right; }

        .chat-msg.typing { background: #1e293b; color: #64748b; align-self: flex-start; border-bottom-left-radius: 6px; padding: 12px 18px; }
        .chat-msg.typing .dots { display: inline-flex; gap: 5px; }
        .chat-msg.typing .dots span { width: 7px; height: 7px; background: #64748b; border-radius: 50%; animation: chatdot 1.4s infinite; }
        .chat-msg.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
        .chat-msg.typing .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes chatdot { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }

        .chat-input-area { padding: 12px 16px 16px; border-top: 1px solid #1e293b; display: flex; gap: 8px; flex-shrink: 0; background: #0b1121; }
        .chat-input-area input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 11px 16px; color: #e2e8f0; font-size: 13.5px; outline: none; transition: border-color 0.2s; }
        .chat-input-area input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
        .chat-input-area input::placeholder { color: #475569; }
        .chat-send-btn { background: linear-gradient(135deg, #3b82f6, #6366f1); border: none; border-radius: 12px; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .chat-send-btn:hover { transform: scale(1.05); box-shadow: 0 2px 12px rgba(99,102,241,0.4); }
        .chat-send-btn:disabled { background: #334155; cursor: not-allowed; transform: none; box-shadow: none; }
        .chat-send-btn svg { width: 18px; height: 18px; color: white; }

        .chat-suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; flex-shrink: 0; }
        .chat-suggestion-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 12px; border-radius: 20px; font-size: 11.5px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .chat-suggestion-btn:hover { background: #334155; color: #e2e8f0; border-color: #6366f1; }
    </style>

</head>

            const c = document.getElementById('toast-container');

            t.innerHTML = `<span>${icons[type] || ''}</span><span>${message}</span>`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(16px)'; setTimeout(() => t.remove(), 300); }, 4000);
        }

        // ═══════════════════ API ═══════════════════
        async function api(method, endpoint, data = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (currentUser?.token) opts.headers['Authorization'] = 'Bearer ' + currentUser.token;
            if (data) opts.body = JSON.stringify(data);
            const res = await fetch(endpoint, opts);
            const json = await res.json();
            if (!res.ok) throw new Error(json.detail || json.error || 'API error');
            return json.data !== undefined ? json.data : json;
        }

        // ═══════════════════ AUTH ═══════════════════
        async function handleLogin(email, pwd) {
            try {
                const r = await api('POST', '/api/portal/login', { email, password: pwd });
                currentUser = r.user;
                currentUser.token = r.token;
                currentPage = 'dashboard';
                cachedData = { tickets: null, contracts: null, documents: null };
                await loadNotifications();
                render();
                showToast(t('welcome_back') + ', ' + (currentUser.full_name || '').split(' ')[0] + '!', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
        async function handleRegister(email, pwd, name) {
            try {
                await api('POST', '/api/portal/register', { email, password: pwd, full_name: name });
                await handleLogin(email, pwd);
            } catch (err) { showToast(err.message, 'error'); }
        }
        function handleLogout() {
            currentUser = null; currentPage = 'login'; ticketDetail = null; notifications = [];
            cachedData = { tickets: null, contracts: null, documents: null };
            render();
        }

        // ═══════════════════ DATA ═══════════════════
        async function loadTickets() {
            try { cachedData.tickets = await api('GET', '/api/portal/tickets'); } catch(e) { showToast(e.message); cachedData.tickets = []; }
            return cachedData.tickets;
        }
        async function loadContracts() {
            try { cachedData.contracts = await api('GET', '/api/portal/contracts'); } catch(e) { showToast(e.message); cachedData.contracts = []; }
            return cachedData.contracts;
        }
        async function loadDocuments() {
            try { cachedData.documents = await api('GET', '/api/portal/documents'); } catch(e) { showToast(e.message); cachedData.documents = []; }
            return cachedData.documents;
        }
        async function loadTicketDetail(id) {
            try { return await api('GET', '/api/portal/tickets/' + id); } catch(e) { showToast(e.message); return null; }
        }
        async function createTicket(subj, desc, pri, cat) {
            try { await api('POST', '/api/portal/tickets', { subject: subj, description: desc, priority: pri, category: cat });
                cachedData.tickets = null; currentPage = 'tickets'; showToast(t('new_ticket') + ' \u2014 OK!', 'success'); render();
            } catch(e) { showToast(e.message); }
        }
        async function addComment(tid, text) {
            try { await api('POST', '/api/portal/tickets/' + tid + '/comments', { comment: text });
                ticketDetail = await loadTicketDetail(tid); showToast(t('comments') + ' \u2014 OK!', 'success'); render();
            } catch(e) { showToast(e.message); }
        }

        async function loadNotifications() {
            try {
                const data = await api('GET', '/api/portal/notifications');
                notifications = (data || []).map(n => ({
                    id: n.id, title: n.title, text: n.message || '',
                    time: n.created_at ? new Date(n.created_at).toLocaleString() : '',
                    unread: !n.is_read, entity_type: n.entity_type, entity_id: n.entity_id
                }));
            } catch(e) { notifications = []; }
        }

        // ═══════════════════ HELPERS ═══════════════════
        function getInitials(name) { return (name || 'U').split(' ').map(w => w[0]).join('').toUpperCase().substring(0,2); }
        function statusBadge(s) { return '<span class="badge badge-' + s + '">' + s + '</span>'; }
        function priBadge(p) { return '<span class="badge badge-' + p + '">' + (T[L] && T[L][p] || p) + '</span>'; }
        function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : '-'; }
        function fmtAmount(a, cur) { return (cur ? cur + ' ' : '') + Number(a || 0).toLocaleString(); }

        function switchPage(p) { currentPage = p; ticketDetail = null; render(); }

            const unread = notifications.filter(n => n.unread).length;

                '</div></div>';

        async function handleChangePassword() {
            var oldPw = document.getElementById('cp-old').value;
            var newPw = document.getElementById('cp-new').value;
            var confirmPw = document.getElementById('cp-confirm').value;
            if (newPw !== confirmPw) { showToast(t('passwords_no_match'), 'error'); return; }
            try {
                var res = await api.post('/api/portal/change-password', { old_password: oldPw, new_password: newPw });
                if (res.ok) {
                    showToast(t('password_changed'), 'success');
                    document.getElementById('cp-old').value = '';
                    document.getElementById('cp-new').value = '';
                    document.getElementById('cp-confirm').value = '';
                } else {
                    var d = await res.json();
                    showToast(d.detail || 'Error', 'error');
                }
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        }

            const pageNames = { dashboard: t('dashboard'), tickets: t('tickets'), contracts: t('contracts'), documents: t('documents'), profile: t('profile') };
            app.innerHTML = renderSidebar() + renderNotifPanel() +
                '<div class="main-content">' + renderTopBar(ticketDetail ? t('ticket_num') + ticketDetail.ticket_number : pageNames[currentPage] || '') +

            if (ticketDetail) renderTicketDetail();

            else if (currentPage === 'contracts') await renderContracts();
            else if (currentPage === 'documents') await renderDocuments();
            else if (currentPage === 'profile') renderProfile();
        }

    <script>

    // Simple markdown → HTML converter
    function chatMd(text) {
        if (!text) return '';
        let h = text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/^[-\u2013\u2022]\s+(.+)$/gm, '<li>$1</li>')
            .replace(/^(\d+)\.\s+(.+)$/gm, '<li>$1. $2</li>')
            .replace(/\n/g, '<br>');
        // wrap consecutive <li> in <ul>
        h = h.replace(/(<li>.*?<\/li>(<br>)?)+/g, function(m) {
            return '<ul>' + m.replace(/<br>/g, '') + '</ul>';
        });
        return h;
    }

    function toggleChat() {
        chatOpen = !chatOpen;
        document.getElementById('chatFab').classList.toggle('open', chatOpen);
        document.getElementById('chatWindow').classList.toggle('open', chatOpen);
        if (chatOpen && !chatInitialized) {
            chatInitialized = true;
            const lang = localStorage.getItem('portalLang') || 'az';
            document.getElementById('chatInput').placeholder = lang === 'ru' ? 'Напишите сообщение...' : lang === 'en' ? 'Type a message...' : 'Mesaj\u0131n\u0131z\u0131 yaz\u0131n...';
            addChatBubble('ai', getGreeting());
            showSuggestions();
        }
        if (chatOpen) {
            setTimeout(() => document.getElementById('chatInput').focus(), 100);
        }
    }

    function getGreeting() {
        const name = (currentUser && currentUser.full_name) ? currentUser.full_name.split(' ')[0] : '';
        const lang = localStorage.getItem('portalLang') || 'az';
        if (lang === 'ru') return (name ? 'Привет, **' + name + '**! ' : 'Привет! ') + 'Я Hermes AI Assistant.\nЧем могу помочь? \u{1f4ac}';
        if (lang === 'en') return (name ? 'Hi **' + name + '**! ' : 'Hi! ') + "I'm Hermes AI Assistant.\nHow can I help you? \u{1f4ac}";
        return (name ? 'Salam, **' + name + '**! ' : 'Salam! ') + "M\u0259n Hermes AI Assistant-am.\nN\u0259d\u0259 k\xf6m\u0259k ed\u0259 bil\u0259r\u0259m? \u{1f4ac}";
    }

    function showSuggestions() {
        const lang = localStorage.getItem('portalLang') || 'az';
        const suggestions = lang === 'ru' ? [
            ['\u{1f4cb} Мои тикеты', 'Покажи мои открытые тикеты'],
            ['\u{1f4dd} Создать тикет', 'Хочу создать новый тикет'],
            ['\u{1f4c4} Контракты', 'Покажи мои контракты']
        ] : lang === 'en' ? [
            ['\u{1f4cb} My tickets', 'Show my open tickets'],
            ['\u{1f4dd} New ticket', 'I want to create a new ticket'],
            ['\u{1f4c4} Contracts', 'Show my contracts']
        ] : [
            ['\u{1f4cb} Tiketl\u0259rim', 'A\xe7\u0131q tiketl\u0259rimi g\xf6st\u0259r'],
            ['\u{1f4dd} Yeni tiket', 'Yeni tiket yaratmaq ist\u0259yir\u0259m'],
            ['\u{1f4c4} M\xfcqavil\u0259l\u0259r', 'M\xfcqavil\u0259l\u0259rimi g\xf6st\u0259r']
        ];
        const box = document.getElementById('chatSuggestions');
        box.innerHTML = suggestions.map(([label, msg]) =>
            '<button class="chat-suggestion-btn" onclick="useSuggestion(this, \'' + msg.replace(/'/g, "\\'") + '\')">' + label + '</button>'
        ).join('');
    }

    function useSuggestion(btn, msg) {
        document.getElementById('chatSuggestions').innerHTML = '';
        document.getElementById('chatInput').value = msg;
        sendChatMsg();
    }

    function getTimeStr() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addChatBubble(role, text, toolsUsed) {
        const box = document.getElementById('chatMessages');
        const wrap = document.createElement('div');
        wrap.className = 'chat-bubble-wrap ' + role;

        if (toolsUsed && toolsUsed.length) {
            const lang = localStorage.getItem('portalLang') || 'az';
            const toolNames = {
                get_tickets: { icon: '\u{1f4cb}', ru: 'Тикеты загружены', en: 'Tickets loaded', az: 'Tiketl\u0259r y\u00fckl\u0259ndi' },
                create_ticket: { icon: '\u2705', ru: 'Тикет создан', en: 'Ticket created', az: 'Tiket yarad\u0131ld\u0131' },
                get_contracts: { icon: '\u{1f4c4}', ru: 'Контракты загружены', en: 'Contracts loaded', az: 'M\u00fcqavil\u0259l\u0259r y\u00fckl\u0259ndi' },
                get_documents: { icon: '\u{1f4c2}', ru: 'Документы загружены', en: 'Documents loaded', az: 'S\u0259n\u0259dl\u0259r y\u00fckl\u0259ndi' },
                escalate_to_human: { icon: '\u{1f680}', ru: 'Передано менеджеру', en: 'Escalated to agent', az: 'Menecer\u0259 \u00f6t\u00fcr\u00fcld\u00fc' }
            };
            toolsUsed.forEach(t => {
                const info = toolNames[t];
                const badge = document.createElement('div');
                const isEsc = t === 'escalate_to_human';
                badge.className = 'chat-tool-badge ' + (isEsc ? 'escalate' : 'tool');
                badge.innerHTML = info ? (info.icon + ' ' + (info[lang] || info.en)) : t;
                wrap.appendChild(badge);
            });
        }

        const msg = document.createElement('div');
        msg.className = 'chat-msg ' + role;
        if (role === 'ai') {
            msg.innerHTML = chatMd(text);
        } else {
            msg.textContent = text;
        }
        wrap.appendChild(msg);

        const time = document.createElement('div');
        time.className = 'chat-time' + (role === 'user' ? ' right' : '');
        time.textContent = getTimeStr();
        wrap.appendChild(time);

        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
    }

    function showTyping() {
        const box = document.getElementById('chatMessages');
        const wrap = document.createElement('div');
        wrap.className = 'chat-bubble-wrap ai';
        wrap.id = 'chatTyping';
        const msg = document.createElement('div');
        msg.className = 'chat-msg typing';
        msg.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
        wrap.appendChild(msg);
        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('chatTyping');
        if (el) el.remove();
    }

    async function sendChatMsg() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        input.value = '';

        // Hide suggestions after first message
        document.getElementById('chatSuggestions').innerHTML = '';

        addChatBubble('user', msg);
        chatHistory.push({ role: 'user', content: msg });

        const btn = document.getElementById('chatSendBtn');
        btn.disabled = true;
        showTyping();

        try {
            const resp = await api('POST', '/api/portal/chat', {
                message: msg,
                history: chatHistory.slice(-10),
                session_id: chatSessionId
            });
            hideTyping();
            if (resp.session_id) chatSessionId = resp.session_id;
            else if (resp.data && resp.data.session_id) chatSessionId = resp.data.session_id;
            const aiText = resp.response || (resp.data && resp.data.response) || 'No response';
            const toolsUsed = resp.tools_used || (resp.data && resp.data.tools_used) || [];
            const qualityIndicators = resp.quality_indicators || (resp.data && resp.data.quality_indicators) || {};

            addChatBubble('ai', aiText, toolsUsed);
            chatHistory.push({ role: 'assistant', content: aiText });

            // Show quality indicators if low confidence — suggest escalation or ticket
            if (qualityIndicators.suggested_escalation) {
                setTimeout(() => {
                    const box = document.getElementById('chatMessages');
                    const wrap = document.createElement('div');
                    wrap.className = 'chat-bubble-wrap ai';
                    wrap.id = 'escalationSuggestion';
                    const pmsg = document.createElement('div');
                    pmsg.className = 'chat-msg ai';
                    const lang = localStorage.getItem('portalLang') || 'az';
                    const texts = {
                        ru: { q: 'Похоже, мне не удалось полностью решить ваш вопрос. Что бы вы хотели сделать?', esc: '👤 Связаться с менеджером', ticket: '📝 Создать тикет', dismiss: 'Всё ок' },
                        en: { q: "It seems I couldn't fully resolve your question. What would you like to do?", esc: '👤 Talk to a human agent', ticket: '📝 Create a ticket', dismiss: "I'm fine" },
                        az: { q: 'Sualınızı tam həll edə bilmədim. Nə etmək istərdiniz?', esc: '👤 Menecerlə əlaqə', ticket: '📝 Tiket yaratmaq', dismiss: 'Hər şey yaxşıdır' }
                    };
                    const t = texts[lang] || texts.az;
                    pmsg.innerHTML = '<p style="font-size:13px;margin-bottom:10px">' + t.q + '</p>' +
                        '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
                        '<button onclick="useEscalationAction(\'escalate\')" style="background:linear-gradient(135deg,#dc2626,#b91c1c);color:white;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500">' + t.esc + '</button>' +
                        '<button onclick="useEscalationAction(\'ticket\')" style="background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500">' + t.ticket + '</button>' +
                        '<button onclick="document.getElementById(\'escalationSuggestion\').remove()" style="background:#334155;color:#94a3b8;border:1px solid #475569;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px">' + t.dismiss + '</button>' +
                        '</div>';
                    wrap.appendChild(pmsg);
                    box.appendChild(wrap);
                    box.scrollTop = box.scrollHeight;
                }, 300);
            }

            // Show CSAT rating after 3+ messages
            if (chatHistory.filter(h => h.role === 'user').length >= 3) {
                setTimeout(() => {
                    const box = document.getElementById('chatMessages');
                    const wrap = document.createElement('div');
                    wrap.className = 'chat-bubble-wrap ai';
                    wrap.id = 'csatRating';
                    const msg = document.createElement('div');
                    msg.className = 'chat-msg ai';
                    msg.innerHTML = '<p style="font-size:13px;margin-bottom:8px">Rate this conversation:</p>' +
                        '<div style="display:flex;gap:6px">' +
                        ['1', '2', '3', '4', '5'].map(r => '<button onclick="rateChatSession(' + r + ')" style="width:32px;height:32px;background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:6px;cursor:pointer;font-weight:600;transition:all 0.2s" onmouseover="this.style.background=\'#334155\';this.style.color=\'#f59e0b\'" onmouseout="this.style.background=\'#1e293b\';this.style.color=\'#94a3b8\'">' + r + '</button>').join('') +
                        '</div>';
                    wrap.appendChild(msg);
                    box.appendChild(wrap);
                    box.scrollTop = box.scrollHeight;
                }, 200);
            }

            // Poll for escalation updates if escalated
            if (toolsUsed && toolsUsed.includes('escalate_to_human')) {
                pollEscalationUpdates();
            }
        } catch (e) {
            hideTyping();
            const errLang = localStorage.getItem('portalLang') || 'az';
            const errMsg = errLang === 'ru' ? '\u26a0\ufe0f \u041f\u0440\u043e\u0438\u0437\u043e\u0448\u043b\u0430 \u043e\u0448\u0438\u0431\u043a\u0430. \u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0435\u0449\u0451 \u0440\u0430\u0437.' :
                           errLang === 'en' ? '\u26a0\ufe0f An error occurred. Please try again.' :
                           '\u26a0\ufe0f X\u0259ta ba\u015f verdi. Yenid\u0259n c\u0259hd edin.';
            addChatBubble('ai', errMsg);
        }
        btn.disabled = false;
        input.focus();
    }

    async function rateChatSession(rating) {
        const csatEl = document.getElementById('csatRating');
        if (csatEl) csatEl.remove();

        try {
            await api('POST', '/api/portal/chat/rate', {
                session_id: chatSessionId,
                rating: rating
            });
            addChatBubble('ai', '✅ Thank you for your feedback!');
        } catch (e) {
            console.error('Rating error:', e);
        }
    }

    function useEscalationAction(action) {
        const el = document.getElementById('escalationSuggestion');
        if (el) el.remove();
        const lang = localStorage.getItem('portalLang') || 'az';
        let msg;
        if (action === 'escalate') {
            msg = lang === 'ru' ? 'Да, свяжите меня с менеджером' :
                  lang === 'en' ? 'Yes, please connect me with a human agent' :
                  'Bəli, məni menecerlə əlaqələndirin';
        } else {
            msg = lang === 'ru' ? 'Создай тикет по моему вопросу' :
                  lang === 'en' ? 'Please create a ticket for my issue' :
                  'Mənim sualım üçün tiket yarat';
        }
        document.getElementById('chatInput').value = msg;
        sendChatMsg();
    }

    let escalationPollInterval = null;
    let lastSeenCommentId = 0;
    async function pollEscalationUpdates() {
        if (escalationPollInterval) return;
        const lang = localStorage.getItem('portalLang') || 'az';
        const waitMsg = lang === 'ru' ? '⏳ Ваш запрос передан менеджеру. Ожидайте ответа...' :
                        lang === 'en' ? '⏳ Your request has been forwarded to an agent. Please wait...' :
                        '⏳ Sorğunuz menecerə ötürüldü. Cavabı gözləyin...';
        addChatBubble('ai', waitMsg);
        escalationPollInterval = setInterval(async () => {
            try {
                const resp = await api('GET', '/api/portal/chat/escalation-updates?session_id=' + chatSessionId, null);
                const data = resp.data || resp;
                if (data.has_updates && data.comments && data.comments.length > 0) {
                    data.comments.forEach(comment => {
                        if (comment.id > lastSeenCommentId) {
                            const authorLabel = '**🧑‍💼 ' + (comment.author || 'Agent') + ':** ';
                            addChatBubble('ai', authorLabel + comment.content, ['escalate_to_human']);
                            lastSeenCommentId = comment.id;
                        }
                    });
                    if (data.ticket_status && ['resolved', 'closed'].includes(data.ticket_status)) {
                        clearInterval(escalationPollInterval);
                        escalationPollInterval = null;
                        const closedMsg = lang === 'ru' ? '✅ Ваш тикет был решён. Спасибо за обращение!' :
                                          lang === 'en' ? '✅ Your ticket has been resolved. Thank you!' :
                                          '✅ Tiketiniz həll edildi. Müraciətiniz üçün təşəkkürlər!';
                        addChatBubble('ai', closedMsg);
                    }
                }
            } catch (e) {
                console.error('Escalation poll error:', e);
            }
        }, 5000);
    }
    </script>
</body>
</html>
