<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }
        .input-field { width: 100%; padding: 8px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #f1f5f9; font-size: 14px; box-sizing: border-box; outline: none; }
        .input-field::placeholder { color: #94a3b8; }
        .input-field:focus { border-color: #3b82f6; }
        .btn-primary { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { padding: 8px 16px; background: #334155; color: #f1f5f9; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { padding: 8px 16px; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .table-row { border-bottom: 1px solid #334155; transition: background 0.2s; }
        .table-row:hover { background: #0f172a; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge-open { background: #14532d; color: #bbf7d0; }
        .badge-closed { background: #7f1d1d; color: #fecaca; }
        .badge-pending { background: #713f12; color: #fef08a; }
        .badge-new { background: #1e3a5f; color: #93c5fd; }
        .badge-high { background: #7f1d1d; color: #fecaca; }
        .badge-medium { background: #713f12; color: #fef08a; }
        .badge-low { background: #1e3a5f; color: #bfdbfe; }
        .nav-bar { background: #0f172a; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 50; }
        .nav-inner { max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
        .nav-links { display: flex; gap: 24px; align-items: center; }
        .nav-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 14px; padding: 4px 0; transition: color 0.2s; }
        .nav-btn:hover, .nav-btn.active { color: #60a5fa; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; overflow: hidden; }
        .page-container { max-width: 1280px; margin: 0 auto; padding: 32px 16px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 100%; max-width: 400px; }
        .auth-card { background: #0f172a; padding: 32px; border-radius: 8px; border: 1px solid #1e293b; }
        .form-group { margin-bottom: 16px; }
        .form-group-lg { margin-bottom: 24px; }
        .text-center { text-align: center; }
        .text-muted { color: #94a3b8; }
        .text-blue { color: #60a5fa; }
        .text-sm { font-size: 14px; }
        .text-lg { font-size: 18px; }
        .text-xl { font-size: 20px; }
        .text-2xl { font-size: 24px; }
        .text-3xl { font-size: 30px; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .mb-2 { margin-bottom: 8px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-6 { margin-bottom: 24px; }
        .mb-8 { margin-bottom: 32px; }
        .mt-2 { margin-top: 8px; }
        .mt-6 { margin-top: 24px; }
        .p-4 { padding: 16px; }
        .p-6 { padding: 24px; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .flex { display: flex; }
        .grid { display: grid; }
        .grid-cols-2 { grid-template-columns: 1fr 1fr; }
        .w-full { width: 100%; }
        .cursor-pointer { cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px; color: #94a3b8; font-size: 13px; font-weight: 600; border-bottom: 1px solid #334155; }
        td { padding: 16px; }
        .lang-select { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 4px 8px; font-size: 13px; color: #f1f5f9; }
        textarea.input-field { min-height: 80px; resize: vertical; }
        select.input-field { appearance: auto; }
        .link-btn { background: none; border: none; color: #60a5fa; cursor: pointer; font-size: 14px; }
        .link-btn:hover { text-decoration: underline; }
        .whitespace-pre { white-space: pre-wrap; }
        .overflow-auto { max-height: 400px; overflow-y: auto; }
        .comment-box { background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
        .pb-6 { padding-bottom: 24px; }
        .border-b { border-bottom: 1px solid #334155; }
        /* Toast notifications */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { padding: 12px 20px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; animation: fadeIn 0.3s ease; max-width: 400px; }
        .toast-error { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
        .toast-success { background: #14532d; color: #bbf7d0; border: 1px solid #166534; }
        .toast-info { background: #1e3a5f; color: #93c5fd; border: 1px solid #1e40af; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body style="background:#020617;color:#f1f5f9;">

            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);

            }
        };

        let L = 'en';
        const _t = (en, ru, az) => {
            if (L === 'ru') return ru;
            if (L === 'az') return az;
            return en;
        };

        // Global state
        let currentUser = null;
        let currentPage = 'login';
        let currentTicketDetail = null;

        // API calls
        async function apiCall(method, endpoint, data = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (currentUser?.token) {
                options.headers['Authorization'] = `Bearer ${currentUser.token}`;
            }
            if (data) options.body = JSON.stringify(data);

            const response = await fetch(endpoint, options);
            const result = await response.json();
            if (!response.ok) throw new Error(result.detail || result.error || 'API error');
            return result.data !== undefined ? result.data : result;
        }

        async function handleRegister(email, password, fullName) {
            try {
                await apiCall('POST', '/api/portal/register', {
                    email, password, full_name: fullName
                });
                // Auto-login after registration
                await handleLogin(email, password);
            } catch (err) {
                showToast(_t('Registration failed: ' + err.message, 'Ошибка регистрации: ' + err.message, 'Qeydiyyat uğursuz: ' + err.message));
            }
        }

        async function handleLogin(email, password) {
            try {
                const result = await apiCall('POST', '/api/portal/login', {
                    email, password
                });
                currentUser = result.user;
                currentUser.token = result.token;
                currentPage = 'tickets';
                render();
            } catch (err) {
                showToast(_t('Login failed: ' + err.message, 'Ошибка входа: ' + err.message, 'Daxil olmaq uğursuz: ' + err.message));
            }
        }

        function handleLogout() {
            currentUser = null;
            currentPage = 'login';
            currentTicketDetail = null;
            render();
        }

        async function loadTickets() {
            try {
                return await apiCall('GET', '/api/portal/tickets');
            } catch (err) {
                showToast(_t('Failed to load tickets', 'Ошибка загрузки билетов', 'Biletləri yükləmə uğursuz'));
                return [];
            }
        }

        async function loadContracts() {
            try {
                return await apiCall('GET', '/api/portal/contracts');
            } catch (err) {
                showToast(_t('Failed to load contracts', 'Ошибка загрузки контрактов', 'Müqavilələri yükləmə uğursuz'));
                return [];
            }
        }

        async function loadDocuments() {
            try {
                return await apiCall('GET', '/api/portal/documents');
            } catch (err) {
                showToast(_t('Failed to load documents', 'Ошибка загрузки документов', 'Sənədləri yükləmə uğursuz'));
                return [];
            }
        }

        async function loadTicketDetail(id) {
            try {
                return await apiCall('GET', `/api/portal/tickets/${id}`);
            } catch (err) {
                showToast(_t('Failed to load ticket', 'Ошибка загрузки билета', 'Bileti yükləmə uğursuz'));
                return null;
            }
        }

        async function createTicket(subject, description, priority, category) {
            try {
                await apiCall('POST', '/api/portal/tickets', {
                    subject, description, priority, category
                });
                currentPage = 'tickets';
                render();
            } catch (err) {
                showToast(_t('Failed to create ticket', 'Ошибка создания билета', 'Bilet yaratmaq uğursuz'));
            }
        }

        async function addComment(ticketId, comment) {
            try {
                await apiCall('POST', `/api/portal/tickets/${ticketId}/comments`, { comment });
                const detail = await loadTicketDetail(ticketId);
                currentTicketDetail = detail;
                render();
            } catch (err) {
                showToast(_t('Failed to add comment', 'Ошибка добавления комментария', 'Şərh əlavə etmə uğursuz'));
            }
        }

        // UI Components
        function LoginForm() {
            let email = '', password = '';
            return `
                <div class="auth-container">
                    <div class="auth-box">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-bold text-blue mb-2">Hermes Portal</h1>
                            <p class="text-muted">${_t('Client Portal', 'Клиентский портал', 'Kliyent Portalı')}</p>
                        </div>
                        <div class="auth-card">
                            <h2 class="text-xl font-bold mb-6">${_t('Sign In', 'Вход', 'Daxil ol')}</h2>
                            <form onsubmit="event.preventDefault(); handleLogin(document.getElementById('login-email').value, document.getElementById('login-password').value)">
                                <input type="email" id="login-email" class="input-field mb-4" placeholder="${_t('Email', 'Email', 'Email')}" required>
                                <input type="password" id="login-password" class="input-field mb-6" placeholder="${_t('Password', 'Пароль', 'Şifrə')}" required>
                                <button type="submit" class="btn-primary w-full mb-4">${_t('Sign In', 'Войти', 'Daxil ol')}</button>
                            </form>
                            <button onclick="switchAuthMode()" class="link-btn w-full text-center">

                            </button>

                    </div>
                </div>
            `;
        }

            return `

                    <div class="auth-box">
                        <div class="text-center mb-8">

        function TicketDetailPage() {
            if (!currentTicketDetail) return '<div class="text-center py-8">${_t("Loading...", "Загрузка...", "Yüklənir...")}</div>';
            const t = currentTicketDetail;
            const statusClass = t.status === 'open' ? 'badge-open' : t.status === 'closed' ? 'badge-closed' : 'badge-pending';
            const priorityClass = t.priority === 'high' ? 'badge-high' : t.priority === 'medium' ? 'badge-medium' : 'badge-low';
            return `
                <div class="max-w-4xl mx-auto px-4 py-8">
                    <button onclick="backToTickets()" class="btn-secondary mb-6">${_t('Back', 'Назад', 'Geri')}</button>
                    <div class="card p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 class="text-2xl font-bold">${_t('Ticket #', 'Билет №', 'Bilet №')}${t.ticket_number}</h2>
                                <p class="text-muted">${t.subject}</p>
                            </div>
                            <div class="flex gap-2">
                                <span class="badge ${statusClass}">${t.status}</span>
                                <span class="badge ${priorityClass}">${t.priority}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-6 pb-6 border-b">
                            <div>
                                <label class="text-muted text-sm">${_t('Category', 'Категория', 'Kateqoriya')}</label>
                                <p>${t.category}</p>
                            </div>
                            <div>
                                <label class="text-muted text-sm">${_t('Date', 'Дата', 'Tarix')}</label>
                                <p>${new Date(t.created_at).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div class="mb-6">
                            <label class="text-slate-400 text-sm block mb-2">${_t('Description', 'Описание', 'Təsvir')}</label>
                            <p class="whitespace-pre">${t.description}</p>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold mb-4">${_t('Comments', 'Комментарии', 'Şərhlər')}</h3>
                            <div class="overflow-auto mb-6">
                                ${(t.comments || []).map(c => `
                                    <div class="comment-box">
                                        <p class="text-sm text-slate-400">${c.author} - ${new Date(c.created_at).toLocaleString()}</p>
                                        <p class="mt-2">${c.comment || c.text}</p>
                                    </div>
                                `).join('')}
                            </div>
                            ${t.status !== 'closed' ? `
                                <form onsubmit="event.preventDefault(); submitComment()">
                                    <textarea id="comment-text" class="input-field mb-2 h-20" placeholder="${_t('Add Comment', 'Добавить комментарий', 'Şərh Əlavə et')}" required></textarea>
                                    <button type="submit" class="btn-primary">${_t('Send', 'Отправить', 'Göndər')}</button>
                                </form>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Page switching
        function switchPage(page) {
            currentPage = page;
            currentTicketDetail = null;
            render();
        }

        function switchAuthMode() {
            currentPage = currentPage === 'login' ? 'register' : 'login';
            render();
        }

        function changeLanguage(lang) {
            L = lang;
            render();
        }

        function showNewTicketForm() {
            document.getElementById('new-ticket-form').style.display = 'block';
        }

        function hideNewTicketForm() {
            document.getElementById('new-ticket-form').style.display = 'none';
        }

        async function submitNewTicket() {
            const subject = document.getElementById('ticket-subject').value;
            const description = document.getElementById('ticket-description').value;
            const priority = document.getElementById('ticket-priority').value;
            const category = document.getElementById('ticket-category').value;
            await createTicket(subject, description, priority, category);
        }

        function backToTickets() {
            currentTicketDetail = null;
            currentPage = 'tickets';
            render();
        }

        async function viewTicketDetail(id) {
            currentTicketDetail = await loadTicketDetail(id);
            render();
        }

        async function submitComment() {
            const text = document.getElementById('comment-text').value;
            await addComment(currentTicketDetail.id, text);
        }

        // Main render function
        async function render() {
            const app = document.getElementById('app');

            if (!currentUser) {
                app.innerHTML = currentPage === 'register' ? RegisterForm() : LoginForm();
                return;
            }

            let content = '';

            if (currentTicketDetail) {
                content = TicketDetailPage();
            } else if (currentPage === 'tickets') {
                content = TicketsPage();
            } else if (currentPage === 'contracts') {
                content = ContractsPage();
            } else if (currentPage === 'documents') {
                content = DocumentsPage();
            } else if (currentPage === 'profile') {
                content = ProfilePage();
            }

            app.innerHTML = NavBar() + content;

            // Load data for current page
            if (currentPage === 'tickets' && !currentTicketDetail) {
                const tickets = await loadTickets();
                const html = tickets.length ? `
                    <table class="w-full">
                        <thead class="border-b">
                            <tr class="text-left text-slate-400 text-sm">
                                <th class="p-4">${_t('Ticket #', 'Билет №', 'Bilet №')}</th>
                                <th class="p-4">${_t('Subject', 'Тема', 'Mövzu')}</th>
                                <th class="p-4">${_t('Status', 'Статус', 'Status')}</th>
                                <th class="p-4">${_t('Priority', 'Приоритет', 'Prioritet')}</th>
                                <th class="p-4">${_t('Date', 'Дата', 'Tarix')}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tickets.map(t => {
                                const statusClass = t.status === 'open' ? 'badge-open' : t.status === 'closed' ? 'badge-closed' : 'badge-pending';
                                const priorityClass = t.priority === 'high' ? 'badge-high' : t.priority === 'medium' ? 'badge-medium' : 'badge-low';
                                return `
                                    <tr class="table-row cursor-pointer" onclick="viewTicketDetail(${t.id})">
                                        <td class="p-4">#${t.ticket_number}</td>
                                        <td class="p-4">${t.subject}</td>
                                        <td class="p-4"><span class="badge ${statusClass}">${t.status}</span></td>
                                        <td class="p-4"><span class="badge ${priorityClass}">${t.priority}</span></td>
                                        <td class="p-4 text-muted">${new Date(t.created_at).toLocaleDateString()}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                ` : `<div class="p-4 text-muted">${_t('No tickets found', 'Билеты не найдены', 'Bilet tapılmadı')}</div>`;
                document.getElementById('tickets-list').innerHTML = html;
            } else if (currentPage === 'contracts') {
                const contracts = await loadContracts();
                const html = contracts.length ? `
                    <table class="w-full">
                        <thead class="border-b">
                            <tr class="text-left text-slate-400 text-sm">
                                <th class="p-4">${_t('Title', 'Название', 'Başlıq')}</th>
                                <th class="p-4">${_t('Status', 'Статус', 'Status')}</th>
                                <th class="p-4">${_t('Amount', 'Сумма', 'Məbləğ')}</th>
                                <th class="p-4">${_t('Date', 'Дата', 'Tarix')}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${contracts.map(c => `
                                <tr class="table-row">
                                    <td class="p-4">${c.title}</td>
                                    <td class="p-4"><span class="badge badge-open">${c.status}</span></td>
                                    <td class="p-4">${c.amount}</td>
                                    <td class="p-4 text-muted">${new Date(c.start_date).toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                ` : `<div class="p-4 text-muted">${_t('No contracts found', 'Контракты не найдены', 'Müqavilə tapılmadı')}</div>`;
                document.getElementById('contracts-list').innerHTML = html;
            } else if (currentPage === 'documents') {
                const documents = await loadDocuments();
                const html = documents.length ? `
                    <table class="w-full">
                        <thead class="border-b">
                            <tr class="text-left text-slate-400 text-sm">
                                <th class="p-4">${_t('Number', 'Номер', 'Nömrə')}</th>
                                <th class="p-4">${_t('Type', 'Тип', 'Tip')}</th>
                                <th class="p-4">${_t('Status', 'Статус', 'Status')}</th>
                                <th class="p-4">${_t('Amount', 'Сумма', 'Məbləğ')}</th>
                                <th class="p-4">${_t('Valid Until', 'Действителен до', 'Etibarlı qədər')}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${documents.map(d => `
                                <tr class="table-row">
                                    <td class="p-4">${d.offer_number || d.number}</td>
                                    <td class="p-4">${d.offer_type || d.type}</td>
                                    <td class="p-4"><span class="badge badge-pending">${d.status}</span></td>
                                    <td class="p-4">${d.total_amount || d.amount}</td>
                                    <td class="p-4 text-muted">${d.valid_until ? new Date(d.valid_until).toLocaleDateString() : '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                ` : `<div class="p-4 text-muted">${_t('No documents found', 'Документы не найдены', 'Sənəd tapılmadı')}</div>`;
                document.getElementById('documents-list').innerHTML = html;
            }
        }

        // Initial render
        render();
    </script>
</body>
</html>
